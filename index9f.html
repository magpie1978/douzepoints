<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fixed Video Modal – YouTube + Drive</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .video-item {
      cursor: pointer;
      background: #222;
      padding: 10px;
      border-radius: 8px;
      width: 300px;
    }

    .preview-container img {
      width: 100%;
      border-radius: 6px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #333;
      border-radius: 16px;
      padding: 20px;
      position: relative;
      width: 76vw;
      height: 90vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .modal-title-bar {
      position: absolute;
      top: -50px;
      left: 0;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 6px;
    }

    .close-button {
      position: absolute;
      top: -40px;
      right: -40px;
      font-size: 36px;
      color: white;
      cursor: pointer;
      z-index: 10000;
    }

    .close-button:hover {
      text-shadow: 0 0 4px white;
    }
  </style>
</head>
<body>

<h2>Fixed Modal Layout – YouTube + Google Drive</h2>

<div class="grid">
  <div class="video-item" onclick="openModalWithVideo('https://www.youtube.com/watch?v=kmg8EAD-Kjw', 'Baby Lasagna – Rim Tim Tagi Dim')">
    <div class="preview-container">
      <img src="https://img.youtube.com/vi/kmg8EAD-Kjw/hqdefault.jpg" alt="Baby Lasagna">
    </div>
  </div>

  <div class="video-item" onclick="openModalWithVideo('https://drive.google.com/file/d/1o6AnTVJ5m6cglxTOS4o-U-LtFbg9Nflt/view?usp=drive_link', 'Malmö 2024 Opening Ceremony')">
    <div class="preview-container">
      <img src="https://drive.google.com/thumbnail?id=1gL6Dw4mkcKztOf0FAJ69zm6KQQm5L11y" alt="Malmö 2024">
    </div>
  </div>
</div>

<!-- Modal -->
<div id="videoModal" class="modal" onclick="closeModal(event)">
  <div class="modal-content">
    <div id="modalTitle" class="modal-title-bar"></div>
    <span class="close-button" onclick="closeModal(event)">&times;</span>

    <div style="display: flex; flex-direction: column; height: 100%;">
      <div class="video-wrapper" style="flex: 1; display: flex; justify-content: center; align-items: center;">
        <video id="modalVideo" controls autoplay controlsList="nodownload" style="display: none; width: 100%; height: 100%;"></video>
        <iframe id="modalIframe" style="display: none; width: 100%; height: 100%;" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>

      <div class="modal-footer" style="margin-top: 12px; display: flex; gap: 16px; align-items: flex-start;">
        <img src="https://drive.google.com/thumbnail?id=1oUMt6BBMNyiR6-b7H4_815jDE5mjEZXG" alt="Flag" style="width: 60px; height: 60px; border-radius: 50%;">
        <div class="footer-text" style="line-height: 1.4; color: white;">
          <div><strong>Artist:</strong> Baby Lasagna</div>
          <div><strong>Song:</strong> Rim Tim Tagi Dim</div>
          <div><strong>Country:</strong> Croatia</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function openModalWithVideo(videoUrl, titleText) {
  const modal = document.getElementById("videoModal");
  const video = document.getElementById("modalVideo");
  const iframe = document.getElementById("modalIframe");
  const titleBar = document.getElementById("modalTitle");

  modal.style.display = "flex";
  video.style.display = "none";
  iframe.style.display = "none";
  video.pause();
  iframe.src = "";
  titleBar.textContent = titleText || '';

  if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
    let videoId = '';
    try {
      if (videoUrl.includes('youtu.be')) {
        videoId = videoUrl.split('/').pop().split('?')[0];
      } else {
        const url = new URL(videoUrl);
        videoId = url.searchParams.get('v');
      }
    } catch (e) {
      console.error('Invalid YouTube URL:', videoUrl);
    }
    if (videoId) {
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
      iframe.style.display = "block";
    }
  } else if (videoUrl.includes('drive.google.com')) {
    let fileId = '';
    try {
      const url = new URL(videoUrl);
      const match = url.pathname.match(/\\/d\\/([^/]+)/);
      if (match && match[1]) {
        fileId = match[1];
      }
    } catch (e) {
      console.error('Invalid Google Drive URL:', videoUrl);
    }
    if (fileId) {
      iframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
      iframe.style.display = "block";
    }
  } else {
    video.src = videoUrl;
    video.style.display = "block";
    video.play();
  }
}

function closeModal(event) {
  event.stopPropagation();
  const modal = document.getElementById("videoModal");
  const video = document.getElementById("modalVideo");
  const iframe = document.getElementById("modalIframe");

  video.pause();
  video.src = "";
  iframe.src = "";
  modal.style.display = "none";
}
</script>

</body>
</html>
