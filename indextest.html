<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Exact 5-Item Carousel</title>
  <style>
    body {
      background: #141414;
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    .carousel-section {
      width: 1180px; /* 5 × 220 + 4 × 20 */
      margin: 0 auto;
    }

    .carousel-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-button {
      font-size: 2rem;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      user-select: none;
    }

    .carousel-container {
      width: 1180px;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.5s ease;
    }

    .video-item {
      flex: 0 0 220px;
      background: #1f1f1f;
      border-radius: 6px;
      overflow: hidden;
    }

    .video-item + .video-item {
      margin-left: 20px;
    }

    .preview-container {
      height: 130px;
      background: #333;
    }

    .video-title {
      padding: 10px;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="carousel-section">
    <h2>Fixed 5-Item Carousel (No Clipping)</h2>
    <div class="carousel-wrapper">
      <button class="carousel-button" onclick="scrollCarousel(-1, 'track')">&#10094;</button>
      <div class="carousel-container">
        <div class="carousel-track" id="track">

          <!-- 10 Sample Items -->
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 1</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 2</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 3</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 4</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 5</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 6</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 7</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 8</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 9</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 10</div></div>

        </div>
      </div>
      <button class="carousel-button" onclick="scrollCarousel(1, 'track')">&#10095;</button>
    </div>
  </div>

  <script>
    const carouselStates = {};

    function scrollCarousel(direction, trackId) {
      const track = document.getElementById(trackId);
      const itemWidth = 220 + 20; // item width + margin-left
      const itemsPerView = 5;
      const totalItems = track.querySelectorAll('.video-item').length;
      const maxIndex = Math.floor((totalItems - 1) / itemsPerView);

      if (!(trackId in carouselStates)) {
        carouselStates[trackId] = 0;
      }

      carouselStates[trackId] += direction;
      carouselStates[trackId] = Math.max(0, Math.min(carouselStates[trackId], maxIndex));

      const offset = carouselStates[trackId] * itemWidth * itemsPerView;
      track.style.transform = `translateX(-${offset}px)`;
    }
  </script>

</body>
</html>
