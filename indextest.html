<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exact 5-Item Carousel</title>
  <style>
    body {
      background: #141414;
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    .carousel-section {
      width: 1180px;
      margin: 0 auto;
    }

    .carousel-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-button {
      font-size: 2rem;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      user-select: none;
    }

    .carousel-container {
      width: 1180px; /* 5 * 220 + 4 * 20 spacing */
      overflow: hidden;
    }

    .carousel-track {
  display: flex;
  gap: 0; /* remove gap */
}

    .carousel-track > .video-item:not(:nth-child(5n)) {
  margin-right: 20px;
}

    .video-item {
  flex: 0 0 220px;
}

    .video-item:last-child {
      margin-right: 0;
    }

    .preview-container {
      height: 130px;
      background: #333;
    }

    .video-title {
      padding: 10px;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="carousel-section">
    <h2>Fixed 5-Item Carousel</h2>
    <div class="carousel-wrapper">
      <button class="carousel-button" onclick="scrollCarousel(-1, 'track')">&#10094;</button>
      <div class="carousel-container">
        <div class="carousel-track" id="track">

          <!-- 12 Sample Items -->
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 1</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 2</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 3</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 4</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 5</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 6</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 7</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 8</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 9</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 10</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 11</div></div>
          <div class="video-item"><div class="preview-container"></div><div class="video-title">Video 12</div></div>

        </div>
      </div>
      <button class="carousel-button" onclick="scrollCarousel(1, 'track')">&#10095;</button>
    </div>
  </div>

  <script>
    const carouselPositions = {};

    function scrollCarousel(direction, trackId) {
      const track = document.getElementById(trackId);
      const itemWidth = 220 + 20; // item width + margin
      const itemsPerView = 5;
      const totalItems = track.querySelectorAll('.video-item').length;
      const totalGroups = Math.ceil(totalItems / itemsPerView);

      if (!carouselPositions[trackId]) {
        carouselPositions[trackId] = 0;
      }

      carouselPositions[trackId] += direction;
      if (carouselPositions[trackId] < 0) carouselPositions[trackId] = 0;
      if (carouselPositions[trackId] > totalGroups - 1) {
        carouselPositions[trackId] = totalGroups - 1;
      }

      const offset = carouselPositions[trackId] * itemWidth * itemsPerView;
      track.style.transform = `translateX(-${offset}px)`;
    }
  </script>

</body>
</html>
