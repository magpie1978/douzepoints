<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Douze Points – Edition (YouTube Version)</title>

    <!-- Main site styles -->
    <link rel="stylesheet" href="combined.css" />
    <link rel="stylesheet" href="footer.css" />
    <link rel="stylesheet" href="score_circle.css" />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <!-- HEADER -->
    <div id="header-container"></div>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="dp-layout">

        <!-- SIDEBAR -->
        <div id="sidebar-container" class="sidebar"></div>

        <!-- MAIN COLUMN -->
        <main class="dp-main">

            <!-- Banner Image (handled by header.js) -->
            <img id="country-banner" class="country-banner" alt="Edition Banner" />

            <!-- SORTING BAR -->
            <div class="video-controls">
                <div class="sort-wrapper">
                    <i data-lucide="filter"></i>
                    <select id="sort-options">
                        <option value="country">Country (A–Z)</option>
                        <option value="artist">Artist</option>
                        <option value="song">Song</option>
                        <option value="jury">Jury Points</option>
                        <option value="televote">Televote Points</option>
                        <option value="total">Total Points</option>
                    </select>
                </div>
            </div>

            <!-- VIDEO GRID -->
            <div id="video-container" class="video-grid"></div>
        </main>
    </div>

    <!-- FOOTER -->
    <footer id="footer"></footer>

    <!-- MODAL (loaded dynamically) -->
    <div id="modal-container"></div>

    <!-- JS ORDER IMPORTANT -->
    <script type="module" src="supabaseClient.js"></script>
    <script src="header.js" type="module"></script>
    <script src="sidebar.js"></script>
    <script src="sorting.js"></script>

    <!-- MUST ALWAYS LOAD video.js (renderer + modal functions) -->
    <script src="video.js"></script>

    <!-- YOUTUBE VERSION OF EDITION PAGE -->
    <script type="module" src="edition-yt.js"></script>

    <script src="footer.js"></script>
    <script src="modal.js"></script>
</body>
</html>
