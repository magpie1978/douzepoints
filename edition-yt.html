<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Douze Points – Edition (YouTube Version)</title>

    <!-- Main site styles -->
    <link rel="stylesheet" href="style/combined.css" />
    <link rel="stylesheet" href="style/footer.css" />
    <link rel="stylesheet" href="style/score_circle.css" />

    <!-- Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <!-- HEADER -->
    <div id="header-container"></div>

    <!-- MAIN LAYOUT -->
    <div class="dp-layout">

        <!-- SIDEBAR -->
        <div id="sidebar-container" class="sidebar"></div>

        <!-- MAIN COLUMN -->
        <main class="dp-main">

            <!-- BANNER IMAGE (set automatically by header.js) -->
            <img id="country-banner" class="country-banner" alt="Edition Banner" />

            <!-- SORTING BAR -->
            <div class="video-controls">
                <div class="sort-wrapper">
                    <i data-lucide="filter"></i>
                    <select id="sort-options">
                        <option value="country">Country (A–Z)</option>
                        <option value="artist">Artist</option>
                        <option value="song">Song</option>
                        <option value="jury">Jury Points</option>
                        <option value="televote">Televote Points</option>
                        <option value="total">Total Points</option>
                    </select>
                </div>
            </div>

            <!-- VIDEO GRID -->
            <div id="video-container" class="video-grid"></div>

        </main>
    </div>

    <!-- FOOTER -->
    <footer id="footer"></footer>

    <!-- MODAL LOADER -->
    <div id="modal-container"></div>

    

    <!-- 🔥 SCRIPT LOAD ORDER IS CRITICAL 🔥 -->
    <!-- 1. Supabase client MUST stay as a module -->
    <script type="module" src="js/supabaseClient.js"></script>

    <!-- 2. Standard scripts (NOT modules) -->
    <script type="module" src="/header.js"></script>
    <script type="module" src="/sidebar.js"></script>
    <script src="js/sorting.js"></script>
    <script src="js/video.js"></script>

    <!-- 3. YOUTUBE EDITION LOADER (depends on video.js) -->
    <script src="js/edition-yt.js"></script>

    <!-- 4. Footer + modal -->
    <script src="js/footer.js"></script>
    <script src="js/modal.js"></script>

</body>
</html>
