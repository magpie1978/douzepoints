<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Belgian Royal Family — Clean Tree (from current King)</title>
<style>
  :root{
    --bg:#0f111a; --card:#1a1d29; --text:#e6e6e6; --muted:#9aa0a6;
    --accent:#e50914; --marriage:#d1d5db; --child:#9ca3af; --radius:16px;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .page{max-width:2200px;margin:24px auto;padding:0 16px 64px;position:relative}
  @media (min-width:2200px){ .page{max-width:96vw} }

  h1{margin:0 0 8px}
  .subtitle{color:var(--muted);margin-bottom:24px}
  .divider{height:1px;background:var(--accent);opacity:.6;margin:12px 0 24px}

  .tree{position:relative;overflow-x:auto}
  .connections{position:absolute;inset:0;pointer-events:none;z-index:0}

  /* Each generation gets one strict, unwrapped row + extra bottom padding (gutter for connectors) */
  .generation-row{
    width:100%; position:relative; display:flex; flex-wrap:nowrap; gap:16px;
    justify-content:flex-start; margin:36px 0; padding-block:8px 64px; z-index:1;
  }

  /* A couple is a side-by-side pair that stays together as one block in the flow */
  .couple{display:flex; gap:16px}

  /* Person card with left thumbnail placeholder */
  .person{
    display:flex; align-items:center; width:280px; background:var(--card); border-radius:var(--radius);
    border:1px solid rgba(255,255,255,.06); box-shadow:0 6px 20px rgba(0,0,0,.25); overflow:hidden;
  }
  .thumb{width:88px;height:110px;object-fit:cover;background:#22252f;flex-shrink:0}
  .placeholder{width:88px;height:110px;display:grid;place-items:center;background:#22252f;color:#6b7280;font-size:11px}
  .person-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
  .name{margin:0;font-weight:700;font-size:15px}
  .lifespan{margin:0;color:var(--muted);font-size:12px}
  .title{margin:0;color:#c9d1d9;font-size:12px}

  @media (max-width:560px){
    .person{width:92vw;max-width:360px}
    .thumb,.placeholder{width:76px;height:96px}
  }
</style>
</head>
<body>
<div class="page">
  <h1>Belgian Royal Family — Direct Descendants of the Current King</h1>
  <div class="subtitle">Gen 0 starts with the reigning King & Queen. Marriage lines connect couples; child lines branch from the couple’s midpoint. Later gens: couples sit together and are ordered by the child’s birthdate.</div>
  <div class="divider"></div>

  <div id="tree" class="tree">
    <svg id="connections" class="connections" preserveAspectRatio="none"></svg>
    <div id="rows"></div>
  </div>
</div>

<script>
/* ----------------------- Data (plug your DB here) ----------------------- */
/* Minimal set to demonstrate: King Philippe & Queen Mathilde and their four children. */
const PEOPLE = [
  // Gen 0 (root couple)
  { id:"philippe", name:"Philippe", title:"King of the Belgians", birth:"1960-04-15" },
  { id:"mathilde", name:"Mathilde", title:"Queen of the Belgians", birth:"1973-01-20" },

  // Gen 1 (children), all single as of now; parent order doesn't matter, include both where known
  { id:"elisabeth", name:"Elisabeth", title:"Princess of Belgium, Duchess of Brabant", birth:"2001-10-25", parents:["philippe","mathilde"] },
  { id:"gabriel", name:"Gabriel", title:"Prince of Belgium", birth:"2003-08-20", parents:["philippe","mathilde"] },
  { id:"emmanuel", name:"Emmanuel", title:"Prince of Belgium", birth:"2005-10-04", parents:["philippe","mathilde"] },
  { id:"eleonore", name:"eleonore", title:"Princess of Belgium", birth:"2008-04-16", parents:["philippe","mathilde"] },

  // Example of how you’d add a spouse later (kept here as commented template):
  // { id:"future_spouse", name:"(Spouse Name)", title:"", birth:"1999-01-01" }
];

const MARRIAGES = [
  // Root marriage (Gen 0): make sure partners are the King & Queen
  { partners:["philippe","mathilde"] },

  // Example for next gens (uncomment/add when needed):
  // { partners:["elisabeth","future_spouse"] },
];

/* ----------------------- Helpers ----------------------- */
const byId = new Map(PEOPLE.map(p=>[p.id,p]));
const childrenOf = (idA,idB=null)=>{
  // If two parents provided, return children who list both; if one parent, list all that include that parent.
  return PEOPLE.filter(c=>{
    const ps = new Set(c.parents||[]);
    if(idB){ return ps.has(idA) && ps.has(idB); }
    return ps.has(idA);
  });
};
const spouseOf = (id)=>{
  const m = MARRIAGES.find(m=>m.partners.includes(id));
  if(!m) return null;
  const [a,b] = m.partners;
  return a===id? b : a;
};
const birthYear = p => p?.birth ? Number(p.birth.slice(0,4)) : 9999;

/* ----------------------- Build generations from the root couple ----------------------- */
/* We strictly follow your rule set:
   - Gen 0: the King & Queen (a couple block).
   - Gen n+1: for every block in Gen n, gather each child (primary person), pair with their spouse (if married),
              and order blocks by the PRIMARY CHILD's birth date (not the spouse).
*/
function buildGenerations(){
  const gens = [];

  // Gen 0: ensure we start with the reigning couple (Philippe & Mathilde in our data)
  const rootMarriage = MARRIAGES.find(m=>{
    const set = new Set(m.partners);
    return set.has("philippe") && set.has("mathilde");
  });
  if(!rootMarriage){ throw new Error("Root marriage (King & Queen) not found."); }
  gens.push([ { type:"couple", a:"philippe", b:"mathilde" } ]);

  // Build subsequent gens by expanding children from previous gen blocks
  let depth = 0;
  while(true){
    const prev = gens[depth];
    if(!prev) break;

    // Gather next gen blocks from all couples/singles in this generation
    const nextBlocks = [];
    const seenPrimary = new Set(); // avoid duplicates across multiple parent sources

    for(const block of prev){
      if(block.type==="couple"){
        // children of the couple
        const kids = childrenOf(block.a, block.b);
        kids.forEach(k=>{
          if(seenPrimary.has(k.id)) return;
          seenPrimary.add(k.id);
          const spouseId = spouseOf(k.id);
          if(spouseId){
            nextBlocks.push({ type:"couple", a:k.id, b:spouseId, primary:k.id });
          }else{
            nextBlocks.push({ type:"single", id:k.id, primary:k.id });
          }
        });
      }else if(block.type==="single"){
        // single parent case: still allow descendants to appear
        const kids = childrenOf(block.id);
        kids.forEach(k=>{
          if(seenPrimary.has(k.id)) return;
          seenPrimary.add(k.id);
          const spouseId = spouseOf(k.id);
          if(spouseId){
            nextBlocks.push({ type:"couple", a:k.id, b:spouseId, primary:k.id });
          }else{
            nextBlocks.push({ type:"single", id:k.id, primary:k.id });
          }
        });
      }
    }

    if(nextBlocks.length===0) break;

    // Order by the PRIMARY CHILD birth date (not the spouse)
    nextBlocks.sort((A,B)=>{
      const pa = byId.get(A.primary), pb = byId.get(B.primary);
      const ay = birthYear(pa), by = birthYear(pb);
      return ay - by || (pa?.name||"").localeCompare(pb?.name||"");
    });

    gens.push(nextBlocks);
    depth++;
    if(depth>6) break; // hard guard
  }

  return gens;
}

/* ----------------------- Render ----------------------- */
function render(){
  const rowsEl = document.getElementById("rows");
  rowsEl.innerHTML = "";
  const gens = buildGenerations();

  gens.forEach((blocks, gi)=>{
    const row = document.createElement("div");
    row.className = "generation-row";
    row.dataset.generation = gi;

    blocks.forEach(block=>{
      if(block.type==="couple"){
        const wrap = document.createElement("div");
        wrap.className = "couple";
        wrap.id = `block-${block.a}-${block.b}`;

        wrap.appendChild(renderPerson(block.a));
        wrap.appendChild(renderPerson(block.b));
        row.appendChild(wrap);
      }else{
        const person = renderPerson(block.id);
        person.id = `block-${block.id}`;
        row.appendChild(person);
      }
    });

    rowsEl.appendChild(row);
  });

  // After layout paints, draw connectors
  queueMicrotask(drawConnections);
  window.addEventListener("resize", drawConnections, {passive:true});
}

function renderPerson(id){
  const p = byId.get(id);
  const card = document.createElement("article");
  card.className = "person";
  card.dataset.id = id;

  // left image placeholder (swap for real image src later if you like)
  const ph = document.createElement("div");
  ph.className = "placeholder";
  ph.textContent = "Photo";
  card.appendChild(ph);

  const body = document.createElement("div");
  body.className = "person-body";
  const h = document.createElement("h3"); h.className="name"; h.textContent = p.name;
  const l = document.createElement("div"); l.className="lifespan"; l.textContent = p.birth ? `b. ${p.birth.slice(0,4)}` : "";
  const t = document.createElement("p"); t.className="title"; t.textContent = p.title||"";
  body.appendChild(h); if(l.textContent) body.appendChild(l); if(t.textContent) body.appendChild(t);
  card.appendChild(body);

  return card;
}

/* ----------------------- Connectors (gutter routing) ----------------------- */
function drawConnections(){
  const svg = document.getElementById("connections");
  const container = document.getElementById("tree");
  const rect = container.getBoundingClientRect();
  svg.setAttribute("width", rect.width);
  svg.setAttribute("height", rect.height);
  svg.setAttribute("viewBox", `0 0 ${rect.width} ${rect.height}`);
  while(svg.firstChild) svg.removeChild(svg.firstChild);

  // Cache positions
  const pos = new Map();
  document.querySelectorAll(".person").forEach(el=>{
    const r=el.getBoundingClientRect();
    pos.set(el.dataset.id,{
      cx: r.left-rect.left + r.width/2,
      top: r.top-rect.top,
      bottom: (r.top-rect.top)+r.height
    });
  });
  // Couple wrappers and per-row gutter baselines
  const coupleBlocks = new Map(); // key "a-b" => {ax,bx,y}
  const rowBaseline = new Map();
  document.querySelectorAll(".generation-row").forEach(row=>{
    const gi = +row.dataset.generation;
    const rr = row.getBoundingClientRect();
    rowBaseline.set(gi, rr.bottom - rect.top + 12); // gutter just below row
    row.querySelectorAll(".couple").forEach(w=>{
      const kids = Array.from(w.querySelectorAll(".person"));
      if(kids.length===2){
        const aId = kids[0].dataset.id, bId = kids[1].dataset.id;
        const ap = pos.get(aId), bp = pos.get(bId);
        if(ap && bp){
          coupleBlocks.set(`${aId}-${bId}`, {
            a:aId, b:bId,
            ax: ap.cx, bx: bp.cx,
            y: rowBaseline.get(gi)
          });
        }
      }
    });
  });

  // Marriage lines
  function drawMarriage(x1,x2,y){
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1", x1); line.setAttribute("y1", y);
    line.setAttribute("x2", x2); line.setAttribute("y2", y);
    line.setAttribute("stroke", getComputedStyle(document.documentElement).getPropertyValue('--marriage')||'#d1d5db');
    line.setAttribute("stroke-width","3");
    line.setAttribute("opacity","0.95");
    svg.appendChild(line);
  }
  // Curved child connector from (sx,sy) to (tx,ty)
  function pathD(sx,sy,tx,ty){
    const midY=(sy+ty)/2;
    return `M ${sx} ${sy} C ${sx} ${midY}, ${tx} ${midY}, ${tx} ${ty}`;
  }
  function drawChild(sx,sy,tx,ty){
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d", pathD(sx,sy,tx,ty));
    p.setAttribute("fill","none");
    p.setAttribute("stroke", getComputedStyle(document.documentElement).getPropertyValue('--child')||'#9ca3af');
    p.setAttribute("stroke-width","2");
    p.setAttribute("opacity","0.9");
    svg.appendChild(p);
  }

  // 1) Draw marriage connectors for all couples present in the layout
  document.querySelectorAll(".couple").forEach(w=>{
    const [aEl,bEl] = w.querySelectorAll(".person");
    if(!aEl || !bEl) return;
    const a=aEl.dataset.id, b=bEl.dataset.id;
    const key1=`${a}-${b}`, key2=`${b}-${a}`;
    const info = coupleBlocks.get(key1) || coupleBlocks.get(key2);
    if(!info) return;
    drawMarriage(Math.min(info.ax,info.bx), Math.max(info.ax,info.bx), info.y);
  });

  // 2) For each couple block, route child lines from the couple midpoint
  document.querySelectorAll(".generation-row").forEach(row=>{
    const gi = +row.dataset.generation;
    const nextGi = gi + 1;
    const gutterY = rowBaseline.get(gi) ?? 0;

    row.querySelectorAll(".couple").forEach(w=>{
      const [aEl,bEl] = w.querySelectorAll(".person");
      if(!aEl || !bEl) return;
      const a=aEl.dataset.id, b=bEl.dataset.id;
      const aPos = pos.get(a), bPos = pos.get(b);
      if(!aPos || !bPos) return;

      const mx = (aPos.cx + bPos.cx)/2; // midpoint of the couple
      // children of this couple
      const kids = PEOPLE.filter(p=>{
        const s=new Set(p.parents||[]);
        return s.has(a) && s.has(b);
      });
      kids.forEach(k=>{
        const kPos = pos.get(k.id);
        if(!kPos) return; // not in next gen, skip
        drawChild(mx, gutterY, kPos.cx, kPos.top);
      });
    });

    // 3) Singles: child lines from the single parent’s gutter
    row.querySelectorAll(".person").forEach(pEl=>{
      // if this person is inside a couple, skip (handled above)
      if(pEl.parentElement && pEl.parentElement.classList.contains("couple")) return;
      const id = pEl.dataset.id;
      const pPos = pos.get(id);
      if(!pPos) return;
      const kids = childrenOf(id);
      kids.forEach(k=>{
        const kPos = pos.get(k.id);
        if(!kPos) return;
        drawChild(pPos.cx, gutterY, kPos.cx, kPos.top);
      });
    });
  });
}

/* ----------------------- Init ----------------------- */
render();
</script>
</body>
</html>
