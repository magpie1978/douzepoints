<!DOCTYPE html>
<html lang="en">
  <head>    
    <meta charset="UTF-8">
    <title>Eurovision Winners, Results & Scoreboard Archive | DouzePoints</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore Eurovision winners, songs and results from every contest. Watch performances, discover fan favourites and browse the DouzePoints Eurovision archive.">
    <link rel="canonical" href="https://douzepoints.org/">
    <link rel="preload" as="image" href="/banners/douzepoints.png" fetchpriority="high">
    <link rel="preload" as="image" href="/images/2026-BG.jpeg" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" type="text/css" href="style/combined.css">
    <link rel="stylesheet" type="text/css" href="style/favorites.css">
    <link rel="stylesheet" type="text/css" href="style/carousels.css"> 
    <link rel="stylesheet" type="text/css" href="style/video-cards.css"> 
    <link rel="stylesheet" type="text/css" href="style/footer.css">
    <link rel="stylesheet" type="text/css" href="style/homepage-stability.css">
    <style>
      /* Homepage only: reserve the 400px banner + 1px divider before
         the asynchronously fetched shared header is inserted.
         The navigation is absolutely positioned over the banner. */
      @media (min-width: 769px) {
        #header-container { min-height: 401px; }
      }
    </style>
    
    <script defer src="/js/favicons.js"></script>

    <!-- GOOGLE ADSENSE SCRIPT -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1056703456722687" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9BDCDNFMGG"></script>
    <script defer src="/js/analytics.js"></script>
  </head>

  
  <body oncontextmenu="return false">
  
    <!-- HEADER -->
    <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  
    <div id="header-container"></div>
    <script type="module" src="js/header.js"></script>
  
    <br><br>

    <div class="page-layout">

      <!-- MAIN CONTENT -->
      <div class="main-content" role="main">
  
        <!-- CAROUSEL 1: Winners -->
        <div class="carousel-section">
          <div class="section-header">
            <h4>Eurovision Winners</h4>
            <a class="view-more" href="winners.html">VIEW MORE</a>
          </div>
          <div class="carousel-wrapper">
            <button class="carousel-button" onclick="scrollCarousel(-1,'carouselTrack1')">&#10094;</button>
            <div class="carousel-container"><div class="carousel-track" id="carouselTrack1"></div></div>
            <button class="carousel-button" onclick="scrollCarousel(1,'carouselTrack1')">&#10095;</button>
          </div>
        </div>
      
        <br>
    
        <!-- CAROUSEL 2: Basel 2025 -->
        <div class="carousel-section">
          <div class="section-header">
            <h4>Basel 2025</h4>
            <a class="view-more" href="edition.html?edition=2025">VIEW ALL</a>
          </div>
          <div class="carousel-wrapper">
            <button class="carousel-button" onclick="scrollCarousel(-1, 'carouselTrack4')">&#10094;</button>
            <div class="carousel-container"><div class="carousel-track" id="carouselTrack4"></div></div>
            <button class="carousel-button" onclick="scrollCarousel(1, 'carouselTrack4')">&#10095;</button>
          </div>
        </div>
      
        <br>
      
        <!-- CAROUSEL 3: Malmö 2024 -->
        <div class="carousel-section">
          <div class="section-header">
            <h4>Malmö 2024</h4>
            <a class="view-more" href="edition.html?edition=2024">VIEW ALL</a>
          </div>
          <div class="carousel-wrapper">
            <button class="carousel-button" onclick="scrollCarousel(-1, 'carouselTrack2')">&#10094;</button>
            <div class="carousel-container"><div class="carousel-track" id="carouselTrack2"></div></div>
            <button class="carousel-button" onclick="scrollCarousel(1, 'carouselTrack2')">&#10095;</button>
          </div>
        </div>
      
        <br>
      
        <!-- CAROUSEL 4: Fan Favorites -->
        <div class="carousel-section">
          <div class="section-header">
            <h4>Fan Favorites</h4>
            <a class="view-more" href="fan-favorites.html">VIEW MORE</a>
          </div>
          <div class="carousel-wrapper">
            <button class="carousel-button" onclick="scrollCarousel(-1,'carouselTrack3')">&#10094;</button>
            <div class="carousel-container"><div class="carousel-track" id="carouselTrack3"></div></div>
            <button class="carousel-button" onclick="scrollCarousel(1,'carouselTrack3')">&#10095;</button>
          </div>
        </div>
    
  
        <!-- MODAL -->
        <script defer src="js/modal.js"></script>
        <div id="modal-container"></div>
  
        
        <!-- SUPABASE (REQUIRED FOR CAROUSELS) -->
        <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script type="module" src="js/supabaseClient.js"></script>
  
        
        <!-- VIDEO LOADER -->
        <script type="module" src="js/video.js"></script>
  
      
        <!-- SIGN-UP MODAL (reuse your existing markup if you want) -->
        <div id="signup-modal-overlay" style="display:none;">
          <div id="signup-modal">
            <h3>Create Account</h3>
            <p id="signup-error" style="color:#e50914;font-size:14px;margin:0 0 10px;min-height:18px;text-align:center;"></p>
        
            <input id="signup-email" type="email" placeholder="Email">
            <input id="signup-password" type="password" placeholder="Password">
            <input id="signup-promo" type="text" placeholder="Promo Code (required)">
        
            <div class="signup-buttons">
              <button id="signup-submit" class="modal-btn primary">Create Account</button>
              <button id="signup-close" class="modal-btn secondary">Close</button>
            </div>
          </div>
        </div>
  
        <!-- ================= LOGIN OVERLAY ================= -->
        <div id="auth-overlay" style="display:none;">
          <div id="auth-modal">
            <center><h2>Sign In</h2></center>
            <center><h3>Sign in, or create an account, to get access to functionality such as creating your own playlists and having a dedicated page for your favorite performances</h3></center>
        
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
        
            <div class="auth-buttons">
              <button id="login-btn" class="modal-btn primary">Log In</button>
            </div>
        
            <div class="auth-divider"></div>
        
            <div class="auth-secondary">
              <button id="open-signup" class="modal-btn secondary">
                Create account
              </button>
            </div>
        
            <button id="auth-close" class="auth-close">×</button>
            <p id="login-error" style="color:#e50914;text-align:center;min-height:18px;"></p>
          </div>
        </div>
      
      <!-- FOOTER -->
      <div id="footer"></div>
      <script defer src="js/footer.js" type="text/javascript"></script>
      <script type="module" src="js/auth.js"></script>
        
    </div>
      
  </body>
  
</html>
