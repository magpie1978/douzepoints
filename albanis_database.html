<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Albania Eurovision Entries</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #141414;
      color: white;
    }
    .video-item {
      margin-bottom: 20px;
      background: #1f1f1f;
      border-radius: 8px;
      padding: 10px;
    }
    .preview-container img {
      width: 200px;
      height: auto;
      border-radius: 6px;
    }
    .video-title-with-icon {
      display: flex;
      align-items: center;
      margin-top: 10px;
    }
    .video-title-with-icon img {
      width: 30px;
      height: 20px;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <h2>Albania Eurovision Entries</h2>
  <div id="albania-videos"></div>

  <script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT3NsJbFLtYWZSBn0WnfBYfO9CBqZfnMW4KIF9oT8DTzmvGX5SyQ03aaBeAMb0L_A0Cqdw81k679x5X/pub?output=csv';

    fetch(sheetUrl)
      .then(response => response.text())
      .then(csvText => {
        const rows = csvText.trim().split('\n').map(row => row.split(','));
        const headers = rows[0];

        const yearIdx = headers.indexOf('Year');
        const countryIdx = headers.indexOf('Country');
        const artistIdx = headers.indexOf('Artist');
        const songIdx = headers.indexOf('Song');
        const videoIdx = headers.findIndex(h => h.toLowerCase().includes('video'));

        const container = document.getElementById('albania-videos');

        rows.slice(1).forEach(row => {
          if (row[countryIdx] === 'Albania') {
            const year = row[yearIdx];
            const artist = row[artistIdx];
            const song = row[songIdx];
            const video = row[videoIdx];

            const html = `
<!-- ${year} -->
<div class="video-item" data-artist="${artist}" data-country="Albania" data-song="${song}" data-year="${year}" onclick="GDriveOpenModalWithVideo('${video}')">
  <div class="preview-container"><img alt="Albania ${year}" src="images/${year}-AL.jpeg"/></div>
  <div class="video-title-with-icon" onclick="event.stopPropagation()">
    <a href="albania.html"><img alt="Flag" class="icon-placeholder" src="flags/al.png"/></a>
    <div class="video-title-text"><b>${artist}</b><br>${song}<br>${year}</div>
  </div>
</div>
            `;

            container.insertAdjacentHTML('beforeend', html);
          }
        });
      })
      .catch(err => console.error('Error loading CSV:', err));

    // Optional function stub so clicking works:
    function GDriveOpenModalWithVideo(link) {
      alert("Would open video: " + link);
    }
  </script>
</body>
</html>
