<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>

<title>Douze Points | Andorra</title>

<style>
    

    body {
      font-family: 'Raleway', sans-serif;
      margin: 0;
      background: #141414;
      color: #fff;
    }

    .banner-static {
      width: 100%;
      height: 400px;
      overflow: hidden;
    }
    
    .banner-static img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }      
      .banner-image.active {
      opacity: 1;
      z-index: 2;
    }
    /* Overlay layout */
    .header-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 20px;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .home-link {
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
    }
    
    .header-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .header-links {
      display: flex;
      gap: 20px;
    }
    
    .header-links a {
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
    }
    
    .header-links a:hover {
      color: #e50914;
    }

    .banner-title img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .banner-title h2 {
      font-size: 2rem;
      color: black;
      margin: 0;
    }
    
    .banner-text h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    
    .banner-text p {
      font-size: 1rem;
      margin: 0.3rem 0;
    }

    .banner-divider {
      width: 100%;
      height: 1px;
      background-color: #e50914;
      }
    
    .container {
          display: flex;
        }

    .sidebar {
      width: 220px;
      padding: 10px;
      background-color: #111;
      color: white;
      font-size: 14px;
      height: auto;
      overflow: visible;
    }

    .sidebar a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      transition: background-color 0.3s;
    }

    .sidebar-row a {
      text-decoration: none;
      color: white;
      display: flex;
      align-items: center;
    }

    .sidebar-row {
      margin: 5px 0;
    }

    .sidebar a:hover {
      background-color: #e50914;
      border-radius: 8px;
    }

    .sidebar img {
      width: 22px;
      height: 22px;
      object-fit: cover;
      border-radius: 50%;
    }

    .main-content {
      flex-grow: 1;
      padding: 20px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .video-item {
      cursor: pointer;
      background-color: #1a1a1a;
      padding: 10px;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .video-item:hover {
      transform: scale(1.05);
    }

    .preview-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      overflow: hidden;
      border-radius: 6px;
    }

    .preview-container img,
    .preview-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .preview-container video {
      display: none;
    }
    
    .preview-container.has-video:hover video {
      display: block;
    }
    
    .preview-container.has-video:hover img {
      display: none;
    }
    
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      max-width: 100%;
      max-height: 100%;
    }

    .modal-content video,
    .modal-content iframe {
      width: 81vw;
      height: 81vh;
    }

    .close-button {
      position: absolute;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 40px;
      top: -20px;
      right: -20px;
      z-index: 9999;
      border-radius: 50%;
    }

    .site-footer {
      margin-top: 3rem;
      padding: 2rem 1rem;
      text-align: center;
      color: #ccc;
      font-size: 0.85rem;
      background-color: #141414;
    }

    .footer-line {
      width: 90%;
      height: 1px;
      background-color: #e50914;
      margin: 0 auto 1rem auto;
    }

    .footer-branding {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      gap: 10px;
    }

    .footer-flag {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      overflow: hidden;
    }

    .footer-flag img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .footer-title {
      font-size: 1rem;
      color: #fff;
      font-weight: bold;
    }

    .footer-links a {
      color: #ccc;
      margin: 0 10px;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .footer-links a:hover {
      color: #e50914;
      text-decoration: underline;
    }

    .video-title-with-icon {
      display: flex;
      align-items: center;
      margin-top: 10px;
      gap: 8px;
      color: white;
      font-size: 0.8rem;
    }
      
    .icon-placeholder {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: #444;
      object-fit: cover;
      margin-left: 8px;
    }

    .video-title-text {
      line-height: 1.2;
      }

    .video-title-text a {
      text-decoration: none; /* Remove underline */
      color: inherit;         /* Inherit color from surrounding text */
    }

  </style>
</head>

<script>
    function GDriveOpenModalWithVideo(videoUrl, titleText) {
      const modal = document.getElementById("videoModal");
      const video = document.getElementById("modalVideo");
      const iframe = document.getElementById("modalIframe");
      modal.style.display = "flex";
      video.style.display = "none";
      iframe.style.display = "none";
      video.pause();
      iframe.src = "";
      if (videoUrl.includes('drive.google.com')) {
        const match = videoUrl.match(/\/d\/(.*?)\//);
        if (match && match[1]) {
          iframe.src = `https://drive.google.com/file/d/${match[1]}/preview`;
          iframe.style.display = "block";
        }
      } else {
        video.src = videoUrl;
        video.style.display = "block";
        video.play();
      }
    }

    function GDriveCloseModal(event) {
      event.stopPropagation();
      const modal = document.getElementById("videoModal");
      const video = document.getElementById("modalVideo");
      const iframe = document.getElementById("modalIframe");
      video.pause();
      video.src = "";
      iframe.src = "";
      modal.style.display = "none";
    }
  </script>
