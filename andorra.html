<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8"/>

        <!-- Import Raleway typeface -->
        <link href="https://fonts.googleapis.com/css2?family=Raleway&amp;display=swap" rel="stylesheet"/>
        
        <title>Douze Points | Andorra</title>
        
        <link rel="stylesheet" type="text/css" href="countries2.css">
        <script src="https://unpkg.com/lucide@latest"></script>
    </head>
    
    <body oncontextmenu="return false" data-country="ad">

        <!-- HEADER FROM JS -->
        <div id="header-container"></div>

        
        <!-- Main Content Layout -->
        <div class="container">

        <!-- Main Content Layout -->
        <div class="container">

            <!-- Display Sidebar from editions.js file -->
            <div id="sidebar-container"></div>
            <script src="sidebar_countries.js" type="text/javascript"></script>

            

                <div class="main-content">
                    <div class="header-bar" style="display: flex; justify-content: flex-end; margin-bottom: 40px; margin-right: 20px;">
                        <div style="flex: 1;"></div> <!-- Push the sort-controls to the right -->
                        <div class="sort-controls" style="display: flex; align-items: center; padding-right: 20px;">
                            <label for="sort-options">
                                <i data-lucide="list-filter" style="margin-right: 15px;"></i>
                            </label>
                            <select id="sort-options" style="width: 160px; padding: 5px; font-size: 11px;">
                                <option value="year-asc">Year (asc)</option>
                                <option value="year-desc">Year (desc)</option>
                                <option value="artist">Artist Name</option>
                                <option value="song">Song Title</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid-container">

                        <!-- 2009 -->
                            <div class="video-item" data-artist="Susanne Georgi" data-country="Andorra" data-song="La teva decisió" data-year="2009" onclick="GDriveOpenModalWithVideo('https://drive.google.com/file/d/1gWbMXph09jBPCIY5gEgQ70MNSLXteFYh/')">
                                <div class="preview-container">
                                    <img alt="Andorra 2009" src="images/2009-AD.jpeg"/>
                                </div>
                                <div class="video-title-with-icon" onclick="event.stopPropagation()">
                                    <a href="andorra.html">
                                        <img alt="Flag" class="icon-placeholder" src="flags/ad.png"/>
                                    </a>
                                    <div class="video-title-text"><b>Susanne Georgi</b><br>La teva decisió<br>2009</div>
                                </div>
                            </div>
                        
                            <!-- 2008 -->
                            <div class="video-item" data-artist="Gisela" data-country="Andorra" data-song="Casanova" data-year="2008" onclick="GDriveOpenModalWithVideo('https://drive.google.com/file/d/1cyDK44vd5glWtFMz3MCjH0jpWh9yZ4Rw/')">
                                <div class="preview-container">
                                    <img alt="Andorra 2008" src="images/2008-AD.jpeg"/>
                                </div>
                                <div class="video-title-with-icon" onclick="event.stopPropagation()">
                                    <a href="andorra.html">
                                        <img alt="Flag" class="icon-placeholder" src="flags/ad.png"/>
                                    </a>
                                    <div class="video-title-text"><b>Gisela</b><br>Casanova<br>2008</div>
                                </div>
                            </div>
                        
                            <!-- 2007 -->
                            <div class="video-item" data-artist="Anonymous" data-country="Andorra" data-song="Salvem el món" data-year="2007" onclick="GDriveOpenModalWithVideo('https://drive.google.com/file/d/1iTPehoLqft2lTlvMSqychqH3MqMlxin-/')">
                                <div class="preview-container">
                                    <img alt="Andorra 2007" src="images/2007-AD.jpeg"/>
                                </div>
                                <div class="video-title-with-icon" onclick="event.stopPropagation()">
                                    <a href="andorra.html">
                                        <img alt="Flag" class="icon-placeholder" src="flags/ad.png"/>
                                    </a>
                                    <div class="video-title-text"><b>Anonymous</b><br>Salvem el món<br>2007</div>
                                </div>
                            </div>
                        
                            <!-- 2006 -->
                            <div class="video-item" data-artist="Jenny" data-country="Andorra" data-song="Sense tu" data-year="2006" onclick="GDriveOpenModalWithVideo('https://drive.google.com/file/d/1quHFp8mUIfImZrvTdv16oFtElZtzqf7O/')">
                                <div class="preview-container">
                                    <img alt="Andorra 2006" src="images/2006-AD.jpeg"/>
                                </div>
                                <div class="video-title-with-icon" onclick="event.stopPropagation()">
                                    <a href="andorra.html">
                                        <img alt="Flag" class="icon-placeholder" src="flags/ad.png"/>
                                    </a>
                                    <div class="video-title-text"><b>Jenny</b><br>Sense tu<br>2006</div>
                                </div>
                            </div>
                        
                            <!-- 2005 -->
                            <div class="video-item" data-artist="Marian van de Wal" data-country="Andorra" data-song="La mirada interior" data-year="2005" onclick="GDriveOpenModalWithVideo('https://drive.google.com/file/d/1qXIzRqN27b2pYmpNabloZwdgfLLn2Jfb/')">
                                <div class="preview-container">
                                    <img alt="Andorra 2005" src="images/2005-AD.jpeg"/>
                                </div>
                                <div class="video-title-with-icon" onclick="event.stopPropagation()">
                                    <a href="andorra.html">
                                        <img alt="Flag" class="icon-placeholder" src="flags/ad.png"/>
                                    </a>
                                    <div class="video-title-text"><b>Marian van de Wal</b><br>La mirada interior<br>2005</div>
                                </div>
                            </div>
                        
                            <!-- 2004 -->
                            <div class="video-item" data-artist="Marta Roure" data-country="Andorra" data-song="Jugarem a estimar-nos" data-year="2004" onclick="GDriveOpenModalWithVideo('https://drive.google.com/file/d/1dFTkvGSa9HXR3ypNIxpmIKfGfOOX0u_R/')">
                                <div class="preview-container">
                                    <img alt="Andorra 2004" src="images/2004-AD.jpeg"/>
                                </div>
                                <div class="video-title-with-icon" onclick="event.stopPropagation()">
                                    <a href="andorra.html">
                                        <img alt="Flag" class="icon-placeholder" src="flags/ad.png"/>
                                    </a>
                                    <div class="video-title-text"><b>Marta Roure</b><br>Jugarem a estimar-nos<br>2004</div>
                                </div>
                            </div>
                            <!-- END OF VIDEOS -->
                        </div>
                    </div>
                </div>

        <!-- MODAL -->
        <div class="modal" id="videoModal" onclick="GDriveCloseModal(event)">
            <div class="modal-content">
                <span class="close-button" onclick="GDriveCloseModal(event)">×</span>
                <video autoplay="" controls="" controlslist="nodownload" id="modalVideo" style="display: none;" oncontextmenu="return false"></video>
                <iframe allow="autoplay; encrypted-media" frameborder="0" id="modalIframe" style="display: none;" sandbox="allow-scripts allow-same-origin"></iframe>
            </div>
        </div>

        
        <!-- Display footer from .js file -->
        <div id="footer"></div>
        <script src="footer.js" type="text/javascript"></script>

        
        <script src="modal.js" type="text/javascript"></script>
        <script src="sorting.js" type="text/javascript"></script>
        <script src="header.js" type="text/javascript"></script>

        
    </body>
</html>
