<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>ESCFlix - Home</title>
    <link rel="stylesheet" type="text/css" href="countries2.css">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body oncontextmenu="return false">

    <div id="header-container"></div>

    <div class="container">
        <div id="sidebar-container"></div>
        <script src="sidebar_countries.js" type="text/javascript"></script>

        <div class="main-content">
            <h2 style="margin-left: 20px;">ESCFlix: Eurovision Song Contest Archive</h2>

            <div class="grid-container" id="video-container">
                <!-- Content dynamically inserted -->
            </div>
        </div>
    </div>

    <div id="footer"></div>
    <script src="footer.js" type="text/javascript"></script>

    <script>
    async function loadAllData() {
        const csvUrl = "./data/DouzePoints.csv";
        const response = await fetch(csvUrl);
        const csvText = await response.text();

        Papa.parse(csvText, {
            header: true,
            skipEmptyLines: true,
            transformHeader: h => h.replace(/^\uFEFF/, '').trim(),
            transform: v => v.trim(),
            complete: function(results) {
                const data = results.data;
                const container = document.getElementById("video-container");

                // Sort DESC by year (global default for homepage)
                data.sort((a, b) => parseInt(b.Year) - parseInt(a.Year));

                data.forEach(row => {
                    const year = row.Year;
                    const artist = row.Artist;
                    const song = row.Song;
                    const videoUrl = row.Video_URL;
                    const country = row.Country;
                    const countryCode = row.Country_Code.toLowerCase();

                    const videoItem = document.createElement("div");
                    videoItem.className = "video-item";
                    videoItem.setAttribute("onclick", `GDriveOpenModalWithVideo('${videoUrl}')`);

                    const previewContainer = document.createElement("div");
                    previewContainer.className = "preview-container";
                    const img = document.createElement("img");
                    img.src = `images/${year}-${countryCode.toUpperCase()}.jpeg`;
                    img.alt = `${country} ${year}`;
                    previewContainer.appendChild(img);

                    const titleWithIcon = document.createElement("div");
                    titleWithIcon.className = "video-title-with-icon";
                    titleWithIcon.setAttribute("onclick", "event.stopPropagation()");

                    const a = document.createElement("a");
                    a.href = `country.html?country=${encodeURIComponent(country)}`;
                    const flagImg = document.createElement("img");
                    flagImg.src = `flags/${countryCode}.png`;
                    flagImg.className = "icon-placeholder";
                    flagImg.alt = "Flag";
                    a.appendChild(flagImg);
                    titleWithIcon.appendChild(a);

                    const titleText = document.createElement("div");
                    titleText.className = "video-title-text";
                    titleText.innerHTML = `<b>${artist}</b><br>${song}<br>${year}`;
                    titleWithIcon.appendChild(titleText);

                    videoItem.appendChild(previewContainer);
                    videoItem.appendChild(titleWithIcon);
                    container.appendChild(videoItem);
                });
            }
        });
    }

    loadAllData();
    </script>

    <div class="modal" id="videoModal" onclick="GDriveCloseModal(event)">
        <div class="modal-content">
            <span class="close-button" onclick="GDriveCloseModal(event)">×</span>
            <video autoplay controls controlslist="nodownload" id="modalVideo" style="display:none" oncontextmenu="return false"></video>
            <iframe allow="autoplay; encrypted-media" frameborder="0" id="modalIframe" style="display:none" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
    </div>

    <script src="modal.js" type="text/javascript"></script>
    <script src="header.js" type="text/javascript"></script>
</body>
</html>
