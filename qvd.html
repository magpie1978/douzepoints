<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Family Tree — Auto-clear cache on new CSV source</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0f111a;
    --fg: #e5e7eb;
    --muted: #a3a3a3;
    --accent: #e50914;
    --card: #171923;
    --line: #5b6477;
    --dotted: 4 6;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
  }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 8px;
    align-items: stretch;
    padding: 12px;
    background: rgba(15,17,26,0.9);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid #232638;
  }
  .toolbar input[type="url"] {
    flex: 1;
    min-width: 200px;
    padding: 10px 12px;
    background: #0b0d15;
    color: var(--fg);
    border: 1px solid #2a2e42;
    border-radius: 8px;
    outline: none;
  }
  .toolbar button {
    padding: 10px 14px;
    border: 1px solid #2a2e42;
    background: #141827;
    color: var(--fg);
    border-radius: 8px;
    cursor: pointer;
  }
  .toolbar button.primary {
    background: var(--accent);
    border-color: #b30710;
  }
  .banner-divider {
    width: 100%;
    height: 1px;
    background-color: var(--accent);
  }
  .stage-wrap {
    position: relative;
    height: calc(100% - 74px);
    overflow: auto;
  }
  #stage {
    position: relative;
    min-width: 2400px;  /* plenty of scroll room */
    min-height: 2000px;
    padding: 40px 40px 80px 40px;
    box-sizing: border-box;
  }
  #links {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .person {
    position: absolute;
    width: 220px;
    background: var(--card);
    border: 1px solid #2a2e42;
    border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .person .photo {
    width: 100%;
    height: 140px;
    background: #0b0d15;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .person .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .person .meta {
    padding: 10px 12px 12px 12px;
  }
  .person .name {
    font-weight: 700;
    font-size: 16px;
    line-height: 1.2;
  }
  .person .title {
    color: var(--muted);
    font-size: 13px;
    margin-top: 2px;
  }
  .legend {
    position: fixed;
    right: 12px;
    bottom: 12px;
    background: #111422;
    border: 1px solid #2a2e42;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12px;
    color: #c9ceda;
  }
  .legend div { display: flex; align-items: center; gap: 8px; }
  .legend svg { width: 40px; height: 10px; }
</style>
</head>
<body>
  <div class="toolbar">
    <input id="csvUrl" type="url" placeholder="Paste your Google Sheets CSV URL (…&output=csv)" />
    <button class="primary" id="btnImport">Import CSV</button>
    <button id="btnReset">Reset cache</button>
  </div>
  <div class="banner-divider"></div>

  <div class="stage-wrap">
    <div id="stage">
      <svg id="links"></svg>
      <!-- people get rendered here -->
    </div>
  </div>

  <div class="legend">
    <div><svg><line x1="0" y1="5" x2="40" y2="5" stroke="white" stroke-width="2"/></svg> Parent → Child</div>
    <div><svg><line x1="0" y1="5" x2="40" y2="5" stroke="white" stroke-width="2" stroke-dasharray="4 6"/></svg> Illegitimate link</div>
  </div>

<script>
/* ========= Cache control: auto-clear when CSV source changes ========= */
const STATE_KEYS = [
  'familytree_csv_snapgrid_v1', // legacy: layout/state
  'snap_prefs_v1'               // legacy: snap/grid prefs
];
const SOURCE_KEY = 'sheet_csv_url';

function normalizeSourceId(url) {
  try {
    const u = new URL(url);
    const keepParams = new Set(['gid','single','output']); // stable signature
    [...u.searchParams.keys()].forEach(k => { if (!keepParams.has(k)) u.searchParams.delete(k); });
    return u.origin + u.pathname + (u.search ? '?' + u.searchParams.toString() : '');
  } catch {
    return String(url || '').trim();
  }
}

function clearCachedStateForNewSource(newUrl) {
  const prev = localStorage.getItem(SOURCE_KEY) || '';
  const prevId = normalizeSourceId(prev);
  const newId  = normalizeSourceId(newUrl);

  if (prev && prevId !== newId) {
    STATE_KEYS.forEach(k => localStorage.removeItem(k));
    console.info('[FamilyTree] New CSV source detected — cleared cached state.');
  }
  localStorage.setItem(SOURCE_KEY, newUrl);
}

function withNoCache(url) {
  if (!url) return url;
  return url + (url.includes('?') ? '&' : '?') + 'nocache=' + Date.now();
}

/* ========= CSV parsing (robust enough for quoted commas/newlines) ========= */
function parseCSV(text) {
  const rows = [];
  let i = 0, cur = '', inQuotes = false;
  const pushCell = (row, cell) => row.push(cell.replace(/\r/g,'').trim());
  let row = [];
  while (i < text.length) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { cur += '"'; i += 2; continue; } // escaped quote
        inQuotes = false; i++; continue;
      } else {
        cur += c; i++; continue;
      }
    } else {
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ',') { pushCell(row, cur); cur = ''; i++; continue; }
      if (c === '\n') { pushCell(row, cur); rows.push(row); row = []; cur = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      cur += c; i++; continue;
    }
  }
  // last cell
  pushCell(row, cur);
  rows.push(row);

  // headers
  if (rows.length === 0) return [];
  const headers = rows[0].map(h => h.toLowerCase().trim());
  return rows.slice(1).filter(r => r.length && r.some(x => x !== '')).map(r => {
    const o = {};
    headers.forEach((h, idx) => { o[h] = r[idx] ?? ''; });
    return o;
  });
}

/* ========= Data → Graph building ========= */
function toNumberOrNull(v) {
  if (v === null || v === undefined) return null;
  const t = String(v).trim();
  if (t === '') return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}

function buildGraph(rows) {
  // Expecting headers (case-insensitive): id, gen, name, title, sex, x, y, mother_id, father_id, illegitimate, partners, img
  const nodes = [];
  const byId = new Map();

  for (const r of rows) {
    const id = (r.id || '').trim();
    if (!id) continue; // skip rows without id
    const node = {
      id,
      gen: toNumberOrNull(r.gen),
      name: r.name || '',
      title: r.title || '',
      sex: (r.sex || '').toUpperCase(),
      x: toNumberOrNull(r.x),
      y: toNumberOrNull(r.y),
      mother_id: (r.mother_id || '').trim(),
      father_id: (r.father_id || '').trim(),
      illegitimate: String(r.illegitimate || '').trim(),
      partners: (r.partners || '').trim(),
      img: (r.img || '').trim()
    };
    // default position if missing
    if (node.x === null) node.x = 1000;
    if (node.y === null) node.y = 200;
    nodes.push(node);
    byId.set(node.id, node);
  }

  // children links
  const childrenByParent = new Map(); // id -> Set(childId)
  function addChild(p, c) {
    if (!p) return;
    if (!childrenByParent.has(p)) childrenByParent.set(p, new Set());
    childrenByParent.get(p).add(c);
  }
  for (const n of nodes) {
    if (n.father_id) addChild(n.father_id, n.id);
    if (n.mother_id) addChild(n.mother_id, n.id);
  }

  return { nodes, byId, childrenByParent };
}

/* ========= Rendering ========= */
const stage = document.getElementById('stage');
const svg = document.getElementById('links');

function clearStage() {
  stage.querySelectorAll('.person').forEach(el => el.remove());
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function renderNodes(nodes) {
  for (const n of nodes) {
    const el = document.createElement('div');
    el.className = 'person';
    el.style.left = `${n.x}px`;
    el.style.top = `${n.y}px`;
    el.dataset.id = n.id;

    const photo = document.createElement('div');
    photo.className = 'photo';
    if (n.img) {
      const img = document.createElement('img');
      img.src = n.img;
      img.alt = n.name || 'Photo';
      photo.appendChild(img);
    } else {
      photo.textContent = 'No image';
      photo.style.color = '#6b7280';
      photo.style.fontSize = '12px';
    }

    const meta = document.createElement('div');
    meta.className = 'meta';

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = n.name || '(Unnamed)';

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = n.title || '';

    meta.appendChild(name);
    meta.appendChild(title);

    el.appendChild(photo);
    el.appendChild(meta);
    stage.appendChild(el);
  }
}

function getNodeRect(nodeEl) {
  const rect = nodeEl.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  return {
    left: rect.left - stageRect.left,
    top: rect.top - stageRect.top,
    width: rect.width,
    height: rect.height
  };
}

function centerOf(el) {
  const r = getNodeRect(el);
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

function topCenter(el) {
  const r = getNodeRect(el);
  return { x: r.left + r.width/2, y: r.top };
}

function bottomCenter(el) {
  const r = getNodeRect(el);
  return { x: r.left + r.width/2, y: r.top + r.height };
}

function line(x1,y1,x2,y2, dotted=false) {
  const L = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  L.setAttribute('x1', x1);
  L.setAttribute('y1', y1);
  L.setAttribute('x2', x2);
  L.setAttribute('y2', y2);
  L.setAttribute('stroke', 'white');
  L.setAttribute('stroke-opacity', '0.85');
  L.setAttribute('stroke-width', '2');
  if (dotted) L.setAttribute('stroke-dasharray', getComputedStyle(document.documentElement).getPropertyValue('--dotted') || '4 6');
  svg.appendChild(L);
  return L;
}

function renderLinks(graph) {
  // We’ll draw for each child: from parents (or single parent) to the child's top center.
  const elsById = new Map([...stage.querySelectorAll('.person')].map(el => [el.dataset.id, el]));
  for (const n of graph.nodes) {
    const childEl = elsById.get(n.id);
    if (!childEl) continue;

    const childTop = topCenter(childEl);

    const fatherEl = elsById.get(n.father_id);
    const motherEl = elsById.get(n.mother_id);

    let parentPoint = null;

    if (fatherEl && motherEl) {
      // midpoint between parents’ bottom centers
      const f = bottomCenter(fatherEl);
      const m = bottomCenter(motherEl);
      parentPoint = { x: (f.x + m.x) / 2, y: (f.y + m.y) / 2 };
      // vertical then vertical-ish link
      line(parentPoint.x, parentPoint.y, childTop.x, childTop.y);
    } else if (fatherEl) {
      const f = bottomCenter(fatherEl);
      const dotted = String(n.illegitimate || '').trim() !== '' && String(n.illegitimate).toLowerCase() !== '0';
      line(f.x, f.y, childTop.x, childTop.y, dotted);
    } else if (motherEl) {
      const m = bottomCenter(motherEl);
      const dotted = String(n.illegitimate || '').trim() !== '' && String(n.illegitimate).toLowerCase() !== '0';
      line(m.x, m.y, childTop.x, childTop.y, dotted);
    }
  }
}

/* ========= Import flow ========= */
async function importCsvFromUrl(url) {
  if (!url) { alert('Please paste a CSV URL.'); return; }

  // 1) Clear cache if different source
  clearCachedStateForNewSource(url);

  // 2) Fetch with cache-buster
  const resp = await fetch(withNoCache(url));
  if (!resp.ok) {
    throw new Error(`Failed to fetch CSV: ${resp.status} ${resp.statusText}`);
  }
  const text = await resp.text();

  // 3) Parse & render
  const rows = parseCSV(text);
  const graph = buildGraph(rows);

  clearStage();
  renderNodes(graph.nodes);
  // links after nodes mounted to compute positions
  renderLinks(graph);
}

/* ========= UI wiring ========= */
const urlInput = document.getElementById('csvUrl');
const btnImport = document.getElementById('btnImport');
const btnReset  = document.getElementById('btnReset');

btnImport.addEventListener('click', () => {
  importCsvFromUrl(urlInput.value).catch(err => {
    console.error(err);
    alert(err.message || String(err));
  });
});

btnReset.addEventListener('click', () => {
  STATE_KEYS.forEach(k => localStorage.removeItem(k));
  localStorage.removeItem(SOURCE_KEY);
  alert('Cache cleared. You can re-import your CSV now.');
});

// If there’s a previously used source URL, show it for convenience
const last = localStorage.getItem(SOURCE_KEY);
if (last) urlInput.value = last;

</script>
</body>
</html>
