<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8"/>

        <title>Douze Points | Serbia & Montenegro</title>
        
        <link rel="stylesheet" type="text/css" href="countries2.css">
        <script src="https://unpkg.com/lucide@latest"></script>
    </head>
    
    <body oncontextmenu="return false" data-country="cs">

        <!-- HEADER FROM JS -->
        <div id="header-container"></div>

        <!-- Main Content Layout -->
        <div class="container">

            <!-- Display Sidebar from .js file -->
            <div id="sidebar-container"></div>
            <script src="sidebar_countries.js" type="text/javascript"></script>

                <div class="main-content">
                    <div class="header-bar" style="display: flex; justify-content: flex-end; margin-bottom: 40px; margin-right: 20px;">
                        <div style="flex: 1;"></div> <!-- Push the sort-controls to the right -->
                        <div class="sort-controls" style="display: flex; align-items: center; padding-right: 20px;">
                            <label for="sort-options">
                                <i data-lucide="list-filter" style="margin-right: 15px;"></i>
                            </label>
                            <select id="sort-options" style="width: 160px; padding: 5px; font-size: 11px;">
                                <option value="year-asc">Year (asc)</option>
                                <option value="year-desc">Year (desc)</option>
                                <option value="artist">Artist Name</option>
                                <option value="song">Song Title</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid-container">


<!-- 2005 -->
<div class="video-item" data-artist="No Name" data-country="Serbia & Montenegro" data-song="Zauvijek moja" data-year="2005" onclick="GDriveOpenModalWithVideo('https://drive.google.com/file/d/1a-9wFCOas_SGIPyUeGrgOUkFrUJSk4H2/')">
<div class="preview-container">
<img alt="Serbia & Montenegro 2005" src="images/2005-CS.jpeg"/>
</div>
<div class="video-title-with-icon" onclick="event.stopPropagation()">
<a href="serbia-montenegro.html">
<img alt="Flag" class="icon-placeholder" src="flags/cs.png"/>
</a>
<div class="video-title-text"><b>No Name</b><br/>Zauvijek moja<br/>2005</div>
</div>
</div>
<!-- 2004 -->
<div class="video-item" data-artist="Željko Joksimović and Ad-Hoc Orchestra" data-country="Serbia & Montenegro" data-song="Lane moje" data-year="2004" onclick="GDriveOpenModalWithVideo('https://drive.google.com/file/d/1LR0fhP2s_Sk0mwRlupoRfypeyYOH9KB_/')">
<div class="preview-container">
<img alt="Serbia & Montenegro 2004" src="images/2004-CS.jpeg"/>
</div>
<div class="video-title-with-icon" onclick="event.stopPropagation()">
<a href="serbia-montenegro.html">
<img alt="Flag" class="icon-placeholder" src="flags/cs.png"/>
</a>
<div class="video-title-text"><b>Željko Joksimović and Ad-Hoc Orchestra</b><br/>Lane moje"<br/>2004</div>
</div>
</div>

<!-- END OF VIDEOS -->
</div>
</div>
</div>
        <!-- MODAL -->
        <div class="modal" id="videoModal" onclick="GDriveCloseModal(event)">
            <div class="modal-content">
                <span class="close-button" onclick="GDriveCloseModal(event)">×</span>
                <video autoplay="" controls="" controlslist="nodownload" id="modalVideo" style="display: none;" oncontextmenu="return false"></video>
                <iframe allow="autoplay; encrypted-media" frameborder="0" id="modalIframe" style="display: none;" sandbox="allow-scripts allow-same-origin"></iframe>
            </div>
        </div>

        
        <!-- Display footer from .js file -->
        <div id="footer"></div>
        <script src="footer.js" type="text/javascript"></script>
        
        <script src="modal.js" type="text/javascript"></script>
        <script src="sorting.js" type="text/javascript"></script>
        <script src="header.js" type="text/javascript"></script>

        
    </body>
</html>
