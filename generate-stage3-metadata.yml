name: Generate Stage 3 SEO Metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate metadata-only pages
        run: python apply_stage3_metadata.py --source . --output stage3-metadata-artifact
      - name: Upload pages and report
        uses: actions/upload-artifact@v4
        with:
          name: stage3-metadata-pages
          path: stage3-metadata-artifact/
          if-no-files-found: error
