<!--<div class="modal" id="videoModal" onclick="GDriveCloseModal(event)">-->
<div class="modal" id="videoModal">

  <div class="modal-content">

    <!-- Close Button -->
    <span class="close-button" onclick="GDriveCloseModal(event)">×</span>

    <!-- Direct Video Player (MP4, etc.) -->
    <video
      id="modalVideo"
      autoplay
      controls
      disablepictureinpicture
      controlslist="nodownload noplaybackrate noremoteplayback"
      style="display: none;"
      oncontextmenu="return false">
    </video>

    <!-- Google Drive / YouTube / External Embed -->
    <iframe
      id="modalIframe"
      allow="autoplay; encrypted-media"
      allowfullscreen
      frameborder="0"
      style="display: none;">
    </iframe>

  </div>
</div>
