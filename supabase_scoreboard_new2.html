<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eurovision Scoreboard</title>
  <script src="https://unpkg.com/feather-icons"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://eukgodthgusongsbhdwg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1a2dvZHRoZ3Vzb25nc2JoZHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1NjI1NjAsImV4cCI6MjA2NzEzODU2MH0.e8Gm9utDCQWDjSOJgh-VBioCQFX_aAWXz8rzigFgh4s';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    window.supabase = supabase;

    let eurovisionData = [];
    let allYears = [];
    let currentYear = 2025;
    let currentSortKey = null;
    let currentSortDir = 'desc';

    const columnDefinitions = [
      { label: "Result", final: "Final_Rank", semi: "SemiFinal_Rank" },
      { label: "Country", key: "Country" },
      { label: "Artist", key: "Artist" },
      { label: "", key: "PlayIcon" },
      { label: "Song", key: "Song" },
      { label: "R/O", final: "FinalRunningOrder", semi: "SemiFinalRunningOrder" },
      { label: "Televote Pts", final: "Final_TelevotePoints", semi: "SemiFinal_TelevotePoints" },
      { label: "Televote Rank", final: "Final_TelevoteRank", semi: "SemiFinal_TelevoteRank" },
      { label: "Jury Pts", final: "Final_JuryPoints", semi: "SemiFinal_JuryPoints" },
      { label: "Jury Rank", final: "Final_JuryRank", semi: "SemiFinal_JuryRank" },
      { label: "Total Points", final: "Final_TotalPoints", semi: "SemiFinal_TotalPoints" },
      { label: "Status", key: "Status" }
    ];

    async function loadSupabaseDataForStageAndYear(stage, year) {
      let query = supabase.from('douzepoints').select('*').eq('Year', year);
      if (stage === 'Final') {
        query = query.neq('Final_Rank', '').not('Final_Rank', 'is', null);
      } else if (stage === 'Semi Final 1') {
        query = query.eq('SemiFinal', '1');
      } else if (stage === 'Semi Final 2') {
        query = query.eq('SemiFinal', '2');
      }
      const { data, error } = await query;
      if (error) console.error('Error loading data:', error.message);
      return data || [];
    }

    async function loadAvailableYears() {
      const { data, error } = await supabase.from('douzepoints').select('Year');
      if (error) {
        console.error('Failed to fetch years:', error.message);
        return;
      }

      const yearsSet = new Set();
      data.forEach(row => {
        const y = parseInt(row.Year);
        if (!isNaN(y)) yearsSet.add(y);
      });

      allYears = Array.from(yearsSet).sort((a, b) => b - a);

      const select = document.getElementById("yearSelect");
      select.innerHTML = '';
      allYears.forEach(y => {
        const option = document.createElement("option");
        option.value = y;
        option.textContent = y;
        if (y === currentYear) option.selected = true;
        select.appendChild(option);
      });
    }

    async function loadTableData(year) {
      currentYear = parseInt(year);
      const stage = document.getElementById("stageSelect").value;
      eurovisionData = await loadSupabaseDataForStageAndYear(stage, currentYear);

      document.getElementById("tableHeader").textContent = `Eurovision ${stage} - ${currentYear}`;
      renderTable();
      sortBy("Total Points", "desc");
    }

    function renderTable() {
      const tbody = document.getElementById('eurovision-table-body');
      tbody.innerHTML = '';
      const stage = document.getElementById("stageSelect").value;
      const isFinal = stage === "Final";

      eurovisionData.forEach(row => {
        const tr = document.createElement('tr');
        const cells = columnDefinitions.map(col => {
          const label = col.label;
          const field = col.key || (isFinal ? col.final : col.semi);
          const value = row[field] ?? '';

          if (label === "Status" && isFinal) return '';
          if (label === "Status") {
            const qualified = row["SemiFinal_Rank"] && row["Final_Rank"];
            return `<td><span class="badge ${qualified ? 'qualified' : 'dnq'}">${qualified ? 'Qual' : 'DNQ'}</span></td>`;
          }
          if (label === "") {
            return `<td class="play-icon"><i data-feather="play-circle" class="video-trigger" data-url="${row.Video_URL || ''}"></i></td>`;
          }
          if (label === "Country") {
            const countryCode = (row.Country_Code || '').toLowerCase();
            return `<td><img class='flag-icon' src='flags/${countryCode}.png' alt='${value} flag' style='width:20px; vertical-align:middle; margin-right:6px;'>${value}</td>`;
          }
          return `<td>${value}</td>`;
        });
        tr.innerHTML = cells.join('');
        tbody.appendChild(tr);
      });
    }

    function sortBy(label, dir = null) {
      const stage = document.getElementById("stageSelect").value;
      const isFinal = stage === "Final";
      const col = columnDefinitions.find(c => c.label === label);
      const field = col?.key || (isFinal ? col?.final : col?.semi);
      if (!field) return;

      const isNumeric = typeof eurovisionData[0]?.[field] === 'number';
      currentSortDir = dir || (isNumeric ? 'desc' : 'asc');
      eurovisionData.sort((a, b) => {
        const valA = a[field] ?? (isNumeric ? 0 : '');
        const valB = b[field] ?? (isNumeric ? 0 : '');
        return currentSortDir === 'asc' ? valA - valB : valB - valA;
      });
      renderTable();
    }

    document.addEventListener("DOMContentLoaded", async () => {
      feather.replace();
      await loadAvailableYears();
      await loadTableData(currentYear);

      document.getElementById("yearSelect").addEventListener("change", e => {
        loadTableData(e.target.value);
      });

      document.getElementById("stageSelect").addEventListener("change", () => {
        loadTableData(currentYear);
      });

      document.addEventListener("click", e => {
        if (e.target.tagName === "TH" && e.target.dataset.key) {
          sortBy(e.target.dataset.key);
        }
      });
    });
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    label {
      font-weight: bold;
      margin-right: 8px;
    }
    #yearSelect, #stageSelect {
      margin-right: 20px;
      padding: 5px 10px;
      font-size: 1rem;
    }
    h1#tableHeader {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1 id="tableHeader">Eurovision Grand Final - 2025</h1>
  <label for="yearSelect">Year:</label>
  <select id="yearSelect"></select>
  <label for="stageSelect">Stage:</label>
  <select id="stageSelect">
    <option>Final</option>
    <option>Semi Final 1</option>
    <option>Semi Final 2</option>
  </select>

  <table>
    <thead id="tableHead">
      <tr>
        <th>Result</th>
        <th>Country</th>
        <th>Artist</th>
        <th></th>
        <th>Song</th>
        <th>R/O</th>
        <th>Televote Pts</th>
        <th>Televote Rank</th>
        <th>Jury Pts</th>
        <th>Jury Rank</th>
        <th>Total Points</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="eurovision-table-body"></tbody>
  </table>

  <div id="video-modal" style="display:none; position:fixed; top:10%; left:50%; transform:translateX(-50%); background:#000; padding:20px; border-radius:8px; z-index:1000;">
    <video id="modal-video" width="640" height="360" controls autoplay style="display:block;"></video>
  </div>

  <script>
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('video-trigger')) {
        const videoUrl = e.target.getAttribute('data-url');
        if (videoUrl) {
          const modal = document.getElementById('video-modal');
          const video = document.getElementById('modal-video');
          video.src = videoUrl;
          modal.style.display = 'block';
        }
      } else if (!e.target.closest('#video-modal')) {
        const modal = document.getElementById('video-modal');
        const video = document.getElementById('modal-video');
        video.pause();
        modal.style.display = 'none';
      }
    });
  </script>
</body>
</html>
