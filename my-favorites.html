<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>My Favourites</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="combined.css">
  <link rel="stylesheet" href="sidebar.css">

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .video-item.fade-out {
      opacity: 0;
      transition: opacity 0.3s ease-out;
    }
  </style>
</head>

<body oncontextmenu="return false">

  <!-- HEADER -->
  <div id="header-container"></div>
  <script type="module" src="js/header.js"></script>

  <div class="container">

    <!-- SIDEBAR -->
    <aside id="sidebar-container" class="sidebar"></aside>
    <script type="module" src="js/sidebar.js"></script>

    <main class="main-content">

      <div class="edition-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2 style="margin-left:20px;">My Favourites</h2>
        <p style="margin-right:20px;font-size:0.85rem;color:#aaa;">
          Click the red heart to remove a video from your favourites.
        </p>
      </div>

      <div id="video-container" class="grid-container"></div>

    </main>

  </div>

  <!-- MODAL + FOOTER -->
  <div id="modal-root"></div>
  <script src="js/modal.js"></script>

  <div id="footer"></div>
  <script src="js/footer.js"></script>

  <!-- CRITICAL: load video.js BEFORE my-favorites.js -->
  <script type="module" src="js/video.js"></script>
  <script type="module" src="js/my-favorites.js"></script>

</body>
</html>
