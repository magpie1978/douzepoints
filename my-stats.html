<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My Stats</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/favicons.js"></script>
    
    <link rel="stylesheet" href="style/combined.css">
    <!--<link rel="stylesheet" type="text/css" href="style/video-cards.css">
    <link rel="stylesheet" type="text/css" href="style/favorites.css">
    <link rel="stylesheet" href="style/sidebar.css">
    <link rel="stylesheet" href="style/playlist.css">-->
    
  </head>
  
  <body oncontextmenu="return false">
  
    <!-- HEADER (banner + divider is inserted automatically by header.js) -->
    <div id="header-container"></div>
  
    <!-- The red divider is included INSIDE header.html, so nothing else needed here -->
  
    <!-- MAIN CONTENT -->
    <div class="container">
      <main class="main-content">
  
        <!-- STATS PANEL -->
        <div id="wh-summary" class="wh-summary-panel">
          <div class="stat-box">
            <div class="stat-value" id="total-videos-watched">0</div>
            <div class="stat-label">Videos Watched</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="total-views">0</div>
            <div class="stat-label">Total Views</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="total-watch-time">0m</div>
            <div class="stat-label">Total Watch Time</div>
          </div>
        </div>
  
        <br>
        <br>
        <br>
        <br>
        
        <!-- TABLE -->
        <div class="table-aligned-container">
          <div class="table-header-row"></div>
  
          <div class="table-wrapper">
            <table id="wh-table">
              <thead>
                <tr>
                  <th data-sort="artist">Artist</th>
                  <th data-sort="song">Song</th>
                  <th data-sort="country">Country</th>
                  <th data-sort="views">Views</th>
                  <th data-sort="watchtime">Watch Time</th>
                  <th data-sort="lastwatched">Last Watched</th>
                </tr>
              </thead>
              <tbody id="wh-tbody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  
    <!-- MODAL -->
    <div id="modal-container"></div>
  
    <!-- FOOTER -->
    <div id="footer"></div>
  
    <!-- JS -->
    <script src="js/supabaseClient.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/footer.js"></script>
    <script type="module" src="js/header.js"></script>
    <script type="module" src="js/my-stats.js"></script>
  
  </body>
</html>
