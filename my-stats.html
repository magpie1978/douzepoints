<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>My Stats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Core styles -->
  <link rel="stylesheet" href="style/combined.css">
  <link rel="stylesheet" href="style/sidebar.css">
  <link rel="stylesheet" href="style/my-stats.css">
  <link rel="stylesheet" href="style/footer.css">
  

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body oncontextmenu="return false">

  <!-- HEADER (banner + divider is inserted automatically by header.js) -->
  <div id="header-container"></div>

  <!-- The red divider is included INSIDE header.html, so nothing else needed here -->

  <!-- MAIN CONTENT -->
  <div class="container">
    <main class="main-content">

      <!-- STATS PANEL -->
      <div id="wh-summary" class="wh-summary-panel">
        <div class="stat-box">
          <div class="stat-value" id="total-videos-watched">0</div>
          <div class="stat-label">Videos Watched</div>
        </div>

        <div class="stat-box">
          <div class="stat-value" id="total-views">0</div>
          <div class="stat-label">Total Views</div>
        </div>

        <div class="stat-box">
          <div class="stat-value" id="total-watch-time">0m</div>
          <div class="stat-label">Total Watch Time</div>
        </div>
      </div>

      <!-- TABLE -->
      <table id="watch-table" class="scoreboard-table wh-table">
        <thead>
          <tr>
            <th class="sortable" data-sort="video">Video</th>
            <th class="sortable" data-sort="artist">Artist</th>
            <th class="sortable" data-sort="song">Song</th>
            <th class="sortable" data-sort="country">Country</th>
            <th class="sortable" data-sort="views">Views</th>
            <th class="sortable" data-sort="watch">Watch Time</th>
            <th class="sortable" data-sort="last">Last Watched</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

    </main>
  </div>

  <!-- MODAL -->
  <div id="modal-container"></div>

  <!-- FOOTER -->
  <div id="footer"></div>

  <!-- JS -->
  <script src="js/supabaseClient.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/footer.js"></script>
  <script type="module" src="js/header.js"></script>
  <script type="module" src="js/my-stats.js"></script>

</body>
</html>
