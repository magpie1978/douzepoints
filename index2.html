<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Douze Points</title>

  <link rel="stylesheet" href="style/combined.css">
  <link rel="stylesheet" href="style/favorites.css">
  <link rel="stylesheet" href="style/carousels.css">
  <link rel="stylesheet" href="style/video-cards.css">
  <link rel="stylesheet" href="style/footer.css">

  <script src="/js/favicons.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html, body { height: 100%; }

    #auth-overlay,
    #signup-modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 99999;
    }

    #auth-modal,
    #signup-modal {
      width: min(500px, 92vw);
      padding: 32px;
      border-radius: 18px;
      background: rgba(20, 25, 40, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow:
        0 25px 60px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 18px;
      color: #fff;
      box-sizing: border-box;
      position: relative;
    }

    #auth-modal input,
    #signup-modal input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
    }

    .modal-btn {
      padding: 12px 22px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    .primary {
      background: #e50914;
      color: white;
    }

    .secondary {
      background: rgba(255,255,255,0.12);
      color: white;
    }

    .auth-buttons,
    .auth-secondary,
    .signup-buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .auth-divider {
      height: 1px;
      background: rgba(255,255,255,0.12);
    }

    .auth-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 24px;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div id="header-container"></div>
  <script type="module" src="js/header_new.js"></script>

  <br><br>

  <!-- ================= MAIN CONTENT ================= -->

  <div class="page-layout">
    <div class="main-content">

      <!-- Winners -->
      <div class="carousel-section">
        <div class="section-header">
          <h4>Eurovision Winners</h4>
          <a class="view-more" href="winners.html">VIEW MORE</a>
        </div>
        <div class="carousel-wrapper">
          <button class="carousel-button" onclick="scrollCarousel(-1,'carouselTrack1')">&#10094;</button>
          <div class="carousel-container">
            <div class="carousel-track" id="carouselTrack1"></div>
          </div>
          <button class="carousel-button" onclick="scrollCarousel(1,'carouselTrack1')">&#10095;</button>
        </div>
      </div>

      <!-- Basel -->
      <div class="carousel-section">
        <div class="section-header">
          <h4>Basel 2025</h4>
          <a class="view-more" href="edition.html?edition=2025">VIEW ALL</a>
        </div>
        <div class="carousel-wrapper">
          <button class="carousel-button" onclick="scrollCarousel(-1,'carouselTrack4')">&#10094;</button>
          <div class="carousel-container">
            <div class="carousel-track" id="carouselTrack4"></div>
          </div>
          <button class="carousel-button" onclick="scrollCarousel(1,'carouselTrack4')">&#10095;</button>
        </div>
      </div>

      <!-- Malmö -->
      <div class="carousel-section">
        <div class="section-header">
          <h4>Malmö 2024</h4>
          <a class="view-more" href="edition.html?edition=2024">VIEW ALL</a>
        </div>
        <div class="carousel-wrapper">
          <button class="carousel-button" onclick="scrollCarousel(-1,'carouselTrack2')">&#10094;</button>
          <div class="carousel-container">
            <div class="carousel-track" id="carouselTrack2"></div>
          </div>
          <button class="carousel-button" onclick="scrollCarousel(1,'carouselTrack2')">&#10095;</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ================= LOGIN OVERLAY ================= -->

  <div id="auth-overlay">
    <div id="auth-modal">
      <h3>Sign in to use Favorites</h3>
      <input type="email" id="login-email" placeholder="Email">
      <input type="password" id="login-password" placeholder="Password">

      <div class="auth-buttons">
        <button id="login-btn" class="modal-btn primary">Log In</button>
      </div>

      <div class="auth-divider"></div>

      <div class="auth-secondary">
        <button id="open-signup" class="modal-btn secondary">Create account</button>
      </div>

      <button id="auth-close" class="auth-close">×</button>
      <p id="login-error" style="text-align:center;color:#e50914;"></p>
    </div>
  </div>

  <!-- ================= SIGNUP OVERLAY ================= -->

  <div id="signup-modal-overlay">
    <div id="signup-modal">
      <h3>Create Account</h3>
      <input id="signup-email" type="email" placeholder="Email">
      <input id="signup-password" type="password" placeholder="Password">
      <input id="signup-promo" type="text" placeholder="Promo Code (required)">

      <div class="signup-buttons">
        <button id="signup-submit" class="modal-btn primary">Create Account</button>
        <button id="signup-close" class="modal-btn secondary">Close</button>
      </div>

      <p id="signup-error" style="text-align:center;color:#e50914;"></p>
    </div>
  </div>

  <!-- ================= REQUIRED SCRIPTS ================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/supabaseClient.js"></script>
  <script type="module" src="js/video.js"></script>
  <script src="js/modal.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script src="js/footer.js"></script>

  <div id="footer"></div>

</body>
</html>
