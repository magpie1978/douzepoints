<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DouzePoints</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style/combined.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <!-- ================= HEADER ================= -->
  <div id="header-container"></div>
  <script type="module" src="js/header_new.js"></script>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="container">
    <div class="main-content">

      <!-- Your page sections here -->
      <h4>Eurovision Winners</h4>
      <!-- carousel, grids etc -->

    </div>
  </div>

  <!-- ================================================= -->
  <!-- AUTH LOGIN OVERLAY (MUST BE DIRECT CHILD OF BODY) -->
  <!-- ================================================= -->

  <div id="auth-overlay">
    <div id="auth-modal">

      <h3>Sign in to use Favorites</h3>

      <input type="email" id="login-email" placeholder="Email">
      <input type="password" id="login-password" placeholder="Password">

      <div class="auth-buttons">
        <button id="login-btn" class="modal-btn primary">
          Log In
        </button>
      </div>

      <div class="auth-divider"></div>

      <div class="auth-secondary">
        <button id="open-signup" class="modal-btn secondary">
          Create account
        </button>
      </div>

      <button id="auth-close" class="auth-close">×</button>

    </div>
  </div>

  <!-- ================================================= -->
  <!-- SIGNUP OVERLAY                                   -->
  <!-- ================================================= -->

  <div id="signup-modal-overlay">
    <div id="signup-modal">

      <h3>Create Account</h3>

      <input id="signup-email" type="email" placeholder="Email">
      <input id="signup-password" type="password" placeholder="Password">
      <input id="signup-promo" type="text" placeholder="Promo Code (required)">

      <div class="signup-buttons">
        <button id="signup-submit" class="modal-btn primary">
          Create Account
        </button>
        <button id="signup-close" class="modal-btn secondary">
          Close
        </button>
      </div>

      <p id="signup-error"
         style="min-height:18px; text-align:center; margin-top:6px;">
      </p>

    </div>
  </div>

  <!-- ================= SCRIPTS ================= -->

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/supabaseClient.js"></script>

</body>
</html>
