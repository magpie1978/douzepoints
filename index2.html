<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Douze Points</title>

  <link rel="stylesheet" href="style/combined.css">
  <link rel="stylesheet" href="style/favorites.css">
  <link rel="stylesheet" href="style/carousels.css">
  <link rel="stylesheet" href="style/video-cards.css">
  <link rel="stylesheet" href="style/footer.css">

  <script src="/js/favicons.js"></script>

  <!-- IMPORTANT: Use same lucide loader as working file -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>
    window.lucideLoaded = true;
  </script>

  <style>
    html, body { height: 100%; }

    /* LOGIN OVERLAY */
    #auth-overlay,
    #signup-modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(10px);
      z-index: 99999;
    }

    #auth-modal,
    #signup-modal {
      width: min(520px, 92vw);
      padding: 32px;
      border-radius: 18px;
      background: rgba(20, 25, 40, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 30px 70px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 18px;
      color: #fff;
      position: relative;
    }

    #auth-modal input,
    #signup-modal input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 15px;
    }

    .modal-btn {
      padding: 12px 22px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .primary { background: #e50914; color: white; }
    .secondary { background: rgba(255,255,255,0.12); color: white; }

    .auth-buttons,
    .auth-secondary,
    .signup-buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .auth-divider {
      height: 1px;
      background: rgba(255,255,255,0.12);
    }

    .auth-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 24px;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
    }
  </style>
</head>

<body oncontextmenu="return false">

  <!-- HEADER -->
  <div id="header-container"></div>
  <script type="module" src="js/header_new.js"></script>

  <br><br>

  <div class="page-layout">
    <div class="main-content">

      <!-- CAROUSELS -->
      <div class="carousel-section">
        <div class="section-header">
          <h4>Eurovision Winners</h4>
          <a class="view-more" href="winners.html">VIEW MORE</a>
        </div>
        <div class="carousel-wrapper">
          <button class="carousel-button" onclick="scrollCarousel(-1,'carouselTrack1')">&#10094;</button>
          <div class="carousel-container">
            <div class="carousel-track" id="carouselTrack1"></div>
          </div>
          <button class="carousel-button" onclick="scrollCarousel(1,'carouselTrack1')">&#10095;</button>
        </div>
      </div>

      <!-- KEEP YOUR OTHER CAROUSELS EXACTLY SAME -->

      <!-- IMPORTANT: modal.js restored -->
      <script src="js/modal.js"></script>
      <div id="modal-container"></div>

      <!-- SUPABASE + VIDEO LOADER -->
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
      <script type="module" src="js/supabaseClient.js"></script>
      <script type="module" src="js/video.js"></script>

    </div>
  </div>

  <!-- LOGIN OVERLAY -->
  <div id="auth-overlay">
    <div id="auth-modal">
      <h3>Sign in to use Favorites</h3>
      <input type="email" id="login-email" placeholder="Email">
      <input type="password" id="login-password" placeholder="Password">
      <div class="auth-buttons">
        <button id="login-btn" class="modal-btn primary">Log In</button>
      </div>
      <div class="auth-divider"></div>
      <div class="auth-secondary">
        <button id="open-signup" class="modal-btn secondary">Create account</button>
      </div>
      <button id="auth-close" class="auth-close">×</button>
      <p id="login-error" style="text-align:center;color:#e50914;"></p>
    </div>
  </div>

  <!-- SIGNUP OVERLAY -->
  <div id="signup-modal-overlay">
    <div id="signup-modal">
      <h3>Create Account</h3>
      <input id="signup-email" type="email" placeholder="Email">
      <input id="signup-password" type="password" placeholder="Password">
      <input id="signup-promo" type="text" placeholder="Promo Code (required)">
      <div class="signup-buttons">
        <button id="signup-submit" class="modal-btn primary">Create Account</button>
        <button id="signup-close" class="modal-btn secondary">Close</button>
      </div>
      <p id="signup-error" style="text-align:center;color:#e50914;"></p>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>

  <div id="footer"></div>
  <script src="js/footer.js"></script>

</body>
</html>
