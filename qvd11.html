<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Queen Victoria's Descendants</title>
<style>
  :root { --bg:#0f111a; --panel:#1c1f2b; --accent:#e50914; --text:#e8e8e8; --muted:#bdbdbd; --glass:#121728; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--text);
         font-family:'Raleway',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }

  /* Top search bar */
  #topbar{
    position:fixed; top:12px; left:50%; transform:translateX(-50%);
    width:min(720px, 92vw);
    z-index:300;
  }
  #searchwrap{
    position:relative;
    background:rgba(20,24,38,.85);
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    padding:8px 12px;
    box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(229,9,20,.2) inset;
    backdrop-filter: blur(4px);
  }
  #search{
    width:100%; border:0; outline:none; background:transparent; color:var(--text);
    font-size:16px; line-height:22px;
  }
  #search::placeholder{ color:#9aa0b4; }

  /* Suggestions dropdown */
  #suggest{
    position:absolute; top:100%; left:0; right:0; margin-top:6px;
    background:var(--glass);
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px; overflow:hidden; display:none; z-index:310;
    box-shadow:0 16px 40px rgba(0,0,0,.45);
  }
  #suggest.show{ display:block; }
  .sug{
    display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer;
  }
  .sug:hover, .sug.active{ background:#1a1e2c; }
  .sug .s-name{ font-weight:700; }
  .sug .s-title{ color:var(--muted); font-size:12px; }

  /* Scrollable stage */
  #scroll { position:absolute; inset:0; overflow:auto; }
  #world  { position:relative; width:2400px; height:1600px; }

  /* SVG underlay (thin strokes) */
  #connector { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .edge,.bus,.stem,.drop,.spouse { stroke:var(--accent); stroke-width:1.5; fill:none; vector-effect:non-scaling-stroke; }
  .spouse { stroke-width:2; opacity:.9; }
  .dotted { stroke-dasharray: 6 6; }

  /* Person cards (clickable) */
  .person {
    position:absolute; z-index:1; display:grid; grid-template-columns:1fr 2fr;
    width:360px; height:120px; background:var(--panel);
    border:2px solid var(--accent); border-radius:14px; overflow:hidden;
    user-select:none; cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.35), 0 0 0 1px rgba(229,9,20,.25) inset;
    transition: transform .18s ease, box-shadow .22s ease, border-color .22s ease, background-color .22s ease, filter .22s ease;
    will-change: transform, box-shadow, filter;
  }
  .person:hover {
    transform: translateY(-4px) scale(1.015);
    background-color:#1a1e2c;
    border-color: rgba(229,9,20,0.95);
    box-shadow: 0 14px 28px rgba(0,0,0,.55), 0 0 0 1px rgba(229,9,20,.45) inset, 0 0 26px rgba(229,9,20,.35);
    filter: saturate(1.1);
  }
  .person:focus-visible { outline:2px solid rgba(229,9,20,.95); outline-offset:3px; }
  .avatar { width:100%; height:100%; background:#222; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .details { display:flex; flex-direction:column; justify-content:center; padding:12px 16px; }
  .name { font-weight:700; font-size:1.1rem; }
  .title { font-size:.9rem; color:var(--muted); margin-top:4px; }

  /* Focus flash when searched */
  @keyframes focusPulse {
    0% { box-shadow:0 0 0 0 rgba(229,9,20,.7); }
    60%{ box-shadow:0 0 0 10px rgba(229,9,20,.0); }
    100%{ box-shadow:0 0 0 0 rgba(229,9,20,.0); }
  }
  .focus-flash { animation: focusPulse 1.2s ease-out 1; }

  /* Empty info panel */
  .modal { position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.55); z-index:200; }
  .modal[open] { display:grid; }
  .dialog { width:min(740px,92vw); min-height:160px; background:#141826; border:1px solid rgba(255,255,255,.1);
            border-radius:16px; box-shadow:0 30px 70px rgba(0,0,0,.5); padding:18px; }
</style>
</head>
<body>
  <!-- SEARCH BAR -->
  <div id="topbar" role="search">
    <div id="searchwrap">
      <input id="search" type="text" placeholder="Search by name or title… (e.g., ‘Victoria’ or ‘Duke’)" autocomplete="off" aria-label="Search people by name or title" />
      <div id="suggest" role="listbox" aria-label="Search suggestions"></div>
    </div>
  </div>

  <!-- SCROLLABLE STAGE -->
  <div id="scroll" aria-live="polite">
    <div id="world">
      <svg id="connector" viewBox="0 0 2400 1600" preserveAspectRatio="none"></svg>
      <div id="cards-root"></div>
    </div>
  </div>

  <!-- Empty info panel (kept for future use) -->
  <div class="modal" id="infoPanel" role="dialog" aria-modal="true">
    <div class="dialog"></div>
  </div>

<script>
/* ===================== Config (no caching) ===================== */
const CARD_W=360, CARD_H=120, PADDING=200;
const DEFAULT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuhOVOmxBKNUpqZ2pw4ned_uUSne68S2gpJHPngVtYkFXJ1Q829-OMcGxjU-zeNAX9OVGGYljhftCV/pub?gid=0&single=true&output=csv";
const FALLBACK_IMAGE = "https://i.pinimg.com/736x/3f/3c/f8/3f3cf824ceb39fa5dbd00aa986e25f54.jpg";

/* ===================== Elements ===================== */
const world=document.getElementById('world');
const svg=document.getElementById('connector');
const cards=document.getElementById('cards-root');
const infoPanel = document.getElementById('infoPanel');
const scrollEl = document.getElementById('scroll');
const searchInput = document.getElementById('search');
const suggestBox = document.getElementById('suggest');

let state = { nodes:{}, edges:[], triEdges:[] };
let dataReady = false;

/* ===================== Helpers ===================== */
function updateWorldSize(){
  let maxX=1200, maxY=800;
  Object.values(state.nodes).forEach(n=>{
    if(typeof n.x==='number' && typeof n.y==='number'){
      if(n.x+CARD_W>maxX) maxX=n.x+CARD_W;
      if(n.y+CARD_H>maxY) maxY=n.y+CARD_H;
    }
  });
  maxX += PADDING; maxY += PADDING;
  world.style.width = maxX + 'px';
  world.style.height= maxY + 'px';
  svg.setAttribute('viewBox','0 0 '+maxX+' '+maxY);
}
function clamp0(v){ return Math.max(0, v); }
function norm(s){ return (s||'').toString().toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,''); }

/* ===================== Geometry & SVG helpers ===================== */
function cardRect(id){
  const el=document.getElementById(id); if(!el) return null;
  const r=el.getBoundingClientRect(), wr=world.getBoundingClientRect();
  const leftInWorld = r.left - wr.left, topInWorld = r.top - wr.top;
  return { el, cx:leftInWorld + r.width/2, cy:topInWorld + r.height/2, w:r.width, h:r.height };
}
function ensureLine(id,cls){
  let l=document.getElementById(id);
  if(!l){ l=document.createElementNS('http://www.w3.org/2000/svg','line'); l.id=id; l.classList.add(cls); l.setAttribute('vector-effect','non-scaling-stroke'); svg.appendChild(l); }
  return l;
}

/* ===================== Connectors ===================== */
function drawEdge(e){
  const a=cardRect(e.from), b=cardRect(e.to); if(!a||!b) return;
  const id='edge-'+e.from+'-'+e.to; const l=ensureLine(id,'edge');
  e.dotted ? l.classList.add('dotted') : l.classList.remove('dotted');
  l.setAttribute('x1',a.cx); l.setAttribute('y1',a.cy);
  l.setAttribute('x2',b.cx); l.setAttribute('y2',b.cy);
}
function updateAllEdges(){
  svg.querySelectorAll('.edge,.stem,.bus,.drop,.spouse').forEach(e=>e.remove());
  state.edges.forEach(drawEdge);
}

/* ===================== Rendering (card click opens panel) ===================== */
function renderNode(n){
  let el=document.getElementById(n.id);
  if(!el){
    el=document.createElement('div'); el.id=n.id; el.className='person'; el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.innerHTML='<div class="avatar"><img alt="'+(n.name||'photo')+'"></div>\
      <div class="details">\
        <div class="name"></div>\
        <div class="title"></div>\
      </div>';
    cards.appendChild(el);
    // Clicking anywhere on the card opens the (blank) info panel
    el.addEventListener('click', ()=> infoPanel.setAttribute('open',''));
    // Keyboard access
    el.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); infoPanel.setAttribute('open',''); }});
  }
  el.querySelector('.name').textContent=n.name||'';
  el.querySelector('.title').textContent=n.title||'';
  const img=el.querySelector('img');
  img.src = n.imgSrc || FALLBACK_IMAGE;
  img.onerror = ()=>{ img.src = FALLBACK_IMAGE; };
  el.style.transform='translate('+n.x+'px,'+n.y+'px)';
}
function renderAll(){
  cards.innerHTML='';
  Object.values(state.nodes).forEach(renderNode);
  updateWorldSize();
  updateAllEdges();
  dataReady = true;
}

/* ===================== Focus / Search ===================== */
function centerOnElement(el){
  const rect = el.getBoundingClientRect();
  const wrect = world.getBoundingClientRect();
  const xInWorld = rect.left - wrect.left + rect.width/2;
  const yInWorld = rect.top  - wrect.top  + rect.height/2;

  const targetLeft = clamp0(xInWorld - scrollEl.clientWidth/2);
  const targetTop  = clamp0(yInWorld - scrollEl.clientHeight/2);

  scrollEl.scrollTo({ left: targetLeft, top: targetTop, behavior: 'smooth' });
}

function focusPerson(id){
  const el = document.getElementById(id);
  if(!el) return;
  centerOnElement(el);
  el.classList.remove('focus-flash'); // restart animation
  // force reflow to restart CSS animation
  void el.offsetWidth;
  el.classList.add('focus-flash');
  el.focus({preventScroll:true});
}

function scoreMatch(n, q){
  const name = norm(n.name), title = norm(n.title);
  const exact = (name===q || title===q) ? 100 : 0;
  const starts = (name.startsWith(q) || title.startsWith(q)) ? 60 : 0;
  const includes = (name.includes(q) || title.includes(q)) ? 30 : 0;
  const idxName = name.indexOf(q);
  const idxTitle= title.indexOf(q);
  const posBonus = Math.max(0, 20 - Math.min(idxName<0?99:idxName, idxTitle<0?99:idxTitle));
  return exact || (starts + includes + posBonus);
}

function search(query){
  const q = norm(query.trim());
  if(!q) return [];
  const items = Object.values(state.nodes).map(n=>({id:n.id, name:n.name||'', title:n.title||'', score:scoreMatch(n,q)}))
                 .filter(x=>x.score>0)
                 .sort((a,b)=>b.score - a.score)
                 .slice(0, 10);
  return items;
}

function renderSuggestions(items){
  suggestBox.innerHTML = '';
  if(!items.length){ suggestBox.classList.remove('show'); return; }
  items.forEach((it, i)=>{
    const div = document.createElement('div');
    div.className = 'sug' + (i===0 ? ' active' : '');
    div.setAttribute('role','option');
    div.dataset.pid = it.id;
    div.innerHTML = `<div class="s-name">${it.name}</div><div class="s-title">${it.title}</div>`;
    div.addEventListener('click', ()=>{
      focusPerson(it.id);
      suggestBox.classList.remove('show');
    });
    suggestBox.appendChild(div);
  });
  suggestBox.classList.add('show');
}

function pickFirstSuggestion(){
  const first = suggestBox.querySelector('.sug');
  if(first){ focusPerson(first.dataset.pid); suggestBox.classList.remove('show'); }
}

searchInput.addEventListener('input', ()=>{
  if(!dataReady) return;
  const items = search(searchInput.value);
  renderSuggestions(items);
});
searchInput.addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){ e.preventDefault(); pickFirstSuggestion(); }
  else if(e.key==='Escape'){ suggestBox.classList.remove('show'); searchInput.blur(); }
  else if(e.key==='ArrowDown' || e.key==='ArrowUp'){
    const items = Array.from(suggestBox.querySelectorAll('.sug'));
    if(!items.length){ return; }
    e.preventDefault();
    let idx = items.findIndex(x=>x.classList.contains('active'));
    if(e.key==='ArrowDown') idx = (idx+1) % items.length;
    else idx = (idx-1+items.length) % items.length;
    items.forEach(x=>x.classList.remove('active'));
    items[idx].classList.add('active');
    items[idx].scrollIntoView({block:'nearest'});
  }
  else if(e.key==='Tab'){
    // accept highlighted suggestion on Tab
    const active = suggestBox.querySelector('.sug.active');
    if(active){ e.preventDefault(); focusPerson(active.dataset.pid); suggestBox.classList.remove('show'); }
  }
});

/* ===================== CSV IMPORT (no cache, strict positions) ===================== */
function withNoCache(url){ return url + (url.includes('?') ? '&' : '?') + 'nocache=' + Date.now(); }
function fetchPublishedCsv(csvUrl) {
  return fetch(withNoCache(csvUrl), { mode:'cors' }).then(r=>{ if(!r.ok) throw new Error('CSV fetch failed: '+r.status); return r.text(); });
}
function parseCsv(text) {
  const rows=[]; let field='', row=[], inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; }
      else field+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n' || c==='\r'){ if(field.length || row.length){ row.push(field); rows.push(row); row=[]; field=''; } if(c==='\r' && text[i+1]==='\n') i++; }
      else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function slugifyId(s){
  return (s||"").toString().trim().toLowerCase().normalize("NFKD").replace(/[^\w]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40) || "row";
}
function rowsFromCsvTable(rows) {
  if(!rows.length) return [];
  const headers = rows[0].map(h => (h||'').toString().trim().toLowerCase());
  const out=[];
  for(let r=1;r<rows.length;r++){
    const obj={};
    for(let c=0;c<headers.length;c++){
      const key=headers[c] || ('col'+c);
      obj[key] = (rows[r][c] || '').toString().trim();
    }
    obj.id   = (obj.id || '').trim();
    obj.name = (obj.name || '').trim();
    if(!obj.id) obj.id = obj.name ? slugifyId(obj.name) : ('row'
