<!-- Logout Logic -->
<script type="module">
    import { supabase } from './supabaseClient.js';
    import lucide from "https://unpkg.com/lucide@latest/dist/esm/lucide.js";

    // Activate icons
    lucide.createIcons();

    document.getElementById("logout-btn").addEventListener("click", async (e) => {
        e.preventDefault();

        const { error } = await supabase.auth.signOut();

        if (error) {
            console.error("Logout error:", error);
            alert("Failed to log out.");
        } else {
            window.location.href = "login.html";
        }
    });
</script>

<style>
    /* Layout: left links + right logout icon */
    .header-overlay {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 30px;
    }

    .header-links a {
        margin-right: 20px;
    }

    /* Logout container */
    .header-right {
        margin-left: auto; /* Push logout fully right */
    }

    /* Logout link styling */
    .logout-link {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #e50914 !important;
        font-weight: bold;
        text-decoration: none;
        cursor: pointer;
    }

    .logout-link:hover {
        opacity: 0.8;
    }

    /* Icon styling */
    .logout-icon {
        width: 22px;
        height: 22px;
        stroke-width: 2.5;
        color: #e50914;
    }
</style>
