<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Line of Succession (Scoreboard Style)</title>

  <link href="style/scoreboard.css" rel="stylesheet" />
  <link href="style/footer.css" rel="stylesheet" />

  <style>
    :root{
      --bg:#0f111a; --panel:#1c1f2b; --text:#e8e8e8; --muted:#bdbdbd; --border:#2a2f3f;
      --btn:#1f2433; --btnActive:#2a3044;
    }
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Raleway',system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .main-content{max-width:1100px;margin:32px auto;padding:0 20px 60px}
    .table-wrapper{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:auto}
    table{width:100%;border-collapse:separate;border-spacing:0;min-width:780px}
    thead th{position:sticky;top:0;background:#141826;text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:800}
    tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
    tbody tr:hover{background:#1a1e2c}
    .pos{width:56px;text-align:right;font-variant-numeric:tabular-nums}
    .thumb-wrap{display:flex;align-items:center;gap:12px}
    .thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#222;border:1px solid var(--border)}
    .name{font-weight:800}
    .titles{color:var(--muted);font-size:.95rem}
    .muted{color:var(--muted)}

    /* Toggle */
    .toggle{
      display:inline-flex;gap:8px;padding:10px 0;margin:8px 0 18px 0;flex-wrap:wrap
    }
    .toggle button{
      border:1px solid var(--border);background:var(--btn);color:var(--text);
      padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:700
    }
    .toggle button[aria-pressed="true"]{background:var(--btnActive)}
    .toggle .hint{color:var(--muted);margin-left:8px}

    @media (max-width:640px){
      .titles{display:none}
      thead th[data-col="titles"], tbody td[data-col="titles"]{display:none}
    }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <div class="main-content">
    <h1 id="tableHeader">Line of Succession</h1>

    <div class="toggle" role="group" aria-label="View toggle">
      <button id="btnExcl" data-mode="excluding" aria-pressed="true">Excluding</button>
      <button id="btnIncl" data-mode="including" aria-pressed="false">Including</button>
      <span class="hint" id="toggleHint">Showing only eligible people (excluded hidden)</span>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr id="thead-row">
            <!-- filled by JS -->
          </tr>
        </thead>
        <tbody id="succession-body"></tbody>
      </table>
    </div>

    <p id="status" class="muted" style="padding:10px 2px;"></p>
  </div>

  <div id="footer"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // From your existing setup
    const SUPABASE_URL = 'https://eukgodthgusongsbhdwg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1a2dvZHRoZ3Vzb25nc2JoZHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1NjI1NjAsImV4cCI6MjA2NzEzODU2MH0.e8Gm9utDCQWDjSOJgh-VBioCQFX_aAWXz8rzigFgh4s';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const tbody = document.getElementById('succession-body');
    const statusEl = document.getElementById('status');
    const theadRow = document.getElementById('thead-row');
    const toggleHint = document.getElementById('toggleHint');
    const btnExcl = document.getElementById('btnExcl');
    const btnIncl = document.getElementById('btnIncl');

    const FALLBACK_IMAGE = "https://i.pinimg.com/736x/3f/3c/f8/3f3cf824ceb39fa5dbd00aa986e25f54.jpg";
    const safe = v => (v == null || v === '') ? '—' : String(v);

    // Fixed rule: order BY order_incl, display order_excl
    const ORDER_BY_COL = 'order_incl';
    const DISPLAY_POS_COL = 'order_excl';

    let mode = 'excluding'; // default startup mode

    function renderHeader(currentMode){
      const including = (currentMode === 'including');

      theadRow.innerHTML = `
        <th class="pos" data-col="position"># (order_excl)</th>
        <th data-col="photo">Photo</th>
        <th data-col="name">Name</th>
        <th data-col="titles">Titles</th>
        <th data-col="dob">DOB</th>
        ${including ? `<th data-col="exclusion">Exclusion</th>` : ``}
      `;

      const header = document.getElementById('tableHeader');
      if(including){
        header.textContent = 'Line of Succession (including excluded)';
        toggleHint.textContent = 'Showing everyone (ordered by order_incl; exclusion reason displayed)';
      } else {
        header.textContent = 'Line of Succession';
        toggleHint.textContent = 'Showing only eligible people (ordered by order_incl)';
      }

      btnExcl.setAttribute('aria-pressed', String(!including));
      btnIncl.setAttribute('aria-pressed', String(including));
    }

    function makeRow(row, currentMode){
      const { name, title, title1, title2, dob, img, image_url, exclusion_flag } = row;
      const t1 = title1 ?? title ?? '';
      const t2 = title2 ?? '';
      const titles = [t1, t2].filter(Boolean).join(' · ') || '—';
      const imgSrc = img || image_url || FALLBACK_IMAGE;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="pos" data-col="position">${safe(row[DISPLAY_POS_COL])}</td>
        <td data-col="photo">
          <div class="thumb-wrap">
            <img class="thumb" alt="${safe(name)}" src="${imgSrc}" onerror="this.src='${FALLBACK_IMAGE}'" />
          </div>
        </td>
        <td class="name" data-col="name">${safe(name)}</td>
        <td class="titles" data-col="titles">${titles}</td>
        <td class="muted" data-col="dob">${safe(dob)}</td>
        ${currentMode === 'including'
          ? `<td class="muted" data-col="exclusion">${safe(exclusion_flag)}</td>`
          : ``}
      `;
      return tr;
    }

    function render(rows, currentMode){
      tbody.innerHTML = '';
      if(!rows?.length){
        statusEl.textContent = 'No entries found.';
        return;
      }
      statusEl.textContent = '';
      const frag = document.createDocumentFragment();
      rows.forEach(r => frag.appendChild(makeRow(r, currentMode)));
      tbody.appendChild(frag);
    }

    async function loadData(currentMode){
      statusEl.textContent = 'Loading…';

      // Base query: always order by order_incl and only consider positive order_incl
      let query = supabase
        .from('qvd_website')
        .select('*')
        .gt(ORDER_BY_COL, 0)
        .order(ORDER_BY_COL, { ascending: true });

      // If excluding, filter to only those actually in line (order_excl > 0)
      if(currentMode === 'excluding'){
        query = query.gt('order_excl', 0);
      }

      const { data, error } = await query;
      if(error){
        statusEl.textContent = 'Error: ' + error.message;
        return;
      }
      render(data, currentMode);
      statusEl.textContent = '';
    }

    // Toggle handlers
    btnExcl.addEventListener('click', () => {
      mode = 'excluding';
      renderHeader(mode);
      loadData(mode);
    });
    btnIncl.addEventListener('click', () => {
      mode = 'including';
      renderHeader(mode);
      loadData(mode);
    });

    // Initial load
    renderHeader(mode);
    loadData(mode);
  </script>

  <script type="module" src="js/header.js"></script>
  <script src="js/footer.js" defer></script>
</body>
</html>
