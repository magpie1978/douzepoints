<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive Family Tree</title>
<style>
  :root {
    --bg: #0f111a;
    --panel: #1c1f2b;
    --accent: #e50914;
    --text: #e8e8e8;
    --muted: #bdbdbd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Raleway', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  /* Toolbar */
  .toolbar {
    position: fixed; top: 10px; left: 12px; z-index: 10;
    display: flex; gap: 8px; align-items: center;
    background: rgba(20,24,38,.85);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px; padding: 8px;
    backdrop-filter: blur(6px);
  }
  .btn {
    background: transparent; border: 1px solid var(--accent);
    color: var(--text); padding: 6px 10px; border-radius: 10px; cursor: pointer;
  }
  .btn:hover { background: rgba(229,9,20,.12); }
  .btn.ghost { border-color: rgba(255,255,255,.2); }

  /* SVG underlay */
  #connector {
    position: absolute; inset: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 0;
  }
  .edge, .bus, .stem, .drop, .spouse {
    stroke: var(--accent); stroke-width: 3; fill: none;
  }
  .spouse { stroke-width: 2; opacity: 0.9; }

  /* Person cards */
  .person {
    position: absolute; z-index: 1;
    display: grid; grid-template-columns: 1fr 2fr;
    width: 360px; height: 120px;
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 14px; overflow: hidden;
    cursor: grab; user-select: none;
    box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 0 1px rgba(229,9,20,.25) inset;
  }
  /* Rectangular photo taking the left third */
  .avatar { width:100%; height:100%; background:#222; border-radius:0 !important; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; border-radius:0 !important; }
  .avatar, .avatar * { border-radius:0 !important; }

  .details { display:flex; flex-direction:column; justify-content:center; padding: 12px 16px; }
  .name { font-weight: 700; font-size: 1.1rem; }
  .title { font-size: .9rem; color: var(--muted); margin-top: 4px; }
  .actions { margin-top: 10px; }
  .actions .btn { padding: 4px 8px; }

  /* Modal editor */
  .modal {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(0,0,0,.55); z-index: 20;
  }
  .modal[open] { display: grid; }
  .dialog {
    width: min(720px, 92vw);
    background: #141826; border: 1px solid rgba(255,255,255,.1); border-radius: 16px;
    box-shadow: 0 30px 70px rgba(0,0,0,.5);
    padding: 18px;
  }
  .grid { display: grid; gap: 12px; }
  .row { display: grid; gap: 8px; }
  label { font-size: .9rem; color: var(--muted); }
  input[type="text"], input[type="url"], select {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.15);
    background: #0f1320; color: var(--text);
  }
  select[multiple] { min-height: 100px; }
  .dialog .buttons { display:flex; gap:10px; justify-content:flex-end; margin-top:8px; }
</style>
</head>
<body>
  <div class="toolbar">
    <button class="btn" id="addPerson">Add Person</button>
    <button class="btn ghost" id="resetAll">Reset</button>
  </div>

  <svg id="connector" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  <div id="cards-root"></div>

  <!-- Edit dialog -->
  <div class="modal" id="editor" role="dialog" aria-modal="true">
    <div class="dialog">
      <h2>Edit Person</h2>
      <div class="grid">
        <div class="row">
          <label for="name">Name</label>
          <input id="name" type="text">
        </div>
        <div class="row">
          <label for="title">Title</label>
          <input id="title" type="text">
        </div>
        <div class="row">
          <label for="imgUrl">Image URL</label>
          <input id="imgUrl" type="url" placeholder="https://example.com/pic.jpg">
        </div>
        <div class="row">
          <label for="imgFile">Upload image</label>
          <input id="imgFile" type="file" accept="image/*">
        </div>

        <div class="row" style="grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label for="motherSel">Mother</label>
            <select id="motherSel"></select>
          </div>
          <div>
            <label for="fatherSel">Father</label>
            <select id="fatherSel"></select>
          </div>
        </div>

        <div class="row">
          <label for="partnersSel">Partners / Spouses (multi-select)</label>
          <select id="partnersSel" multiple></select>
        </div>

        <div class="buttons">
          <button class="btn ghost" id="clearImg" type="button">Clear Photo</button>
          <button class="btn" id="cancel" type="button">Cancel</button>
          <button class="btn" id="apply" type="button">Apply</button>
        </div>
      </div>
    </div>
  </div>

<script>
/* ========= Persistence ========= */
const STORE_KEY='familytree_v1';
function defaultState(){
  return {
    nodes:{
      A1:{id:'A1',name:'Person A',title:'Title goes here',imgSrc:'',x:200,y:200,motherId:null,fatherId:null,partners:[]},
      B2:{id:'B2',name:'Person B',title:'Title goes here',imgSrc:'',x:600,y:200,motherId:null,fatherId:null,partners:[]}
    },
    edges:[],            // 1→1 parent→child: {from, to}
    triEdges:[],         // 2→1 parents→child: {parents:[id1,id2], child}
    nextId:3
  };
}
let state = load();
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(STORE_KEY)||'null')||defaultState();
    Object.values(s.nodes).forEach(n=>{
      if(!('motherId' in n)) n.motherId=null;
      if(!('fatherId' in n)) n.fatherId=null;
      if(!Array.isArray(n.partners)) n.partners=[];
    });
    s.edges??=[]; s.triEdges??=[];
    return s;
  }catch{return defaultState();}
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

/* ========= Elements ========= */
const svg=document.getElementById('connector');
const cardsRoot=document.getElementById('cards-root');
const addBtn=document.getElementById('addPerson');
const resetBtn=document.getElementById('resetAll');

const editor=document.getElementById('editor');
const nameIn=document.getElementById('name');
const titleIn=document.getElementById('title');
const imgUrlIn=document.getElementById('imgUrl');
const imgFileIn=document.getElementById('imgFile');
const motherSel=document.getElementById('motherSel');
const fatherSel=document.getElementById('fatherSel');
const partnersSel=document.getElementById('partnersSel');
const applyBt=document.getElementById('apply');
const cancelBt=document.getElementById('cancel');
const clearBt=document.getElementById('clearImg');

let editingId=null;

/* ========= Geometry helpers ========= */
function sizeSVG(){ svg.setAttribute('viewBox', `0 0 ${innerWidth} ${innerHeight}`); }
function cardRect(id){
  const el=document.getElementById(id); if(!el) return null;
  const r=el.getBoundingClientRect();
  return {
    el,
    cx: r.left + r.width/2,
    cy: r.top  + r.height/2,
    topx: r.left + r.width/2,
    topy: r.top,
    bottomy: r.bottom
  };
}

/* ========= Line helpers ========= */
function ensureLine(id, cls){
  let ln=document.getElementById(id);
  if(!ln){
    ln=document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.id=id; ln.classList.add(cls);
    svg.appendChild(ln);
  }
  return ln;
}

/* ========= 1→1 parent→child ========= */
function drawEdge(e){
  const a=cardRect(e.from), b=cardRect(e.to); if(!a||!b) return;
  const l=ensureLine(`edge-${e.from}-${e.to}`, 'edge');
  l.setAttribute('x1', a.cx); l.setAttribute('y1', a.cy);
  l.setAttribute('x2', b.cx); l.setAttribute('y2', b.cy);
}

/* ========= 2→1 parents→children bus ========= */
function parentsKey(a,b){ const [x,y]=[a,b].sort(); return `${x}|${y}`; }
function groupTriEdges(){
  const m=new Map();
  for(const t of state.triEdges){
    const key=parentsKey(t.parents[0],t.parents[1]);
    if(!m.has(key)) m.set(key, { parents:[...t.parents].sort(), children:new Set() });
    m.get(key).children.add(t.child);
  }
  for(const g of m.values()) g.children=[...g.children];
  return m;
}
function ensureBusElems(key){
  const stem=ensureLine(`stem-${key}`,'stem');
  const bus =ensureLine(`bus-${key}` ,'bus');
  return {stem,bus};
}
function ensureDropElem(key, childId){
  return ensureLine(`drop-${key}-${childId}`, 'drop');
}
function updateBusGroup(key, group){
  const [p1,p2]=group.parents;
  const R1=cardRect(p1), R2=cardRect(p2);
  if(!R1||!R2) return;

  // Midpoint between parents
  const mid={ x:(R1.cx+R2.cx)/2, y:(R1.cy+R2.cy)/2 };

  // Children (top anchors)
  const childRects=group.children.map(id=>({id, r:cardRect(id)})).filter(o=>o.r);
  if(!childRects.length) return;

  const childXs   = childRects.map(o=>o.r.topx);
  const childTopYs= childRects.map(o=>o.r.topy);

  // Layout constants
  const BUS_GAP=24;    // vertical space between bus and highest child
  const MIN_STEM=24;   // ensure a visible stem from parents' midpoint
  const BUS_PAD=20;    // extend bus beyond extremes so drops are never zero-length

  let busY = Math.min(...childTopYs) - BUS_GAP;
  busY = Math.max(busY, mid.y + MIN_STEM);

  const minX = Math.min(...childXs) - BUS_PAD;
  const maxX = Math.max(...childXs) + BUS_PAD;

  const {stem, bus} = ensureBusElems(key);
  stem.setAttribute('x1', mid.x); stem.setAttribute('y1', mid.y);
  stem.setAttribute('x2', mid.x); stem.setAttribute('y2', busY);

  bus.setAttribute('x1', minX); bus.setAttribute('y1', busY);
  bus.setAttribute('x2', maxX); bus.setAttribute('y2', busY);

  const keep=new Set();
  for(const {id, r} of childRects){
    const d=ensureDropElem(key, id);
    d.setAttribute('x1', r.topx); d.setAttribute('y1', busY);
    d.setAttribute('x2', r.topx); d.setAttribute('y2', r.topy);
    keep.add(d.id);
  }
  // remove stale drops for this key
  [...svg.querySelectorAll(`[id^="drop-${key}-"]`)].forEach(d=>{ if(!keep.has(d.id)) d.remove(); });
}

function updateAllBuses(){
  const groups=groupTriEdges();
  // Clean previous buses/drops to avoid stale elements
  [...svg.querySelectorAll('.stem,.bus,.drop')].forEach(el=>el.remove());
  for(const [key, group] of groups) updateBusGroup(key, group);
}

/* ========= Spouses (many-to-many pairs) ========= */
function partnerKey(a,b){ const [x,y]=[a,b].sort(); return `sp-${x}-${y}`; }
function updateSpouse(a,b){
  const A=cardRect(a), B=cardRect(b); if(!A||!B) return;
  const id=partnerKey(a,b);
  const l=ensureLine(id,'spouse');
  l.setAttribute('x1', A.cx); l.setAttribute('y1', A.cy);
  l.setAttribute('x2', B.cx); l.setAttribute('y2', B.cy);
}
function updateAllSpouses(){
  // Remove existing spouse lines; we’ll recreate from state
  [...svg.querySelectorAll('.spouse')].forEach(el=>el.remove());
  const seen=new Set();
  for(const n of Object.values(state.nodes)){
    for(const p of n.partners||[]){
      const k=partnerKey(n.id,p);
      if(seen.has(k)) continue;
      updateSpouse(n.id,p);
      seen.add(k);
    }
  }
}

/* ========= Update edges ========= */
function updateAllEdges(){
  // Clear all simple edges first (we’ll redraw from state)
  [...svg.querySelectorAll('.edge')].forEach(el=>el.remove());
  state.edges.forEach(drawEdge);
  updateAllBuses();
  updateAllSpouses();
}
function updateEdgesForNode(nodeId){
  // For simplicity & correctness, just redraw all connectors.
  // This is plenty fast for modest graphs and avoids stale artifacts.
  updateAllEdges();
}

/* ========= Rendering cards ========= */
function renderNode(n){
  let el=document.getElementById(n.id);
  if(!el){
    el=document.createElement('div'); el.id=n.id; el.className='person';
    el.innerHTML=`
      <div class="avatar"><img alt="${n.name} photo"></div>
      <div class="details">
        <div class="name"></div>
        <div class="title"></div>
        <div class="actions"><button class="btn" data-edit>Edit</button></div>
      </div>`;
    cardsRoot.appendChild(el);
    attachCardEvents(el);
  }
  el.querySelector('.name').textContent=n.name||'';
  el.querySelector('.title').textContent=n.title||'';
  const img=el.querySelector('img');
  if(n.imgSrc) img.src=n.imgSrc; else img.removeAttribute('src');
  el.style.transform=`translate(${n.x}px, ${n.y}px)`;
}
function renderAll(){
  cardsRoot.innerHTML='';
  Object.values(state.nodes).forEach(renderNode);
  sizeSVG();
  updateAllEdges();
}

/* ========= Dragging ========= */
let dragging=null, start={x:0,y:0}, origin={x:0,y:0};
function getTranslate(el){
  const m=getComputedStyle(el).transform;
  if(m==='none') return {x:0,y:0};
  const parts=m.match(/matrix\(([^)]+)\)/);
  if(!parts) return {x:0,y:0};
  const nums=parts[1].split(',').map(Number);
  return {x:nums[4], y:nums[5]};
}
function onDown(e){
  const el=e.currentTarget;
  if(e.target.closest('.actions')) return; // allow clicking Edit
  dragging=el; el.style.cursor='grabbing';
  origin=getTranslate(el);
  start={x:e.clientX, y:e.clientY};
  e.preventDefault();
}
function onMove(e){
  if(!dragging) return;
  const dx=e.clientX-start.x, dy=e.clientY-start.y;
  dragging.style.transform=`translate(${origin.x+dx}px, ${origin.y+dy}px)`;
  updateEdgesForNode(dragging.id);
}
function onUp(){
  if(!dragging) return;
  dragging.style.cursor='grab';
  const pos=getTranslate(dragging);
  const n=state.nodes[dragging.id];
  n.x=pos.x; n.y=pos.y;
  save();
  dragging=null;
}
function attachCardEvents(el){
  el.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  el.addEventListener('dblclick', ()=>openEditor(el.id));
  el.querySelector('[data-edit]').addEventListener('click', (ev)=>{ ev.stopPropagation(); openEditor(el.id); });
}

/* ========= Editor ========= */
function buildPersonOptions(excludeId, includeNone=true, selected=[]){
  const none = includeNone ? `<option value="">(None)</option>` : '';
  const opts = Object.values(state.nodes)
    .filter(n=>n.id!==excludeId)
    .map(n=>`<option value="${n.id}" ${selected.includes(n.id)?'selected':''}>${n.name||n.id}</option>`)
    .join('');
  return none + opts;
}
function openEditor(id){
  editingId=id;
  const n=state.nodes[id];
  nameIn.value=n.name||'';
  titleIn.value=n.title||'';
  imgUrlIn.value=''; imgFileIn.value='';
  motherSel.innerHTML=buildPersonOptions(id,true,[n.motherId].filter(Boolean));
  fatherSel.innerHTML=buildPersonOptions(id,true,[n.fatherId].filter(Boolean));
  partnersSel.innerHTML=buildPersonOptions(id,false,n.partners||[]);
  editor.setAttribute('open','');
  setTimeout(()=>nameIn.focus(),0);
}
function closeEditor(){ editor.removeAttribute('open'); editingId=null; }
cancelBt.addEventListener('click', closeEditor);
editor.addEventListener('click', e=>{ if(e.target===editor) closeEditor(); });
window.addEventListener('keydown', e=>{ if(e.key==='Escape' && editor.hasAttribute('open')) closeEditor(); });

applyBt.addEventListener('click', ()=>{
  if(!editingId) return;
  const n=state.nodes[editingId];

  // Save text fields
  n.name = nameIn.value || n.name || 'Person';
  n.title = titleIn.value || '';

  // Parents
  const oldMother=n.motherId, oldFather=n.fatherId;
  const newMother=motherSel.value || null;
  const newFather=fatherSel.value || null;
  n.motherId=newMother; n.fatherId=newFather;

  // Remove prior parent links for this child only
  state.edges = state.edges.filter(e => {
    const touchesChild = (e.from===editingId || e.to===editingId);
    const touchesPrevParent = [oldMother,oldFather].filter(Boolean).some(p => e.from===p || e.to===p);
    return !(touchesChild && touchesPrevParent);
  });
  state.triEdges = state.triEdges.filter(t => t.child !== editingId);

  // Add new parent link(s)
  if(newMother && newFather && newMother !== newFather){
    state.triEdges.push({ parents:[newMother,newFather].sort(), child:editingId });
  } else if(newMother || newFather){
    const p = newMother || newFather;
    state.edges.push({ from:p, to:editingId });
  }

  // Partners (bidirectional)
  const selectedPartners=[...partnersSel.options].filter(o=>o.selected).map(o=>o.value);
  // remove stale links
  for(const prev of n.partners){
    if(!selectedPartners.includes(prev)){
      const other=state.nodes[prev];
      if(other) other.partners = (other.partners||[]).filter(x=>x!==editingId);
    }
  }
  // set new & add reverse
  n.partners = selectedPartners.slice();
  for(const pid of selectedPartners){
    const other=state.nodes[pid];
    if(!other) continue;
    if(!other.partners) other.partners=[];
    if(!other.partners.includes(editingId)) other.partners.push(editingId);
  }

  // Image (file has priority)
  const finish=()=>{ save(); renderNode(n); updateAllEdges(); closeEditor(); };
  if(imgFileIn.files && imgFileIn.files[0]){
    const reader=new FileReader();
    reader.onload=()=>{ n.imgSrc = reader.result; finish(); };
    reader.readAsDataURL(imgFileIn.files[0]);
  } else if(imgUrlIn.value.trim()){
    const u=imgUrlIn.value.trim();
    const test=new Image();
    test.onload=()=>{ n.imgSrc=u; finish(); };
    test.onerror=()=>{ alert('Could not load image from URL.'); finish(); };
    test.src=u;
  } else {
    finish();
  }
});

clearBt.addEventListener('click', ()=>{
  if(!editingId) return;
  const n=state.nodes[editingId];
  n.imgSrc='';
  save();
  renderNode(n);
  updateAllEdges();
});

/* ========= Add & Reset ========= */
addBtn.addEventListener('click', ()=>{
  const id=`N${state.nextId++}`;
  const baseX=innerWidth/2 - 180, baseY=innerHeight/2 - 60;
  const jitter=n=>Math.round(n + (Math.random()*120 - 60));
  state.nodes[id]={ id, name:`Person ${id}`, title:'Title goes here', imgSrc:'', x:jitter(baseX), y:jitter(baseY), motherId:null, fatherId:null, partners:[] };
  save();
  renderNode(state.nodes[id]);
  updateAllEdges();
  openEditor(id);
});

resetBtn.addEventListener('click', ()=>{
  if(!confirm('Clear all people and connections?')) return;
  state = defaultState();
  save();
  renderAll();
});

/* ========= Init ========= */
function init(){ sizeSVG(); renderAll(); }
window.addEventListener('resize', ()=>{ sizeSVG(); updateAllEdges(); });
init();
</script>
</body>
</html>
