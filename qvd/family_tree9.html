<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive Family Tree</title>
<style>
  :root { --bg:#0f111a; --panel:#1c1f2b; --accent:#e50914; --text:#e8e8e8; --muted:#bdbdbd; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--text);
         font-family:'Raleway',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }

  .toolbar { position:fixed; top:10px; left:12px; z-index:10; display:flex; gap:8px; align-items:center;
             background:rgba(20,24,38,.85); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:8px;
             backdrop-filter: blur(6px); }
  .btn { background:transparent; border:1px solid var(--accent); color:var(--text); padding:6px 10px; border-radius:10px; cursor:pointer; }
  .btn:hover { background:rgba(229,9,20,.12); }
  .btn.ghost { border-color:rgba(255,255,255,.2); }

  #connector { position:absolute; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:0; }
  .edge,.bus,.stem,.drop,.spouse { stroke:var(--accent); stroke-width:3; fill:none; }
  .spouse { stroke-width:2; opacity:.9; }
  .dotted { stroke-dasharray: 6 6; }

  .person { position:absolute; z-index:1; display:grid; grid-template-columns:1fr 2fr; width:360px; height:120px;
            background:var(--panel); border:2px solid var(--accent); border-radius:14px; overflow:hidden; cursor:grab; user-select:none;
            box-shadow:0 6px 18px rgba(0,0,0,.35), 0 0 0 1px rgba(229,9,20,.25) inset; }
  .avatar { width:100%; height:100%; background:#222; border-radius:0 !important; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; border-radius:0 !important; }
  .details { display:flex; flex-direction:column; justify-content:center; padding:12px 16px; }
  .name { font-weight:700; font-size:1.1rem; }
  .title { font-size:.9rem; color:var(--muted); margin-top:4px; }
  .actions { margin-top:10px; }
  .actions .btn { padding:4px 8px; }

  .modal { position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.55); z-index:20; }
  .modal[open] { display:grid; }
  .dialog { width:min(720px,92vw); background:#141826; border:1px solid rgba(255,255,255,.1); border-radius:16px;
            box-shadow:0 30px 70px rgba(0,0,0,.5); padding:18px; }
  .grid { display:grid; gap:12px; }
  .row { display:grid; gap:8px; }
  label { font-size:.9rem; color:var(--muted); }
  input[type="text"], input[type="url"], select { width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.15);
                                                 background:#0f1320; color:var(--text); }
  select[multiple] { min-height:100px; }
  .dialog .buttons { display:flex; gap:10px; justify-content:flex-end; margin-top:8px; }
  .hint { font-size:.85rem; color:var(--muted); }
</style>
</head>
<body>
  <div class="toolbar">
    <button class="btn" id="addPerson">Add Person</button>
    <button class="btn ghost" id="resetAll">Reset</button>
  </div>

  <svg id="connector" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  <div id="cards-root"></div>

  <div class="modal" id="editor" role="dialog" aria-modal="true">
    <div class="dialog">
      <h2>Edit Person</h2>
      <div class="grid">
        <div class="row"><label>Name</label><input id="name" type="text"></div>
        <div class="row"><label>Title</label><input id="title" type="text"></div>
        <div class="row"><label>Image URL</label><input id="imgUrl" type="url" placeholder="https://example.com/pic.jpg"></div>
        <div class="row"><label>Upload image</label><input id="imgFile" type="file" accept="image/*"></div>
        <div class="row" style="grid-template-columns:1fr 1fr; gap:10px;">
          <div><label>Mother</label><select id="motherSel"></select></div>
          <div><label>Father</label><select id="fatherSel"></select></div>
        </div>
        <div class="row">
          <label><input type="checkbox" id="illegitChk"> Illegitimate (single-parent dotted link)</label>
          <div class="hint">Only applies when exactly one parent is selected.</div>
        </div>
        <div class="row">
          <label>Partners / Spouses (multi-select)</label>
          <select id="partnersSel" multiple></select>
        </div>
        <div class="buttons">
          <button class="btn ghost" id="clearImg">Clear Photo</button>
          <button class="btn" id="cancel">Cancel</button>
          <button class="btn" id="apply">Apply</button>
        </div>
      </div>
    </div>
  </div>

<script>
/* ========= Persistence ========= */
var STORE_KEY='familytree_v6_compat';
function defaultState(){
  return {
    nodes:{
      A1:{id:'A1',name:'Person A',title:'Title goes here',imgSrc:'',x:200,y:200,motherId:null,fatherId:null,partners:[],illegitimate:false},
      B2:{id:'B2',name:'Person B',title:'Title goes here',imgSrc:'',x:600,y:200,motherId:null,fatherId:null,partners:[],illegitimate:false}
    },
    edges:[],          // [{from,to,dotted}]
    triEdges:[],       // [{parents:[id1,id2], child}]
    nextId:3
  };
}
function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    var s = raw ? JSON.parse(raw) : defaultState();
    // sanitize
    var ids = Object.keys(s.nodes||{});
    for(var i=0;i<ids.length;i++){
      var n=s.nodes[ids[i]];
      if(n.motherId===undefined) n.motherId=null;
      if(n.fatherId===undefined) n.fatherId=null;
      if(!Array.isArray(n.partners)) n.partners=[];
      if(typeof n.illegitimate!=='boolean') n.illegitimate=false;
      if(typeof n.x!=='number') n.x=100;
      if(typeof n.y!=='number') n.y=100;
    }
    if(!Array.isArray(s.edges)) s.edges=[];
    s.edges = s.edges.map(function(e){
      return {from:e.from, to:e.to, dotted: !!(e && e.dotted)};
    });
    if(!Array.isArray(s.triEdges)) s.triEdges=[];
    if(typeof s.nextId!=='number') s.nextId=3;
    return s;
  }catch(e){
    console.error('load failed', e);
    return defaultState();
  }
}
var state = load();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ console.warn('save failed',e); }}

/* ========= Elements ========= */
var svg=document.getElementById('connector');
var cards=document.getElementById('cards-root');
var editor=document.getElementById('editor');
var nameIn=document.getElementById('name'), titleIn=document.getElementById('title');
var imgUrl=document.getElementById('imgUrl'), imgFile=document.getElementById('imgFile');
var motherSel=document.getElementById('motherSel'), fatherSel=document.getElementById('fatherSel');
var partnersSel=document.getElementById('partnersSel');
var illegitChk=document.getElementById('illegitChk');
var applyBt=document.getElementById('apply'), cancelBt=document.getElementById('cancel'), clearBt=document.getElementById('clearImg');
var addBt=document.getElementById('addPerson'), resetBt=document.getElementById('resetAll');
var editingId=null;

/* ========= Geometry helpers ========= */
function sizeSVG(){ svg.setAttribute('viewBox','0 0 '+innerWidth+' '+innerHeight); }
function cardRect(id){
  var el=document.getElementById(id); if(!el) return null;
  var r=el.getBoundingClientRect();
  return { el:el, cx:r.left+r.width/2, cy:r.top+r.height/2, topx:r.left+r.width/2, topy:r.top, bottomy:r.bottom };
}

/* ========= SVG helpers ========= */
function ensureLine(id,cls){
  var l=document.getElementById(id);
  if(!l){ l=document.createElementNS('http://www.w3.org/2000/svg','line'); l.id=id; l.setAttribute('vector-effect','non-scaling-stroke'); l.classList.add(cls); svg.appendChild(l); }
  return l;
}
function removeById(id){ var el=document.getElementById(id); if(el) el.remove(); }

/* ========= 1→1 parent→child ========= */
function drawEdge(e){
  var a=cardRect(e.from), b=cardRect(e.to); if(!a||!b) return;
  var id='edge-'+e.from+'-'+e.to;
  var l=ensureLine(id,'edge');
  if(e.dotted) l.classList.add('dotted'); else l.classList.remove('dotted');
  l.setAttribute('x1',a.cx); l.setAttribute('y1',a.cy);
  l.setAttribute('x2',b.cx); l.setAttribute('y2',b.cy);
}
function addSingleParentEdge(parentId, childId, dotted){
  if(!parentId) return;
  var from = parentId < childId ? parentId : childId;
  var to   = parentId < childId ? childId : parentId;
  state.edges = state.edges.filter(function(e){ return !(e.from===from && e.to===to); });
  state.edges.push({from:from, to:to, dotted: !!dotted});
}

/* ========= 2→1 parents→children bus ========= */
function parentsKey(a,b){ var s=[a,b].sort(); return s[0]+'|'+s[1]; }
function groupTriEdges(){
  var m = {};
  for(var i=0;i<state.triEdges.length;i++){
    var t=state.triEdges[i], key=parentsKey(t.parents[0],t.parents[1]);
    if(!m[key]) m[key]={parents:[].concat(t.parents).sort(), children:{}};
    m[key].children[t.child]=true;
  }
  // convert child maps to arrays
  var out=new Map();
  Object.keys(m).forEach(function(k){
    out.set(k,{parents:m[k].parents, children:Object.keys(m[k].children)});
  });
  return out;
}
function ensureBusElems(k){ return { stem:ensureLine('stem-'+k,'stem'), bus:ensureLine('bus-'+k,'bus') }; }
function ensureDropElem(k,cid){ return ensureLine('drop-'+k+'-'+cid,'drop'); }

/* Main bus/connector function */
function updateBusGroup(key, group) {
  var p1=group.parents[0], p2=group.parents[1];
  var R1=cardRect(p1), R2=cardRect(p2); if(!R1||!R2) return;
  var mid={ x:(R1.cx+R2.cx)/2, y:(R1.cy+R2.cy)/2 };

  var childRects=[];
  for(var i=0;i<group.children.length;i++){
    var id=group.children[i], cr=cardRect(id);
    if(cr) childRects.push({id:id, r:cr});
  }
  if(childRects.length===0) return;

  // SINGLE CHILD → one line midpoint → nearest edge
  if(childRects.length===1){
    var r = childRects[0].r;
    var anchorY = (r.topy >= mid.y) ? r.topy : r.bottomy;
    var stem=ensureLine('stem-'+key,'stem');
    stem.classList.remove('dotted');
    stem.setAttribute('x1',mid.x); stem.setAttribute('y1',mid.y);
    stem.setAttribute('x2',r.topx); stem.setAttribute('y2',anchorY);
    removeById('bus-'+key);
    var drops = svg.querySelectorAll('[id^="drop-'+key+'-"]');
    for(i=0;i<drops.length;i++) drops[i].remove();
    return;
  }

  // MULTIPLE CHILDREN → bus
  var childXs=[], childTopYs=[], childBotYs=[];
  for(i=0;i<childRects.length;i++){
    childXs.push(childRects[i].r.topx);
    childTopYs.push(childRects[i].r.topy);
    childBotYs.push(childRects[i].r.bottomy);
  }
  var GAP_ABOVE=24, GAP_BELOW=24, MIN_STEM=24;
  var minTopY=Math.min.apply(Math,childTopYs);
  var maxBotY=Math.max.apply(Math,childBotYs);
  var allBelow = minTopY > mid.y;
  var allAbove = maxBotY < mid.y;

  var busY;
  if(allBelow){ busY = minTopY - GAP_ABOVE; if(busY < mid.y + MIN_STEM) busY = mid.y + MIN_STEM; }
  else if(allAbove){ busY = maxBotY + GAP_BELOW; if(busY > mid.y - MIN_STEM) busY = mid.y - MIN_STEM; }
  else { busY = mid.y + MIN_STEM; }

  var minX=Math.min.apply(Math,childXs), maxX=Math.max.apply(Math,childXs);
  var elems=ensureBusElems(key), stem=elems.stem, bus=elems.bus;
  stem.setAttribute('x1',mid.x); stem.setAttribute('y1',mid.y);
  stem.setAttribute('x2',mid.x); stem.setAttribute('y2',busY);
  bus.setAttribute('x1',minX); bus.setAttribute('y1',busY);
  bus.setAttribute('x2',maxX); bus.setAttribute('y2',busY);

  var busAbove = busY <= minTopY;
  var busBelow = busY >= maxBotY;

  var keep = {};
  for(i=0;i<childRects.length;i++){
    var c=childRects[i], r2=c.r;
    var drop=ensureDropElem(key,c.id);
    var anchorY2 = busAbove ? r2.topy : (busBelow ? r2.bottomy : (Math.abs(busY-r2.topy)<=Math.abs(busY-r2.bottomy)?r2.topy:r2.bottomy));
    drop.setAttribute('x1',r2.topx); drop.setAttribute('y1',busY);
    drop.setAttribute('x2',r2.topx); drop.setAttribute('y2',anchorY2);
    keep[drop.id]=true;
  }
  var allDrops = svg.querySelectorAll('[id^="drop-'+key+'-"]');
  for(i=0;i<allDrops.length;i++){ if(!keep[allDrops[i].id]) allDrops[i].remove(); }
}

function updateAllBuses(){
  var old = svg.querySelectorAll('.stem,.bus,.drop');
  for(var i=0;i<old.length;i++) old[i].remove();
  var groups=groupTriEdges();
  groups.forEach(function(v,k){ updateBusGroup(k,v); });
}

/* ========= Spouses ========= */
function partnerKey(a,b){ var s=[a,b].sort(); return 'sp-'+s[0]+'-'+s[1]; }
function updateSpouse(a,b){
  var A=cardRect(a), B=cardRect(b); if(!A||!B) return;
  var id=partnerKey(a,b); var l=ensureLine(id,'spouse');
  l.setAttribute('x1',A.cx); l.setAttribute('y1',A.cy);
  l.setAttribute('x2',B.cx); l.setAttribute('y2',B.cy);
}
function updateAllSpouses(){
  var old=svg.querySelectorAll('.spouse'); for(var i=0;i<old.length;i++) old[i].remove();
  var seen={};
  var nodes = Object.values ? Object.values(state.nodes) : Object.keys(state.nodes).map(function(k){return state.nodes[k];});
  for(i=0;i<nodes.length;i++){
    var n=nodes[i], ps=n.partners||[];
    for(var j=0;j<ps.length;j++){
      var p=ps[j], key=partnerKey(n.id,p);
      if(seen[key]) continue; seen[key]=true;
      updateSpouse(n.id,p);
    }
  }
}

/* ========= Update edges ========= */
function updateAllEdges(){
  var old=svg.querySelectorAll('.edge'); for(var i=0;i<old.length;i++) old[i].remove();
  for(i=0;i<state.edges.length;i++) drawEdge(state.edges[i]);
  updateAllBuses();
  updateAllSpouses();
}
function updateEdgesForNode(){ updateAllEdges(); }

/* ========= Render ========= */
function renderNode(n){
  var el=document.getElementById(n.id);
  if(!el){
    el=document.createElement('div'); el.id=n.id; el.className='person';
    el.innerHTML='<div class="avatar"><img alt="'+(n.name||'photo')+'"></div>\
      <div class="details">\
        <div class="name"></div>\
        <div class="title"></div>\
        <div class="actions"><button class="btn" data-edit>Edit</button></div>\
      </div>';
    cards.appendChild(el);
    attachCardEvents(el);
  }
  el.querySelector('.name').textContent=n.name||'';
  el.querySelector('.title').textContent=n.title||'';
  var img=el.querySelector('img'); if(n.imgSrc) img.src=n.imgSrc; else img.removeAttribute('src');
  el.style.transform='translate('+n.x+'px,'+n.y+'px)';
}
function renderAll(){
  cards.innerHTML='';
  var nodes = Object.values ? Object.values(state.nodes) : Object.keys(state.nodes).map(function(k){return state.nodes[k];});
  for(var i=0;i<nodes.length;i++) renderNode(nodes[i]);
  sizeSVG();
  updateAllEdges();
}

/* ========= Dragging ========= */
var dragging=null, start={x:0,y:0}, origin={x:0,y:0};
function getTranslate(el){
  var m=getComputedStyle(el).transform;
  if(m==='none') return {x:0,y:0};
  var parts=m.match(/matrix\(([^)]+)\)/);
  if(!parts) return {x:0,y:0};
  var nums=parts[1].split(',').map(Number);
  return {x:nums[4], y:nums[5]};
}
function onDown(e){
  var el=e.currentTarget;
  if(e.target.closest && e.target.closest('.actions')) return;
  dragging=el; el.style.cursor='grabbing';
  origin=getTranslate(el);
  start={x:e.clientX, y:e.clientY};
  e.preventDefault();
}
function onMove(e){
  if(!dragging) return;
  var dx=e.clientX-start.x, dy=e.clientY-start.y;
  dragging.style.transform='translate('+(origin.x+dx)+'px,'+(origin.y+dy)+'px)';
  updateEdgesForNode(dragging.id);
}
function onUp(){
  if(!dragging) return;
  dragging.style.cursor='grab';
  var pos=getTranslate(dragging);
  var n=state.nodes[dragging.id];
  n.x=pos.x; n.y=pos.y;
  save();
  dragging=null;
}
function attachCardEvents(el){
  el.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  el.addEventListener('dblclick', function(){ openEditor(el.id); });
  el.querySelector('[data-edit]').addEventListener('click', function(ev){ ev.stopPropagation(); openEditor(el.id); });
}

/* ========= Editor ========= */
function optionsHTML(excludeId, includeNone, selected){
  includeNone = includeNone!==false;
  selected = selected||[];
  var none = includeNone ? '<option value="">(None)</option>' : '';
  var opts = '';
  var ids = Object.keys(state.nodes);
  for(var i=0;i<ids.length;i++){
    var n=state.nodes[ids[i]]; if(n.id===excludeId) continue;
    var sel = selected.indexOf(n.id)>=0 ? ' selected' : '';
    opts += '<option value="'+n.id+'"'+sel+'>'+ (n.name||n.id) +'</option>';
  }
  return none + opts;
}
function partnersHTML(excludeId, selected){
  selected = selected||[];
  var opts=''; var ids=Object.keys(state.nodes);
  for(var i=0;i<ids.length;i++){
    var n=state.nodes[ids[i]]; if(n.id===excludeId) continue;
    var sel = selected.indexOf(n.id)>=0 ? ' selected' : '';
    opts += '<option value="'+n.id+'"'+sel+'>'+ (n.name||n.id) +'</option>';
  }
  return opts;
}
function syncIllegitToggle(){
  var oneParent = (!!motherSel.value) !== (!!fatherSel.value);
  illegitChk.disabled = !oneParent;
  if (!oneParent) illegitChk.checked = false;
}
function openEditor(id){
  editingId=id;
  var n=state.nodes[id];
  nameIn.value=n.name||''; titleIn.value=n.title||'';
  imgUrl.value=''; imgFile.value='';
  motherSel.innerHTML = optionsHTML(id, true, n.motherId ? [n.motherId] : []);
  fatherSel.innerHTML = optionsHTML(id, true, n.fatherId ? [n.fatherId] : []);
  partnersSel.innerHTML = partnersHTML(id, n.partners);
  illegitChk.checked = !!n.illegitimate;
  syncIllegitToggle();
  editor.setAttribute('open','');
  setTimeout(function(){ nameIn.focus(); }, 0);
}
function closeEditor(){ editor.removeAttribute('open'); editingId=null; }
cancelBt.addEventListener('click', closeEditor);
editor.addEventListener('click', function(e){ if(e.target===editor) closeEditor(); });
window.addEventListener('keydown', function(e){ if(e.key==='Escape' && editor.hasAttribute('open')) closeEditor(); });
motherSel.addEventListener('change', syncIllegitToggle);
fatherSel.addEventListener('change', syncIllegitToggle);

applyBt.addEventListener('click', function(){
  if(!editingId) return;
  var n=state.nodes[editingId];
  n.name = nameIn.value || n.name || 'Person';
  n.title = titleIn.value || '';

  var oldMother=n.motherId, oldFather=n.fatherId;
  var newMother=motherSel.value || null;
  var newFather=fatherSel.value || null;
  n.motherId=newMother; n.fatherId=newFather;

  n.illegitimate = !!illegitChk.checked && ((!!newMother)!==(!!newFather));

  // Remove previous parent links for this child
  state.edges = state.edges.filter(function(e){
    var touchesChild = (e.from===editingId || e.to===editingId);
    var prevParents = [oldMother,oldFather].filter(function(p){return !!p;});
    var touchesPrevParent = prevParents.some(function(p){ return e.from===p || e.to===p; });
    return !(touchesChild && touchesPrevParent);
  });
  state.triEdges = state.triEdges.filter(function(t){ return t.child !== editingId; });

  // Add new links
  if(newMother && newFather && newMother!==newFather){
    state.triEdges.push({ parents:[newMother,newFather].sort(), child:editingId });
  } else if(newMother || newFather){
    var p=newMother || newFather;
    addSingleParentEdge(p, editingId, n.illegitimate);
  }

  // Partners (bidirectional)
  var selected=[]; for(var i=0;i<partnersSel.options.length;i++){ if(partnersSel.options[i].selected) selected.push(partnersSel.options[i].value); }
  var prev=(n.partners||[]).slice();
  // remove stale reverse links
  for(i=0;i<prev.length;i++){
    if(selected.indexOf(prev[i])<0){
      var other=state.nodes[prev[i]];
      if(other){ other.partners=(other.partners||[]).filter(function(x){return x!==editingId;}); }
    }
  }
  n.partners = selected.slice();
  // add reverse links
  for(i=0;i<selected.length;i++){
    var pid=selected[i], otherN=state.nodes[pid];
    if(otherN){
      if(!Array.isArray(otherN.partners)) otherN.partners=[];
      if(otherN.partners.indexOf(editingId)<0) otherN.partners.push(editingId);
    }
  }

  // Image
  function finish(){ save(); renderNode(n); updateAllEdges(); closeEditor(); }
  if(imgFile.files && imgFile.files[0]){
    var r=new FileReader();
    r.onload=function(){ n.imgSrc=r.result; finish(); };
    r.readAsDataURL(imgFile.files[0]);
  } else if((imgUrl.value||'').trim()){
    var u=imgUrl.value.trim(), test=new Image();
    test.onload=function(){ n.imgSrc=u; finish(); };
    test.onerror=function(){ alert('Could not load image from URL.'); finish(); };
    test.src=u;
  } else { finish(); }
});

clearBt.addEventListener('click', function(){
  if(!editingId) return;
  var n=state.nodes[editingId];
  n.imgSrc=''; save(); renderNode(n); updateAllEdges();
});

/* ========= Add & Reset ========= */
addBt.addEventListener('click', function(){
  var id='N'+(state.nextId++);
  var baseX=innerWidth/2 - 180, baseY=innerHeight/2 - 60;
  function jitter(n){ return Math.round(n + (Math.random()*120 - 60)); }
  state.nodes[id]={ id:id, name:'Person '+id, title:'Title goes here', imgSrc:'', x:jitter(baseX), y:jitter(baseY), motherId:null, fatherId:null, partners:[], illegitimate:false };
  save(); renderNode(state.nodes[id]); updateAllEdges(); openEditor(id);
});
resetBt.addEventListener('click', function(){
  if(!confirm('Clear all people and connections?')) return;
  state=defaultState(); save(); renderAll();
});

/* ========= Init ========= */
function init(){ sizeSVG(); renderAll(); }
window.addEventListener('resize', function(){ sizeSVG(); updateAllEdges(); });
init();
</script>
</body>
</html>
