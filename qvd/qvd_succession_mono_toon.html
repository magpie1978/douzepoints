<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <!-- IBM Plex Mono -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --paper-bg:   #FDF2C7;  /* pale yellow text tone */
      --ink-bg:     #0C1834;  /* dark navy background */
      --ink-mid:    #1B2748;  /* slightly lighter navy */
      --muted:      #D8CFA0;  /* secondary yellow-gray */
      --accent:     #EADFAF;  /* highlight yellow */
      --border:     #B5A86C;  /* soft border yellow */
      --header-h:   130px;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--ink-bg);
      color: var(--paper-bg);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.02em;
    }

    /* ---- Header ---- */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 24px 40px 16px;
      background: var(--ink-mid);
      color: var(--paper-bg);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 300;
      height: var(--header-h);
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      max-width: 70%;
    }

    .header-title {
      margin: 0;
      font-size: 1.9rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--paper-bg);
    }

    .header-desc {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .header-buttons {
      display: flex;
      gap: 12px;
    }

    .header-btn {
      background: transparent;
      color: var(--paper-bg);
      border: 1px solid var(--border);
      padding: 7px 16px;
      border-radius: 999px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      transition: background 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
    }

    .header-btn:hover {
      background: var(--border);
      color: var(--ink-bg);
      box-shadow: 0 0 6px var(--border);
    }

    /* ---- Layout ---- */
    .main-content {
      flex: 1;
      max-width: 1100px;
      margin: calc(var(--header-h) + 40px) auto 60px;
      padding: 0 24px;
      color: var(--paper-bg);
    }

    .main-heading-row {
      margin-bottom: 20px;
    }

    .main-heading {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--paper-bg);
      text-transform: uppercase;
    }

    .main-subheading {
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* ---- Toggle ---- */
    .toggle-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 30px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 56px;
      height: 28px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--muted);
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: var(--ink-bg);
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--border);
    }
    input:checked + .slider:before { transform: translateX(28px); }

    .toggle-label {
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* ---- Table ---- */
    .table-wrapper {
      background: var(--ink-mid);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: auto;
      box-shadow: 0 8px 18px rgba(0,0,0,0.4);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 880px;
      font-size: 0.9rem;
      color: var(--paper-bg);
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--ink-bg);
      color: var(--accent);
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }

    tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      vertical-align: middle;
      color: var(--paper-bg);
    }

    tbody tr:nth-child(even) td { background: #142043; }
    tbody tr:nth-child(odd) td { background: #101A3A; }

    tbody tr:hover td {
      background: #22305F;
      cursor: pointer;
    }

    .name {
      font-weight: 600;
      color: var(--accent);
    }

    .titles-stack,
    .relationship-text,
    .muted {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .exclusion-text {
      color: var(--border);
      font-style: italic;
    }

    /* ---- Pager ---- */
    .pager-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .pager-btn {
      background: var(--ink-bg);
      color: var(--paper-bg);
      border: 1px solid var(--border);
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 500;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .pager-btn:hover {
      background: var(--border);
      color: var(--ink-bg);
    }
  </style>
</head>
