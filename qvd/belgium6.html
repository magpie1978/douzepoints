<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Belgian Royal Family — Family Tree</title>
<style>
  :root{
    --bg:#0f111a; --card:#1a1d29; --text:#e6e6e6; --muted:#9aa0a6;
    --accent:#e50914; --line:#6b7280; --radius:16px;
    --marriage:#d1d5db; /* marriage line */
    --child:#9ca3af;    /* child line */
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .page{max-width:1280px;margin:24px auto;padding:0 16px 64px;position:relative}
  h1{margin:0 0 8px}
  .subtitle{color:var(--muted);margin-bottom:24px}
  .divider{height:1px;background:var(--accent);opacity:.6;margin:12px 0 24px}

  /* Tree + SVG connectors */
  .tree{position:relative}
  .connections{position:absolute;inset:0;pointer-events:none;z-index:0}

  /* One generation per row — enforced */
  .generation-row{
    width:100%;
    position:relative;
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    justify-content:center;
    margin:36px 0;
    padding-block:8px 40px; /* space for connectors */
    z-index:1;
  }

  /* Person card: left thumb + right text */
  .person{
    display:flex;align-items:center;width:280px;background:var(--card);border-radius:var(--radius);
    border:1px solid rgba(255,255,255,.06);box-shadow:0 6px 20px rgba(0,0,0,.25);
    overflow:hidden;transition:transform .12s ease, box-shadow .12s ease
  }
  .person:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.35)}
  .thumb{width:88px;height:110px;object-fit:cover;background:#22252f;flex-shrink:0}
  .placeholder{width:88px;height:110px;display:grid;place-items:center;background:#22252f;color:#6b7280;font-size:11px}
  .person-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
  .name{margin:0;font-weight:700;font-size:15px;line-height:1.2}
  .lifespan{margin:0;color:var(--muted);font-size:12px}
  .title{margin:0;color:#c9d1d9;font-size:12px}

  /* Tooltip / modal */
  dialog.bio {
    width:min(560px,92vw); border:1px solid rgba(255,255,255,.08); border-radius:16px;
    background:#121522; color:var(--text); padding:0; box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .bio header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
  .bio header img{width:56px;height:70px;object-fit:cover;border-radius:10px;background:#22252f}
  .bio header .h{display:flex;flex-direction:column}
  .bio header .h .n{font-weight:800}
  .bio .content{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .badges{display:flex;flex-wrap:wrap;gap:8px}
  .badge{font-size:12px;color:var(--muted);border:1px solid rgba(255,255,255,.12);padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.04)}
  .credit{font-size:12px;color:var(--muted)}
  .bio footer{display:flex;justify-content:flex-end;padding:12px 16px;border-top:1px solid rgba(255,255,255,.06)}
  .btn{background:#222742;border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
  .btn:hover{background:#2a2f4d}

  @media (max-width:560px){
    .person{width:92vw;max-width:360px}
    .thumb,.placeholder{width:76px;height:96px}
  }
</style>
</head>
<body>
<div class="page">
  <h1>Belgian Royal Family — Family Tree</h1>
  <div class="subtitle">Each generation is in its own row. Married couples are linked; children connect from the couple’s midpoint.</div>
  <div class="divider"></div>

  <div id="tree" class="tree">
    <svg id="connections" class="connections" preserveAspectRatio="none"></svg>
    <div id="rows"></div>
  </div>

  <!-- Reusable bio dialog -->
  <dialog id="bioDialog" class="bio">
    <header>
      <img id="bioThumb" alt="">
      <div class="h">
        <div class="n" id="bioName"></div>
        <div class="t" id="bioTitle" style="font-size:13px;color:#c9d1d9"></div>
        <div class="l" id="bioLife" style="font-size:12px;color:#9aa0a6"></div>
      </div>
    </header>
    <div class="content">
      <div id="bioText"></div>
      <div class="badges" id="bioBadges"></div>
      <div class="credit" id="bioCredit"></div>
    </div>
    <footer>
      <button class="btn" id="bioClose">Close</button>
    </footer>
  </dialog>
</div>

<script>
/* ------- Wikimedia URL helpers ------- */
const filePathThumb = (fileName, width=160) =>
  fileName ? `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(fileName)}?width=${width}` : null;
const filePageUrl = (fileName) =>
  fileName ? `https://commons.wikimedia.org/wiki/File:${encodeURIComponent(fileName)}` : null;

/* ------- Dates & display helpers ------- */
function y(d){return d ? new Date(d).getFullYear() : null}
function life(b,d){const B=y(b),D=y(d); return B&&D?`${B}–${D}`:B&&!D?`b. ${B}`:""}
function placeholder(){ const ph=document.createElement("div"); ph.className="placeholder"; ph.textContent="No image"; return ph; }

/* ------- DATA (DB-ready) ------- */
const PEOPLE = [
  /* Gen 0 */
  { id:"albert_ii", name:"Albert II", title:"King of the Belgians (r. 1993–2013)", birth:"1934-06-06", generation:0, parents:[],
    bio:"Sixth King of the Belgians; abdicated in 2013 in favor of his son Philippe.",
    photoCommons:"King_Albert_II_of_Belgium.jpg", photoCredit:"Eric Draper / White House", photoLicense:"Public Domain (US Gov)" },
  { id:"paola", name:"Paola", title:"Queen of the Belgians (consort of Albert II)", birth:"1937-09-11", generation:0, parents:[],
    bio:"Born Donna Paola Ruffo di Calabria; queen consort 1993–2013.",
    photoCommons:null, photoCredit:"Wikimedia Commons", photoLicense:"See file page" },

  /* Gen 1 */
  { id:"philippe", name:"Philippe", title:"King of the Belgians", birth:"1960-04-15", generation:1, parents:["albert_ii","paola"],
    bio:"Seventh King of the Belgians since 2013; married to Mathilde.",
    photoCommons:"King_Philippe_-_February_2017.jpg", photoCredit:"UK Government / FCDO", photoLicense:"CC BY 2.0" },
  { id:"astrid", name:"Astrid", title:"Princess of Belgium, Archduchess of Austria-Este", birth:"1962-06-05", generation:1, parents:["albert_ii","paola"],
    bio:"Sister of King Philippe; married to Prince Lorenz; active in economic missions.",
    photoCommons:null, photoCredit:"Wikimedia Commons", photoLicense:"See file page" },
  { id:"laurent", name:"Laurent", title:"Prince of Belgium", birth:"1963-10-19", generation:1, parents:["albert_ii","paola"],
    bio:"Brother of King Philippe; married to Princess Claire.",
    photoCommons:null, photoCredit:"Wikimedia Commons", photoLicense:"See file page" },
  { id:"delphine", name:"Delphine", title:"Princess of Belgium", birth:"1968-02-22", generation:1, parents:["albert_ii"],
    bio:"Artist; legally recognised in 2020 as Princess of Belgium (not in succession).",
    photoCommons:null, photoCredit:"Wikimedia Commons", photoLicense:"See file page" },

  /* Gen 2 (spouses) */
  { id:"mathilde", name:"Mathilde", title:"Queen of the Belgians", birth:"1973-01-20", generation:2, parents:[],
    bio:"First Belgian-born queen; focuses on mental health and social issues.",
    photoCommons:"2019_Queen_Mathilde_01.jpg", photoCredit:"Paul Sableman", photoLicense:"CC BY-SA 2.0" },
  { id:"lorenz", name:"Lorenz", title:"Prince of Belgium, Archduke of Austria-Este", birth:"1955-12-16", generation:2, parents:[],
    bio:"Husband of Princess Astrid; head of the Austria-Este branch.",
    photoCommons:null, photoCredit:"Wikimedia Commons", photoLicense:"See file page" },
  { id:"claire", name:"Claire", title:"Princess of Belgium", birth:"1974-01-18", generation:2, parents:[],
    bio:"Wife of Prince Laurent; born Claire Coombs.",
    photoCommons:null, photoCredit:"Wikimedia Commons", photoLicense:"See file page" },

  /* Gen 3 — Philippe & Mathilde children */
  { id:"elisabeth", name:"Elisabeth", title:"Princess of Belgium, Duchess of Brabant", birth:"2001-10-25", generation:3, parents:["philippe","mathilde"],
    bio:"Heir apparent; active in public duties; military training.",
    photoCommons:"2023_Princess_Elisabeth,_Duchess_of_Brabant_(cropped)01.JPG", photoCredit:"Ian Jones (FCDO)", photoLicense:"CC BY 2.0" },
  { id:"gabriel", name:"Gabriel", title:"Prince of Belgium", birth:"2003-08-20", generation:3, parents:["philippe","mathilde"],
    bio:"Second child of King Philippe and Queen Mathilde.",
    photoCommons:"Prince_Gabriel_of_Belgium_in_2018.jpg", photoCredit:"Sophie Margue", photoLicense:"CC BY-SA 4.0" },
  { id:"emmanuel", name:"Emmanuel", title:"Prince of Belgium", birth:"2005-10-04", generation:3, parents:["philippe","mathilde"],
    bio:"Third child of King Philippe and Queen Mathilde.",
    photoCommons:"Emmanuel_de_Belgique_en_2016.jpg", photoCredit:"Keckel (crop)", photoLicense:"See file page" },
  { id:"eleonore", name:"Eléonore", title:"Princess of Belgium", birth:"2008-04-16", generation:3, parents:["philippe","mathilde"],
    bio:"Youngest child of King Philippe and Queen Mathilde.",
    photoCommons:null, photoCredit:"Wikimedia Commons", photoLicense:"See file page" },

  /* Gen 3 — Astrid & Lorenz children */
  { id:"amedeo", name:"Amedeo", title:"Prince of Belgium, Archduke of Austria-Este", birth:"1986-02-21", generation:3, parents:["astrid","lorenz"],
    bio:"Eldest child of Princess Astrid; married Elisabetta Rosboch von Wolkenstein.",
    photoCommons:null, photoCredit:"Wikimedia Commons", photoLicense:"See file page" },
  { id:"maria_laura", name:"Maria Laura", title:"Princess of Belgium, Archduchess of Austria-Este", birth:"1988-08-26", generation:3, parents:["astrid","lorenz"],
    bio:"Married William Isvy (2022).",
    photoCommons:null, photoCredit:"Wikimedia Commons", photoLicense:"See file page" },
  { id:"joachim", name:"Joachim", title:"Prince of Belgium, Archduke of Austria-Este", birth:"1991-12-09", generation:3, parents:["astrid","lorenz"],
    bio:"Third child of Princess Astrid and Prince Lorenz.",
    photoCommons:null, photoCredit:"Wikimedia Commons", photoLicense:"See file page" },
  { id:"luisa_maria", name:"Luisa Maria", title:"Princess of Belgium, Archduchess of Austria-Este", birth:"1995-10-11", generation:3, parents:["astrid","lorenz"],
    bio:"Fourth child of Princess Astrid.",
    photoCommons:null, photoCredit:"Wikimedia Commons", photoLicense:"See file page" },
  { id:"laetitia_maria", name:"Laetitia Maria", title:"Princess of Belgium, Archduchess of Austria-Este", birth:"2003-11-23", generation:3, parents:["astrid","lorenz"],
    bio:"Youngest of Princess Astrid’s five children.",
    photoCommons:null, photoCredit:"Wikimedia Commons", photoLicense:"See file page" },

  /* Gen 3 — Laurent & Claire children */
  { id:"louise", name:"Louise", title:"Princess of Belgium", birth:"2004-02-06", generation:3, parents:["laurent","claire"],
    bio:"Daughter of Prince Laurent and Princess Claire.",
    photoCommons:null, photoCredit:"Wikimedia Commons", photoLicense:"See file page" },
  { id:"nicolas", name:"Nicolas", title:"Prince of Belgium", birth:"2005-12-13", generation:3, parents:["laurent","claire"],
    bio:"Twin son of Prince Laurent and Princess Claire.",
    photoCommons:null, photoCredit:"Wikimedia Commons", photoLicense:"See file page" },
  { id:"aymeric", name:"Aymeric", title:"Prince of Belgium", birth:"2005-12-13", generation:3, parents:["laurent","claire"],
    bio:"Twin son of Prince Laurent and Princess Claire.",
    photoCommons:null, photoCredit:"Wikimedia Commons", photoLicense:"See file page" }
];

/* NEW: declare marriages (partners are person IDs) */
const MARRIAGES = [
  { id:"m_albert_paola", partners:["albert_ii","paola"] },
  { id:"m_philippe_mathilde", partners:["philippe","mathilde"] },
  { id:"m_astrid_lorenz", partners:["astrid","lorenz"] },
  { id:"m_laurent_claire", partners:["laurent","claire"] }
];

/* Infer generations if omitted (keeps strict grouping) */
function inferGenerations(list){
  const gen=new Map();
  list.filter(p=>(p.parents||[]).length===0).forEach(p=>gen.set(p.id,0));
  let changed=true;
  while(changed){
    changed=false;
    list.forEach(c=>{
      if(gen.has(c.id)) return;
      const ps=(c.parents||[]).map(pid=>gen.get(pid)).filter(Number.isInteger);
      if(ps.length>0 && ps.length===(c.parents||[]).length){ gen.set(c.id, Math.max(...ps)+1); changed=true; }
    });
  }
  list.forEach(p=>{ if(p.generation==null) p.generation=gen.get(p.id)??0; });
  return list;
}

/* Render: strictly groups by generation into separate row elements */
function renderTree(people){
  const rowsEl=document.getElementById("rows"); rowsEl.innerHTML="";
  const groups=new Map();
  people.forEach(p=>{ const g=p.generation??0; if(!groups.has(g)) groups.set(g,[]); groups.get(g).push(p); });
  const ordered=[...groups.keys()].sort((a,b)=>a-b);

  ordered.forEach(g=>{
    const row=document.createElement("div");
    row.className="generation-row";
    row.dataset.generation=g;

    const peeps=groups.get(g).slice().sort((a,b)=>{
      const ay=a.birth?+a.birth.slice(0,4):9999, by=b.birth?+b.birth.slice(0,4):9999;
      return ay-by || a.name.localeCompare(b.name);
    });

    peeps.forEach(p=>{
      const card=document.createElement("article"); card.className="person"; card.id=`person-${p.id}`; card.dataset.id=p.id;

      const src=filePathThumb(p.photoCommons, 176); // 2x of 88px for crispness
      if(src){
        const img=document.createElement("img"); img.className="thumb"; img.alt=p.name; img.loading="lazy"; img.src=src;
        img.onerror=()=>{ img.replaceWith(placeholder()); };
        card.appendChild(img);
      }else{
        card.appendChild(placeholder());
      }

      const body=document.createElement("div"); body.className="person-body";
      const h=document.createElement("h3"); h.className="name"; h.textContent=p.name;
      const lifeTxt=life(p.birth,p.death); const l=document.createElement("div"); l.className="lifespan"; l.textContent=lifeTxt;
      const t=document.createElement("p"); t.className="title"; t.textContent=p.title||"";
      body.appendChild(h); if(lifeTxt) body.appendChild(l); if(t.textContent) body.appendChild(t);
      card.appendChild(body);

      card.addEventListener("click",()=>openBio(p));
      row.appendChild(card);
    });

    rowsEl.appendChild(row);
  });

  queueMicrotask(drawConnections);
  window.addEventListener("resize", drawConnections, {passive:true});
}

/* Connectors:
   - Draw marriage lines between partners (horizontal)
   - For each couple, draw from midpoint to each child (whose parents match the pair)
   - Fallback: single-parent children get a direct parent→child line
*/
function drawConnections(){
  const svg=document.getElementById("connections");
  const container=document.getElementById("tree");
  const rect=container.getBoundingClientRect();
  svg.setAttribute("width", rect.width); svg.setAttribute("height", rect.height);
  svg.setAttribute("viewBox",`0 0 ${rect.width} ${rect.height}`);
  while(svg.firstChild) svg.removeChild(svg.firstChild);

  // index of card positions
  const pos=new Map();
  document.querySelectorAll(".person").forEach(el=>{
    const r=el.getBoundingClientRect();
    pos.set(el.id.replace("person-",""),{
      cx: r.left-rect.left + r.width/2,
      left: r.left-rect.left,
      right: r.right-rect.left,
      top: r.top-rect.top,
      bottom: (r.top-rect.top)+r.height,
      midY: r.top-rect.top + r.height/2
    });
  });

  // helpers to create stroked path / line
  function pathD(mx,my,cx,cy){
    const midY=(my+cy)/2;
    return `M ${mx} ${my} C ${mx} ${midY}, ${cx} ${midY}, ${cx} ${cy}`;
  }
  function drawMarriage(x1,x2,y){
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1", x1); line.setAttribute("y1", y);
    line.setAttribute("x2", x2); line.setAttribute("y2", y);
    line.setAttribute("stroke", getComputedStyle(document.documentElement).getPropertyValue('--marriage')||'#d1d5db');
    line.setAttribute("stroke-width","3");
    line.setAttribute("opacity","0.95");
    svg.appendChild(line);
  }
  function drawChild(mx,my,cx,cy){
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d", pathD(mx,my,cx,cy));
    p.setAttribute("fill","none");
    p.setAttribute("stroke", getComputedStyle(document.documentElement).getPropertyValue('--child')||'#9ca3af');
    p.setAttribute("stroke-width","2");
    p.setAttribute("opacity","0.9");
    svg.appendChild(p);
  }
  function drawDirect(parent, child){
    // fallback parent→child curve
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    const midY=(parent.bottom + child.top)/2;
    const d=`M ${parent.cx} ${parent.bottom} C ${parent.cx} ${midY}, ${child.cx} ${midY}, ${child.cx} ${child.top}`;
    p.setAttribute("d", d);
    p.setAttribute("fill","none");
    p.setAttribute("stroke", getComputedStyle(document.documentElement).getPropertyValue('--child')||'#9ca3af');
    p.setAttribute("stroke-width","2");
    p.setAttribute("opacity","0.85");
    svg.appendChild(p);
  }

  // Track which children were handled by a marriage (to avoid duplicate parent lines)
  const handledChild = new Set();

  // 1) Draw marriages + child lines from midpoint
  MARRIAGES.forEach(m=>{
    const [a,b]=m.partners;
    const pa=pos.get(a), pb=pos.get(b);
    if(!pa || !pb) return; // if a partner is off-screen/not rendered, skip

    // y at which to draw the marriage line (use the average of vertical centers)
    const y = (pa.midY + pb.midY)/2;
    // ensure x ordering
    const x1 = Math.min(pa.cx, pb.cx), x2 = Math.max(pa.cx, pb.cx);
    const mx = (pa.cx + pb.cx)/2;

    drawMarriage(x1, x2, y);

    // children whose two parents match this pair (order agnostic)
    PEOPLE.forEach(ch=>{
      if(!ch.parents || ch.parents.length!==2) return;
      const s=new Set(ch.parents);
      if(s.has(a) && s.has(b)){
        const pc=pos.get(ch.id);
        if(pc){
          // draw from midpoint (slightly below marriage line for clarity)
          const anchorY = y + 4; // tiny offset
          drawChild(mx, anchorY, pc.cx, pc.top);
          handledChild.add(ch.id);
        }
      }
    });
  });

  // 2) Fallback: single-parent or unmatched pairs → draw direct
  PEOPLE.forEach(ch=>{
    if(handledChild.has(ch.id)) return;
    const pc = pos.get(ch.id);
    if(!pc) return;
    const parents = (ch.parents||[]);
    if(parents.length===1){
      const pp = pos.get(parents[0]);
      if(pp) drawDirect(pp, pc);
    } else if(parents.length===2){
      // if parents exist but not in MARRIAGES (or one missing), draw from each parent
      const p1 = pos.get(parents[0]), p2 = pos.get(parents[1]);
      if(p1) drawDirect(p1, pc);
      if(p2) drawDirect(p2, pc);
    }
  });
}

/* Bio dialog */
const D=document.getElementById("bioDialog");
document.getElementById("bioClose").onclick = ()=>D.close();
function openBio(p){
  const thumb=filePathThumb(p.photoCommons, 280);
  const page=filePageUrl(p.photoCommons);
  document.getElementById("bioThumb").src = thumb || "";
  document.getElementById("bioThumb").alt = p.name;
  document.getElementById("bioName").textContent = p.name;
  document.getElementById("bioTitle").textContent = p.title || "";
  document.getElementById("bioLife").textContent = life(p.birth,p.death) || "";
  document.getElementById("bioText").textContent = p.bio || "";

  const badges=document.getElementById("bioBadges"); badges.innerHTML="";
  if(p.generation!=null){ const b=document.createElement("div"); b.className="badge"; b.textContent=`Generation ${p.generation}`; badges.appendChild(b); }
  if(p.parents && p.parents.length){ const b=document.createElement("div"); b.className="badge"; b.textContent=`Parents: ${p.parents.join(", ")}`; badges.appendChild(b); }

  const credit=document.getElementById("bioCredit");
  const lic = p.photoLicense ? ` • ${p.photoLicense}` : "";
  credit.innerHTML = p.photoCommons
    ? `Image: <a href="${page}" target="_blank" rel="noopener">Wikimedia Commons — ${p.photoCommons}</a> • ${p.photoCredit||"See file page"}${lic}`
    : `Image: not provided`;

  D.showModal();
}

/* Init */
(function init(){
  if(PEOPLE.some(p=>p.generation==null)) inferGenerations(PEOPLE);
  window.__PEOPLE_BY_ID = new Map(PEOPLE.map(p=>[p.id,p]));
  renderTree(PEOPLE);
})();
</script>
</body>
</html>
