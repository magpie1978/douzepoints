<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Line of Succession (Scoreboard Style)</title>

  <link href="style/scoreboard.css" rel="stylesheet" />
  <link href="style/footer.css" rel="stylesheet" />

  <style>
    :root{
      --bg:#0f111a; --panel:#1c1f2b; --text:#e8e8e8; --muted:#bdbdbd; --border:#2a2f3f;
      --btn:#1f2433; --btnActive:#2a3044; --accent:#e50914;
    }
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Raleway',system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .main-content{max-width:1100px;margin:32px auto;padding:0 20px 60px}
    .table-wrapper{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:auto}
    table{width:100%;border-collapse:separate;border-spacing:0;min-width:780px}
    thead th{position:sticky;top:0;background:#141826;text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:800}
    tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
    tbody tr:hover{background:#1a1e2c}
    .pos{width:56px;text-align:right;font-variant-numeric:tabular-nums}
    .thumb-wrap{display:flex;align-items:center;gap:12px}
    .thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#222;border:1px solid var(--border)}
    .name{font-weight:800}
    .titles{color:var(--muted);font-size:.95rem}
    .muted{color:var(--muted)}

    /* Toggle Switch */
    .toggle-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0 20px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 56px;
      height: 28px;
    }

    .switch input {opacity: 0; width: 0; height: 0;}

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #555;
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px; width: 20px;
      left: 4px; bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(28px);
    }

    .toggle-label {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.95rem;
    }

    @media (max-width:640px){
      .titles{display:none}
      thead th[data-col="titles"], tbody td[data-col="titles"]{display:none}
    }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <div class="main-content">
    <h1 id="tableHeader">Line of Succession</h1>

    <div class="toggle-container">
      <label class="switch">
        <input type="checkbox" id="toggleSwitch" />
        <span class="slider"></span>
      </label>
      <span id="toggleLabel" class="toggle-label">Excluding excluded (eligible only)</span>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr id="thead-row">
            <!-- dynamically populated -->
          </tr>
        </thead>
        <tbody id="succession-body"></tbody>
      </table>
    </div>

    <p id="status" class="muted" style="padding:10px 2px;"></p>
  </div>

  <div id="footer"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // --- Supabase credentials ---
    const SUPABASE_URL = 'https://eukgodthgusongsbhdwg.supabase.co';
    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1a2dvZHRoZ3Vzb25nc2JoZHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1NjI1NjAsImV4cCI6MjA2NzEzODU2MH0.e8Gm9utDCQWDjSOJgh-VBioCQFX_aAWXz8rzigFgh4s';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const tbody = document.getElementById('succession-body');
    const statusEl = document.getElementById('status');
    const theadRow = document.getElementById('thead-row');
    const toggleSwitch = document.getElementById('toggleSwitch');
    const toggleLabel = document.getElementById('toggleLabel');
    const FALLBACK_IMAGE = "https://i.pinimg.com/736x/3f/3c/f8/3f3cf824ceb39fa5dbd00aa986e25f54.jpg";
    const safe = v => (v == null || v === '') ? '—' : String(v);

    const ORDER_BY_COL = 'order_incl';
    const DISPLAY_POS_COL = 'order_excl';
    let includeExcluded = false; // toggle state

    function renderHeader(){
      const including = includeExcluded;
      theadRow.innerHTML = `
        <th class="pos" data-col="position"># (order_excl)</th>
        <th data-col="photo">Photo</th>
        <th data-col="name">Name</th>
        <th data-col="titles">Titles</th>
        <th data-col="dob">DOB</th>
        ${including ? `<th data-col="exclusion">Exclusion</th>` : ``}
      `;
    }

    function makeRow(row){
      const { name, title, title1, title2, dob, img, image_url, exclusion_flag } = row;
      const t1 = title1 ?? title ?? '';
      const t2 = title2 ?? '';
      const titles = [t1, t2].filter(Boolean).join(' · ') || '—';
      const imgSrc = img || image_url || FALLBACK_IMAGE;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="pos" data-col="position">${safe(row[DISPLAY_POS_COL])}</td>
        <td data-col="photo">
          <div class="thumb-wrap">
            <img class="thumb" alt="${safe(name)}" src="${imgSrc}" onerror="this.src='${FALLBACK_IMAGE}'" />
          </div>
        </td>
        <td class="name" data-col="name">${safe(name)}</td>
        <td class="titles" data-col="titles">${titles}</td>
        <td class="muted" data-col="dob">${safe(dob)}</td>
        ${includeExcluded ? `<td class="muted" data-col="exclusion">${safe(exclusion_flag)}</td>` : ``}
      `;
      return tr;
    }

    function render(rows){
      tbody.innerHTML = '';
      if(!rows?.length){
        statusEl.textContent = 'No entries found.';
        return;
      }
      statusEl.textContent = '';
      const frag = document.createDocumentFragment();
      rows.forEach(r => frag.appendChild(makeRow(r)));
      tbody.appendChild(frag);
    }

    async function loadData(){
      statusEl.textContent = 'Loading…';
      let query = supabase
        .from('qvd_website')
        .select('*')
        .gt(ORDER_BY_COL, 0)
        .order(ORDER_BY_COL, { ascending: true });

      if(!includeExcluded){
        query = query.gt('order_excl', 0);
      }

      const { data, error } = await query;
      if(error){
        statusEl.textContent = 'Error: ' + error.message;
        return;
      }
      render(data);
      statusEl.textContent = '';
    }

    // Toggle handler
    toggleSwitch.addEventListener('change', () => {
      includeExcluded = toggleSwitch.checked;
      toggleLabel.textContent = includeExcluded
        ? 'Including excluded (showing all)'
        : 'Excluding excluded (eligible only)';
      renderHeader();
      loadData();
    });

    // Initial load
    renderHeader();
    loadData();
  </script>

  <script type="module" src="js/header.js"></script>
  <script src="js/footer.js" defer></script>
</body>
</html>
