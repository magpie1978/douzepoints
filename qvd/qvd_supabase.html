<!-- index.html -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Royal Family Tree</title>
  </head>
  <body>
    <div id="app">Loading…</div>

    <script type="module">
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

      const SUPABASE_URL = 'https://eukgodthgusongsbhdwg.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1a2dvZHRoZ3Vzb25nc2JoZHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1NjI1NjAsImV4cCI6MjA2NzEzODU2MH0.e8Gm9utDCQWDjSOJgh-VBioCQFX_aAWXz8rzigFgh4s';
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      function toPerson(row) {
        return {
          id: row.id,
          name: row.name,
          title: row.title ?? "",
          dob: row.dob ?? "",
          dod: row.dod ?? "",
          img: row.img ?? "",
          parents: Array.isArray(row.parents) ? row.parents :
                   (row.parents ? String(row.parents).split(',').map(s => s.trim()) : []),
          spouses: Array.isArray(row.spouses) ? row.spouses :
                   (row.spouses ? String(row.spouses).split(',').map(s => s.trim()) : []),
          illegitimate: row.illegitimate ?? null
        };
      }

      async function fetchPeopleFromSupabase({ onlyVisible = true } = {}) {
        let query = supabase.from('people').select('*');
        if (onlyVisible) query = query.eq('visible', 'visible'); // or .eq('visible', true)
        query = query.order('generation', { ascending: true }).order('id', { ascending: true });
        
        
        const { data, error } = await query;
        if (error) throw error;
        return (data ?? []).map(toPerson);
      }

      // Dummy renderer—replace with your real render function
      function renderFamilyTree(people) {
        const el = document.getElementById('app');
        el.innerHTML = `<pre>${people.map(p => `${p.generation ?? ''}\t${p.id}\t${p.name}`).join('\n')}</pre>`;
      }

      (async () => {
        try {
          const people = await fetchPeopleFromSupabase({ onlyVisible: true });
          renderFamilyTree(people);
        } catch (err) {
          document.getElementById('app').textContent = 'Error: ' + err.message;
          console.error(err);
        }
      })();
    </script>
  </body>
</html>
