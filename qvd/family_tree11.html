<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive Family Tree (Scrollable + Delete)</title>
<style>
  :root { --bg:#0f111a; --panel:#1c1f2b; --accent:#e50914; --text:#e8e8e8; --muted:#bdbdbd; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--text);
         font-family:'Raleway',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }

  /* Toolbar (fixed) */
  .toolbar { position:fixed; top:10px; left:12px; z-index:100; display:flex; gap:8px; align-items:center;
             background:rgba(20,24,38,.85); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:8px;
             backdrop-filter: blur(6px); }
  .btn { background:transparent; border:1px solid var(--accent); color:var(--text); padding:6px 10px; border-radius:10px; cursor:pointer; }
  .btn:hover { background:rgba(229,9,20,.12); }
  .btn.ghost { border-color:rgba(255,255,255,.2); }
  .btn.danger { border-color:#ff4d4f; color:#ff4d4f; }
  .btn.danger:hover { background:rgba(255,77,79,.12); }

  /* Scrollable stage */
  #scroll { position:absolute; inset:0; overflow:auto; }
  #world  { position:relative; width:2400px; height:1600px; } /* will auto-grow */

  /* SVG underlay inside world so it scrolls with content */
  #connector { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .edge,.bus,.stem,.drop,.spouse { stroke:var(--accent); stroke-width:3; fill:none; vector-effect:non-scaling-stroke; }
  .spouse { stroke-width:2; opacity:.9; }
  .dotted { stroke-dasharray: 6 6; }

  /* Person cards */
  .person { position:absolute; z-index:1; display:grid; grid-template-columns:1fr 2fr; width:360px; height:120px;
            background:var(--panel); border:2px solid var(--accent); border-radius:14px; overflow:hidden; cursor:grab; user-select:none;
            box-shadow:0 6px 18px rgba(0,0,0,.35), 0 0 0 1px rgba(229,9,20,.25) inset; }
  .avatar { width:100%; height:100%; background:#222; border-radius:0 !important; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; border-radius:0 !important; }
  .details { display:flex; flex-direction:column; justify-content:center; padding:12px 16px; }
  .name { font-weight:700; font-size:1.1rem; }
  .title { font-size:.9rem; color:var(--muted); margin-top:4px; }
  .actions { margin-top:10px; }
  .actions .btn { padding:4px 8px; }

  /* Modal editor */
  .modal { position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.55); z-index:200; }
  .modal[open] { display:grid; }
  .dialog { width:min(740px,92vw); background:#141826; border:1px solid rgba(255,255,255,.1); border-radius:16px;
            box-shadow:0 30px 70px rgba(0,0,0,.5); padding:18px; }
  .grid { display:grid; gap:12px; }
  .row { display:grid; gap:8px; }
  label { font-size:.9rem; color:var(--muted); }
  input[type="text"], input[type="url"], select { width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.15);
                                                 background:#0f1320; color:var(--text); }
  select[multiple] { min-height:100px; }
  .dialog .buttons { display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top:8px; }
  .buttons-right { display:flex; gap:10px; }
  .hint { font-size:.85rem; color:var(--muted); }
</style>
</head>
<body>
  <div class="toolbar">
    <button class="btn" id="addPerson">Add Person</button>
    <button class="btn ghost" id="resetAll">Reset</button>
  </div>

  <!-- SCROLLABLE STAGE -->
  <div id="scroll">
    <div id="world">
      <svg id="connector" viewBox="0 0 2400 1600" preserveAspectRatio="none"></svg>
      <div id="cards-root"></div>
    </div>
  </div>

  <!-- Editor -->
  <div class="modal" id="editor" role="dialog" aria-modal="true">
    <div class="dialog">
      <h2>Edit Person</h2>
      <div class="grid">
        <div class="row"><label>Name</label><input id="name" type="text"></div>
        <div class="row"><label>Title</label><input id="title" type="text"></div>
        <div class="row"><label>Image URL</label><input id="imgUrl" type="url" placeholder="https://example.com/pic.jpg"></div>
        <div class="row"><label>Upload image</label><input id="imgFile" type="file" accept="image/*"></div>

        <div class="row" style="grid-template-columns:1fr 1fr; gap:10px;">
          <div><label>Mother</label><select id="motherSel"></select></div>
          <div><label>Father</label><select id="fatherSel"></select></div>
        </div>

        <div class="row">
          <label><input type="checkbox" id="illegitChk"> Illegitimate (single-parent dotted link)</label>
          <div class="hint">Only applies when exactly one parent is selected.</div>
        </div>

        <div class="row">
          <label>Partners / Spouses (multi-select)</label>
          <select id="partnersSel" multiple></select>
        </div>

        <div class="buttons">
          <button class="btn danger" id="deletePerson">Delete Person</button>
          <div class="buttons-right">
            <button class="btn ghost" id="clearImg">Clear Photo</button>
            <button class="btn" id="cancel">Cancel</button>
            <button class="btn" id="apply">Apply</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/* ===================== Config & State ===================== */
var STORE_KEY='familytree_scrollable_v2_delete';
var CARD_W=360, CARD_H=120, PADDING=200;

function defaultState(){
  return {
    nodes:{
      A1:{id:'A1',name:'Person A',title:'Title goes here',imgSrc:'',x:200,y:200,motherId:null,fatherId:null,partners:[],illegitimate:false},
      B2:{id:'B2',name:'Person B',title:'Title goes here',imgSrc:'',x:800,y:200,motherId:null,fatherId:null,partners:[],illegitimate:false}
    },
    edges:[], triEdges:[], nextId:3
  };
}
function load(){
  try{
    var raw=localStorage.getItem(STORE_KEY);
    var s=raw?JSON.parse(raw):defaultState();
    Object.keys(s.nodes||{}).forEach(function(k){
      var n=s.nodes[k];
      if(n.motherId===undefined)n.motherId=null;
      if(n.fatherId===undefined)n.fatherId=null;
      if(!Array.isArray(n.partners))n.partners=[];
      if(typeof n.illegitimate!=='boolean') n.illegitimate=false;
      if(typeof n.x!=='number') n.x=100;
      if(typeof n.y!=='number') n.y=100;
    });
    if(!Array.isArray(s.edges)) s.edges=[];
    s.edges=s.edges.map(function(e){return {from:e.from,to:e.to,dotted:!!e.dotted};});
    if(!Array.isArray(s.triEdges)) s.triEdges=[];
    if(typeof s.nextId!=='number') s.nextId=3;
    return s;
  }catch(e){ console.error(e); return defaultState(); }
}
var state=load();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

/* ===================== Elements ===================== */
var world=document.getElementById('world');
var svg=document.getElementById('connector');
var cards=document.getElementById('cards-root');

var editor=document.getElementById('editor');
var nameIn=document.getElementById('name'), titleIn=document.getElementById('title');
var imgUrl=document.getElementById('imgUrl'), imgFile=document.getElementById('imgFile');
var motherSel=document.getElementById('motherSel'), fatherSel=document.getElementById('fatherSel');
var partnersSel=document.getElementById('partnersSel'), illegitChk=document.getElementById('illegitChk');
var applyBt=document.getElementById('apply'), cancelBt=document.getElementById('cancel'), clearBt=document.getElementById('clearImg');
var addBt=document.getElementById('addPerson'), resetBt=document.getElementById('resetAll');
var deleteBt=document.getElementById('deletePerson');
var editingId=null;

/* ===================== World size ===================== */
function updateWorldSize(){
  var minX=0, minY=0, maxX=1200, maxY=800;
  Object.keys(state.nodes).forEach(function(id){
    var n=state.nodes[id];
    if(n.x+CARD_W>maxX) maxX=n.x+CARD_W;
    if(n.y+CARD_H>maxY) maxY=n.y+CARD_H;
  });
  maxX += PADDING; maxY += PADDING;
  world.style.width = Math.max(maxX, world.clientWidth) + 'px';
  world.style.height= Math.max(maxY, world.clientHeight) + 'px';
  svg.setAttribute('viewBox','0 0 '+world.clientWidth+' '+world.clientHeight);
}
function clampPos(v){ return Math.max(0, v); }

/* ===================== Geometry & SVG helpers ===================== */
function cardRect(id){
  var el=document.getElementById(id); if(!el) return null;
  var r=el.getBoundingClientRect();
  return { el:el, cx:r.left+r.width/2, cy:r.top+r.height/2, topx:r.left+r.width/2, topy:r.top, bottomy:r.bottom };
}
function ensureLine(id,cls){
  var l=document.getElementById(id);
  if(!l){ l=document.createElementNS('http://www.w3.org/2000/svg','line'); l.id=id; l.classList.add(cls); l.setAttribute('vector-effect','non-scaling-stroke'); svg.appendChild(l); }
  return l;
}
function removeById(id){ var el=document.getElementById(id); if(el) el.remove(); }

/* ===================== Connectors ===================== */
function drawEdge(e){
  var a=cardRect(e.from), b=cardRect(e.to); if(!a||!b) return;
  var id='edge-'+e.from+'-'+e.to; var l=ensureLine(id,'edge');
  if(e.dotted) l.classList.add('dotted'); else l.classList.remove('dotted');
  l.setAttribute('x1',a.cx); l.setAttribute('y1',a.cy);
  l.setAttribute('x2',b.cx); l.setAttribute('y2',b.cy);
}
function addSingleParentEdge(parentId, childId, dotted){
  var from = parentId < childId ? parentId : childId;
  var to   = parentId < childId ? childId : parentId;
  state.edges = state.edges.filter(function(e){ return !(e.from===from && e.to===to); });
  state.edges.push({from:from,to:to,dotted:!!dotted});
}

function parentsKey(a,b){ var s=[a,b].sort(); return s[0]+'|'+s[1]; }
function groupTriEdges(){
  var m={};
  state.triEdges.forEach(function(t){
    var k=parentsKey(t.parents[0],t.parents[1]);
    if(!m[k]) m[k]={parents:[].concat(t.parents).sort(), children:{}};
    m[k].children[t.child]=true;
  });
  var out=new Map();
  Object.keys(m).forEach(function(k){
    out.set(k,{parents:m[k].parents, children:Object.keys(m[k].children)});
  });
  return out;
}
function ensureBusElems(k){ return { stem:ensureLine('stem-'+k,'stem'), bus:ensureLine('bus-'+k,'bus') }; }
function ensureDropElem(k,cid){ return ensureLine('drop-'+k+'-'+cid,'drop'); }

function updateBusGroup(key, group){
  var p1=group.parents[0], p2=group.parents[1];
  var R1=cardRect(p1), R2=cardRect(p2); if(!R1||!R2) return;
  var mid={ x:(R1.cx+R2.cx)/2, y:(R1.cy+R2.cy)/2 };

  var children=group.children.map(function(id){ return {id:id, r:cardRect(id)}; }).filter(function(o){return !!o.r;});
  if(children.length===0) return;

  if(children.length===1){
    var r=children[0].r;
    var anchorY = (r.topy >= mid.y) ? r.topy : r.bottomy;
    var stem=ensureLine('stem-'+key,'stem');
    stem.classList.remove('dotted');
    stem.setAttribute('x1',mid.x); stem.setAttribute('y1',mid.y);
    stem.setAttribute('x2',r.topx); stem.setAttribute('y2',anchorY);
    removeById('bus-'+key);
    svg.querySelectorAll('[id^="drop-'+key+'-"]').forEach(function(el){el.remove();});
    return;
  }

  var xs=children.map(function(c){return c.r.topx;});
  var topYs=children.map(function(c){return c.r.topy;});
  var botYs=children.map(function(c){return c.r.bottomy;});
  var GAP_ABOVE=24, GAP_BELOW=24, MIN_STEM=24;
  var minTop=Math.min.apply(Math,topYs), maxBot=Math.max.apply(Math,botYs);
  var allBelow = minTop > mid.y, allAbove = maxBot < mid.y;
  var busY;
  if(allBelow){ busY=minTop-GAP_ABOVE; if(busY<mid.y+MIN_STEM) busY=mid.y+MIN_STEM; }
  else if(allAbove){ busY=maxBot+GAP_BELOW; if(busY>mid.y-MIN_STEM) busY=mid.y-MIN_STEM; }
  else{ busY=mid.y+MIN_STEM; }

  var minX=Math.min.apply(Math,xs), maxX=Math.max.apply(Math,xs);
  var elems=ensureBusElems(key), stem=elems.stem, bus=elems.bus;
  stem.setAttribute('x1',mid.x); stem.setAttribute('y1',mid.y);
  stem.setAttribute('x2',mid.x); stem.setAttribute('y2',busY);
  bus.setAttribute('x1',minX); bus.setAttribute('y1',busY);
  bus.setAttribute('x2',maxX); bus.setAttribute('y2',busY);

  var busAbove = busY <= minTop, busBelow = busY >= maxBot;
  var keep={};
  children.forEach(function(c){
    var r=c.r, drop=ensureDropElem(key,c.id);
    var anchorY= busAbove ? r.topy : (busBelow ? r.bottomy : (Math.abs(busY-r.topy)<=Math.abs(busY-r.bottomy)?r.topy:r.bottomy));
    drop.setAttribute('x1',r.topx); drop.setAttribute('y1',busY);
    drop.setAttribute('x2',r.topx); drop.setAttribute('y2',anchorY);
    keep[drop.id]=true;
  });
  svg.querySelectorAll('[id^="drop-'+key+'-"]').forEach(function(d){ if(!keep[d.id]) d.remove(); });
}

function updateAllBuses(){
  svg.querySelectorAll('.stem,.bus,.drop').forEach(function(e){e.remove();});
  var groups=groupTriEdges();
  groups.forEach(function(g,k){ updateBusGroup(k,g); });
}
function partnerKey(a,b){ var s=[a,b].sort(); return 'sp-'+s[0]+'-'+s[1]; }
function updateSpouse(a,b){
  var A=cardRect(a), B=cardRect(b); if(!A||!B) return;
  var id=partnerKey(a,b), l=ensureLine(id,'spouse');
  l.setAttribute('x1',A.cx); l.setAttribute('y1',A.cy);
  l.setAttribute('x2',B.cx); l.setAttribute('y2',B.cy);
}
function updateAllSpouses(){
  svg.querySelectorAll('.spouse').forEach(function(e){e.remove();});
  var seen={};
  Object.keys(state.nodes).forEach(function(id){
    var n=state.nodes[id];
    (n.partners||[]).forEach(function(p){
      var k=partnerKey(id,p);
      if(seen[k]) return; seen[k]=true;
      updateSpouse(id,p);
    });
  });
}
function updateAllEdges(){
  svg.querySelectorAll('.edge').forEach(function(e){e.remove();});
  state.edges.forEach(drawEdge);
  updateAllBuses();
  updateAllSpouses();
}

/* ===================== Rendering & Dragging ===================== */
function renderNode(n){
  var el=document.getElementById(n.id);
  if(!el){
    el=document.createElement('div'); el.id=n.id; el.className='person';
    el.innerHTML='<div class="avatar"><img alt="'+(n.name||'photo')+'"></div>\
      <div class="details"><div class="name"></div><div class="title"></div>\
      <div class="actions"><button class="btn" data-edit>Edit</button></div></div>';
    cards.appendChild(el);
    attachCardEvents(el);
  }
  el.querySelector('.name').textContent=n.name||'';
  el.querySelector('.title').textContent=n.title||'';
  var img=el.querySelector('img'); if(n.imgSrc) img.src=n.imgSrc; else img.removeAttribute('src');
  el.style.transform='translate('+n.x+'px,'+n.y+'px)';
}
function renderAll(){
  cards.innerHTML='';
  Object.keys(state.nodes).forEach(function(id){ renderNode(state.nodes[id]); });
  updateWorldSize();
  updateAllEdges();
}

var dragging=null, start={x:0,y:0}, origin={x:0,y:0};
function getTranslate(el){
  var m=getComputedStyle(el).transform;
  if(m==='none') return {x:0,y:0};
  var parts=m.match(/matrix\(([^)]+)\)/); if(!parts) return {x:0,y:0};
  var nums=parts[1].split(',').map(Number);
  return {x:nums[4], y:nums[5]};
}
function onDown(e){
  var el=e.currentTarget;
  if(e.target.closest && e.target.closest('.actions')) return;
  dragging=el; el.style.cursor='grabbing';
  origin=getTranslate(el);
  start={x:e.clientX, y:e.clientY};
  e.preventDefault();
}
function onMove(e){
  if(!dragging) return;
  var dx=e.clientX-start.x, dy=e.clientY-start.y;
  var nx=Math.max(0, origin.x+dx), ny=Math.max(0, origin.y+dy);
  dragging.style.transform='translate('+nx+'px,'+ny+'px)';
  updateAllEdges();
}
function onUp(){
  if(!dragging) return;
  dragging.style.cursor='grab';
  var pos=getTranslate(dragging);
  var n=state.nodes[dragging.id];
  n.x=Math.max(0,pos.x); n.y=Math.max(0,pos.y);
  dragging=null;
  updateWorldSize();
  save();
}
function attachCardEvents(el){
  el.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  el.addEventListener('dblclick', function(){ openEditor(el.id); });
  el.querySelector('[data-edit]').addEventListener('click', function(ev){ ev.stopPropagation(); openEditor(el.id); });
}

/* ===================== Editor ===================== */
function optionsHTML(excludeId, includeNone, selected){
  includeNone = includeNone!==false; selected=selected||[];
  var s = includeNone ? '<option value="">(None)</option>' : '';
  Object.keys(state.nodes).forEach(function(id){
    if(id===excludeId) return;
    var n=state.nodes[id];
    s += '<option value="'+id+'"'+(selected.indexOf(id)>=0?' selected':'')+'>'+ (n.name||id) +'</option>';
  });
  return s;
}
function partnersHTML(excludeId, selected){
  selected=selected||[];
  var s=''; Object.keys(state.nodes).forEach(function(id){
    if(id===excludeId) return; var n=state.nodes[id];
    s += '<option value="'+id+'"'+(selected.indexOf(id)>=0?' selected':'')+'>'+ (n.name||id) +'</option>';
  }); return s;
}
function syncIllegitToggle(){
  var one = (!!motherSel.value) !== (!!fatherSel.value);
  illegitChk.disabled = !one;
  if(!one) illegitChk.checked=false;
}
function openEditor(id){
  editingId=id; var n=state.nodes[id];
  nameIn.value=n.name||''; titleIn.value=n.title||'';
  imgUrl.value=''; imgFile.value='';
  motherSel.innerHTML=optionsHTML(id,true,n.motherId?[n.motherId]:[]);
  fatherSel.innerHTML=optionsHTML(id,true,n.fatherId?[n.fatherId]:[]);
  partnersSel.innerHTML=partnersHTML(id,n.partners);
  illegitChk.checked=!!n.illegitimate; syncIllegitToggle();
  editor.setAttribute('open',''); setTimeout(function(){nameIn.focus();},0);
}
function closeEditor(){ editor.removeAttribute('open'); editingId=null; }
cancelBt.addEventListener('click', closeEditor);
editor.addEventListener('click', function(e){ if(e.target===editor) closeEditor(); });
window.addEventListener('keydown', function(e){ if(e.key==='Escape' && editor.hasAttribute('open')) closeEditor(); });
motherSel.addEventListener('change', syncIllegitToggle);
fatherSel.addEventListener('change', syncIllegitToggle);

applyBt.addEventListener('click', function(){
  if(!editingId) return;
  var n=state.nodes[editingId];
  n.name=nameIn.value||n.name||'Person'; n.title=titleIn.value||'';

  var oldMother=n.motherId, oldFather=n.fatherId;
  var newMother=motherSel.value||null, newFather=fatherSel.value||null;
  n.motherId=newMother; n.fatherId=newFather;
  n.illegitimate = !!illegitChk.checked && ((!!newMother)!=(!!newFather));

  // Remove previous parent links for this child
  state.edges = state.edges.filter(function(e){
    var touchesChild = (e.from===editingId || e.to===editingId);
    var prevParents = [oldMother,oldFather].filter(function(p){return !!p;});
    var touchesPrev = prevParents.some(function(p){return e.from===p||e.to===p;});
    return !(touchesChild && touchesPrev);
  });
  state.triEdges = state.triEdges.filter(function(t){ return t.child!==editingId; });

  // Add new links
  if(newMother && newFather && newMother!==newFather){
    state.triEdges.push({parents:[newMother,newFather].sort(), child:editingId});
  }else if(newMother || newFather){
    var p=newMother||newFather;
    addSingleParentEdge(p, editingId, n.illegitimate);
  }

  // Partners (bidirectional)
  var sel=[]; for(var i=0;i<partnersSel.options.length;i++){ if(partnersSel.options[i].selected) sel.push(partnersSel.options[i].value); }
  var prev=(n.partners||[]).slice();
  prev.forEach(function(pid){
    if(sel.indexOf(pid)<0){ var other=state.nodes[pid]; if(other) other.partners=(other.partners||[]).filter(function(x){return x!==editingId;}); }
  });
  n.partners=sel.slice();
  sel.forEach(function(pid){ var other=state.nodes[pid]; if(other){ if(!Array.isArray(other.partners)) other.partners=[]; if(other.partners.indexOf(editingId)<0) other.partners.push(editingId); }});

  // Image
  function finish(){ save(); renderNode(n); updateWorldSize(); updateAllEdges(); closeEditor(); }
  if(imgFile.files && imgFile.files[0]){
    var r=new FileReader(); r.onload=function(){ n.imgSrc=r.result; finish(); }; r.readAsDataURL(imgFile.files[0]);
  }else if((imgUrl.value||'').trim()){
    var u=imgUrl.value.trim(), test=new Image();
    test.onload=function(){ n.imgSrc=u; finish(); };
    test.onerror=function(){ alert('Could not load image from URL.'); finish(); };
    test.src=u;
  }else{ finish(); }
});

/* ======== DELETE PERSON (removes links, keeps everyone else) ======== */
deleteBt.addEventListener('click', function(){
  if(!editingId) return;
  var id=editingId;
  var n=state.nodes[id];
  if(!n) return;

  var msg='Delete "'+(n.name||id)+'"? This removes all connections to this person, but does not delete anyone else.';
  if(!confirm(msg)) return;

  // 1) Remove from others' partners
  Object.keys(state.nodes).forEach(function(k){
    if(k===id) return;
    var p=state.nodes[k];
    if(Array.isArray(p.partners)) p.partners = p.partners.filter(function(x){ return x!==id; });
  });

  // 2) Clear as mother/father on children
  Object.keys(state.nodes).forEach(function(k){
    var c=state.nodes[k];
    if(c.motherId===id) c.motherId=null;
    if(c.fatherId===id) c.fatherId=null;
  });

  // 3) Remove 1→1 edges involving id
  state.edges = state.edges.filter(function(e){ return e.from!==id && e.to!==id; });

  // 4) Remove triEdges where id is a parent or the child
  state.triEdges = state.triEdges.filter(function(t){
    var isParent = t.parents.indexOf(id)>=0;
    var isChild  = t.child===id;
    return !(isParent || isChild);
  });

  // 5) Remove the node
  delete state.nodes[id];

  // 6) Persist + re-render
  save();
  closeEditor();
  renderAll(); // re-render cards, then:
  updateAllEdges(); // rebuild connectors
});

/* ===================== Add & Reset ===================== */
document.getElementById('addPerson').addEventListener('click', function(){
  var id='N'+(state.nextId++), baseX=world.clientWidth/2 - CARD_W/2, baseY=world.clientHeight/2 - CARD_H/2;
  function j(n){ return Math.round(n + (Math.random()*120 - 60)); }
  state.nodes[id]={ id:id, name:'Person '+id, title:'Title goes here', imgSrc:'', x:j(baseX), y:j(baseY), motherId:null, fatherId:null, partners:[], illegitimate:false };
  save(); renderNode(state.nodes[id]); updateWorldSize(); updateAllEdges(); openEditor(id);
});
document.getElementById('resetAll').addEventListener('click', function(){
  if(!confirm('Clear all people and connections?')) return;
  state=defaultState(); save(); renderAll();
});

/* ===================== Init ===================== */
function init(){ updateWorldSize(); renderAll(); }
window.addEventListener('resize', function(){ updateWorldSize(); updateAllEdges(); });
init();
</script>
</body>
</html>
