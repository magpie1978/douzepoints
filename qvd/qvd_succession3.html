<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Line of Succession</title>
<style>
  :root{
    --bg:#0f111a;
    --panel:#1c1f2b;
    --accent:#cccccc;
    --text:#e8e8e8;
    --muted:#bdbdbd;
    --header-h:96px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:var(--bg); color:var(--text); font-family:'Raleway',sans-serif; }

  /* Header */
  header{
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; height:var(--header-h);
    background:#141826; box-shadow:0 6px 14px rgba(0,0,0,.45); z-index:100;
  }
  .title{ margin:0; font-size:1.6rem; font-weight:800; }
  .subtitle{ margin:2px 0 0; color:var(--muted); font-size:.95rem; }

  /* Main area */
  #scroll{ position:fixed; top:var(--header-h); left:0; right:0; bottom:0; overflow:auto; }
  .container{ max-width:1100px; margin:30px auto; padding:0 20px 60px; }

  /* List layout — one per line, with more space between */
  .list{ display:flex; flex-direction:column; gap:28px; padding:16px; }

  /* Card styling */
  .card{
    position:relative;
    display:grid;
    grid-template-columns:140px 1fr;
    align-items:stretch;
    min-height:130px;
    background:var(--panel);
    border:2px solid var(--accent);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.08) inset;
    transition:transform .18s ease, box-shadow .22s ease, border-color .22s ease;
  }
  .card:hover{
    transform:translateY(-4px) scale(1.015);
    background-color:#1a1e2c;
    border-color:rgba(255,255,255,.6);
    box-shadow:0 14px 28px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.25) inset, 0 0 22px rgba(255,255,255,.18);
  }

  .photo{ width:100%; height:100%; background:#222; overflow:hidden; }
  .photo img{ width:100%; height:100%; object-fit:cover; display:block; }

  .info{ display:flex; flex-direction:column; justify-content:center; padding:16px 18px; }
  .name{ font-weight:800; font-size:1.1rem; }
  .titles{ color:var(--muted); font-size:.95rem; margin-top:4px; line-height:1.25; }
  .dob{ color:var(--muted); font-size:.9rem; margin-top:8px; }

  /* Order badge (notification style) */
  .badge{
    position:absolute;
    top:-12px; left:-12px;
    width:50px; height:50px;
    border-radius:50%;
    background:#e50914;           /* bright red like a notification */
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:1rem;
    z-index:5;                    /* ensure it's on top of the card */
    box-shadow:0 2px 8px rgba(0,0,0,.6);
    border:3px solid var(--bg);   /* creates that "cutout" edge look */
  }

  /* Status message */
  .status{ padding:20px; color:var(--muted); text-align:center; }

  @media (max-width:600px){
    .card{ grid-template-columns:110px 1fr; }
    .badge{ width:44px; height:44px; top:-10px; left:-10px; }
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1 class="title">Line of Succession</h1>
      <p class="subtitle">People with a non-zero succession position</p>
    </div>
  </header>

  <div id="scroll">
    <div class="container">
      <div id="cards" class="list"></div>
      <div id="status" class="status" hidden>Loading…</div>
    </div>
  </div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://eukgodthgusongsbhdwg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1a2dvZHRoZ3Vzb25nc2JoZHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1NjI1NjAsImV4cCI6MjA2NzEzODU2MH0.e8Gm9utDCQWDjSOJgh-VBioCQFX_aAWXz8rzigFgh4s';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const cardsEl = document.getElementById('cards');
const statusEl = document.getElementById('status');
const FALLBACK_IMAGE = "https://i.pinimg.com/736x/3f/3c/f8/3f3cf824ceb39fa5dbd00aa986e25f54.jpg";
const safe = v => (v == null || v === '') ? '—' : String(v);

function renderCard(row){
  const { name, title, title1, title2, dob, img, image_url, order_number } = row;
  const t1 = title1 ?? title ?? '';
  const t2 = title2 ?? '';
  const imgSrc = img || image_url || FALLBACK_IMAGE;

  const card = document.createElement('article');
  card.className = 'card';
  card.innerHTML = `
    <div class="badge">${safe(order_number)}</div>
    <div class="photo"><img alt="${safe(name)}" src="${imgSrc}" onerror="this.src='${FALLBACK_IMAGE}'"></div>
    <div class="info">
      <div class="name">${safe(name)}</div>
      <div class="titles">${[t1, t2].filter(Boolean).join(' · ') || '—'}</div>
      <div class="dob"><strong>DOB:</strong> ${safe(dob)}</div>
    </div>
  `;
  return card;
}

function renderList(rows){
  cardsEl.innerHTML = '';
  if(!rows?.length){
    statusEl.hidden = false;
    statusEl.textContent = 'No entries found.';
    return;
  }
  statusEl.hidden = true;
  const frag = document.createDocumentFragment();
  rows.forEach(r => frag.appendChild(renderCard(r)));
  cardsEl.appendChild(frag);
}

async function loadSuccession(){
  statusEl.hidden = false;
  statusEl.textContent = 'Loading…';
  const { data, error } = await supabase
    .from('qvd_succession')
    .select('*')
    .gt('order_number', 0)
    .order('order_number', { ascending: true });
  if(error){
    statusEl.hidden = false;
    statusEl.textContent = 'Error: ' + error.message;
    return;
  }
  renderList(data);
}

loadSuccession();
</script>
</body>
</html>
