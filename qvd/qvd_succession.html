<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Line of Succession</title>
<style>
  :root{
    --bg:#0f111a;
    --panel:#1c1f2b;
    --accent:#cccccc;
    --text:#e8e8e8;
    --muted:#bdbdbd;
    --glass:#121728;
    --header-h:112px;
    --badge:#e50914; /* badge color */
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:'Raleway', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  /* Header */
  header{
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:24px; padding:22px 34px;
    background:#141826; box-shadow:0 6px 14px rgba(0,0,0,.45);
    z-index:300; height:var(--header-h);
  }
  .header-left{ max-width:60%; }
  .header-title{ margin:0 0 8px 0; font-size:2rem; font-weight:800; letter-spacing:.2px; color:var(--text); }
  .header-desc{ margin:0; color:var(--muted); font-size:.98rem; line-height:1.45; }

  /* Main scroll area and world backdrop grid */
  #scroll{ position:absolute; left:0; right:0; bottom:0; top:var(--header-h); overflow:auto; }
  #world{
    position:relative; min-height:100%; padding:28px;
    --gs:40px;
  }
  #world.grid{
    background-image:
      linear-gradient(to right, rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size:var(--gs) var(--gs);
    background-position:0 0;
  }

  /* Card grid */
  .cards{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap:18px;
  }

  /* Person card (succession) */
  .succ-card{
    position:relative;
    display:grid; grid-template-columns:120px 1fr; align-items:stretch;
    min-height:120px; background:var(--panel);
    border:2px solid var(--accent);
    border-radius:14px; overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.08) inset;
    transition: transform .18s ease, box-shadow .22s ease, border-color .22s ease, background-color .22s ease, filter .22s ease;
  }
  .succ-card:hover{
    transform:translateY(-4px) scale(1.015);
    background-color:#1a1e2c;
    border-color: rgba(255,255,255,0.6);
    box-shadow:0 14px 28px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.25) inset, 0 0 22px rgba(255,255,255,.18);
    filter:saturate(1.05);
  }

  .photo{
    background:#222; overflow:hidden;
    border-right:1px solid rgba(255,255,255,.08);
  }
  .photo img{ width:100%; height:100%; object-fit:cover; display:block; }

  .info{ padding:12px 16px; display:flex; flex-direction:column; justify-content:center; }
  .name{ font-weight:800; font-size:1.05rem; line-height:1.2; }
  .titles{ color:var(--muted); margin-top:4px; font-size:.95rem; }
  .dob{ color:var(--muted); margin-top:8px; font-size:.9rem; }

  /* Order number badge */
  .badge{
    position:absolute; top:-10px; left:-10px;
    width:56px; height:56px; border-radius:999px;
    background:var(--badge); color:white; font-weight:900;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(229,9,20,.45), 0 0 0 3px rgba(0,0,0,.35);
    font-size:1rem;
  }
  .badge::after{
    content:""; position:absolute; inset:4px;
    border-radius:999px; border:1px solid rgba(255,255,255,.35);
  }

  /* Top bar filters (optional spacing holder) */
  .toolbar{ display:flex; gap:12px; align-items:center; margin-bottom:16px; }

  /* Empty state */
  .empty{
    text-align:center; color:var(--muted); padding:40px 0;
  }
</style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1 class="header-title">Line of Succession</h1>
      <p class="header-desc">Showing everyone with an assigned succession number (order_number &gt; 0). Click a card to view.</p>
    </div>
    <div class="header-right"><!-- space reserved for future filters/search --></div>
  </header>

  <div id="scroll" aria-live="polite">
    <div id="world" class="grid">
      <div class="toolbar"></div>
      <div id="cards" class="cards" role="list"></div>
      <div id="empty" class="empty" hidden>No results.</div>
    </div>
  </div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ===== Supabase config (same project as your other pages) ===== */
const SUPABASE_URL = 'https://eukgodthgusongsbhdwg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1a2dvZHRoZ3Vzb25nc2JoZHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1NjI1NjAsImV4cCI6MjA2NzEzODU2MH0.e8Gm9utDCQWDjSOJgh-VBioCQFX_aAWXz8rzigFgh4s';
export const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
window.supabaseClient = supabase;

const FALLBACK_IMAGE = "https://i.pinimg.com/736x/3f/3c/f8/3f3cf824ceb39fa5dbd00aa986e25f54.jpg";

const cardsEl = document.getElementById('cards');
const emptyEl = document.getElementById('empty');
const world   = document.getElementById('world');

/* Optionally enforce grid lines via JS too */
world.classList.add('grid');
world.style.setProperty('--gs', '40px');

/* ===== Helpers ===== */
const safe = v => (v == null || v === '') ? '—' : String(v);
const joinTitles = (r) => {
  // use title1 + title2 if present, else fallback to title
  const t = [r.title1, r.title2].filter(x => x && String(x).trim() !== '');
  return t.length ? t.join(' · ') : (r.title || '');
};

/* ===== Fetch from view qvd_succession (order_number > 0) ===== */
async function loadSuccession(){
  const { data, error } = await supabase
    .from('qvd_succession')
    .select('*')
    .gt('order_number', 0)
    .order('order_number', { ascending: true });

  if (error) {
    console.error(error);
    cardsEl.innerHTML = '';
    emptyEl.hidden = false;
    emptyEl.textContent = 'Failed to load data: ' + error.message;
    return;
  }

  renderCards(data || []);
}

/* ===== Render ===== */
function renderCards(rows){
  cardsEl.innerHTML = '';
  if (!rows.length){
    emptyEl.hidden = false;
    return;
  }
  emptyEl.hidden = true;

  for (const r of rows){
    const imgSrc = r.img || r.image_url || FALLBACK_IMAGE;
    const name   = r.name || r.fullname || r.id || '';
    const titles = joinTitles(r);
    const dob    = r.dob || r.date_of_birth || '';
    const num    = r.order_number;

    const card = document.createElement('article');
    card.className = 'succ-card';
    card.setAttribute('role','listitem');
    card.innerHTML = `
      <div class="badge" title="Order number">${safe(num)}</div>
      <div class="photo"><img alt="${safe(name)}" src="${imgSrc}"></div>
      <div class="info">
        <div class="name">${safe(name)}</div>
        <div class="titles">${safe(titles)}</div>
        <div class="dob">Born ${safe(dob)}</div>
      </div>
    `;

    // Robust image fallback
    const img = card.querySelector('img');
    img.onerror = () => { img.src = FALLBACK_IMAGE; };

    // Optional: click to console (or later open a drawer)
    card.addEventListener('click', () => {
      console.log('Selected:', { id: r.id, name, order_number: num });
    });

    cardsEl.appendChild(card);
  }
}

/* ===== Init ===== */
loadSuccession();
</script>
</body>
</html>
