
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>DouzePoints | Winners</title>
    <link rel="stylesheet" type="text/css" href="style/supabase_combined.css">
    <link rel="stylesheet" type="text/css" href="style/supabase_sidebar.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body oncontextmenu="return false">
    <!-- HEADER -->
    <div id="header-container"></div>
    <script src="js/supabase_header.js"></script>

    <div class="container">
        <div id="sidebar-container" class="sidebar"></div>
        
        <script src="js/supabase_sidebar_debug.js"></script>
        <!-- <script src="js/supabase_sidebar_fetch_all.js"></script> -->
        <!-- <script src="js/supabase_sidebar_fetch_all_fixed.js"></script> -->
        <!-- <script src="js/supabase_sidebar_final.js"></script> -->
        <!-- <script src="js/supabase_sidebar_fixed.js"></script> -->
        <!-- <script src="js/supabase_sidebar_log_years.js"></script> -->
        <!-- <script src="js/supabase_sidebar_pathfixed.js"></script> -->
        <!-- <script src="js/supabase_sidebar_robust_years.js"></script> -->
        

        <div class="main-content">
            <div class="header-bar" style="display: flex; justify-content: flex-end; margin-bottom: 40px; margin-right: 20px;">
                <div style="flex: 1;"></div>
                <div class="sort-controls" style="display: flex; align-items: center; padding-right: 20px;">
                    <label for="sort-options">
                        <i data-lucide="list-filter" style="margin-right: 15px;"></i>
                    </label>
                    <select id="sort-options" style="width: 160px; padding: 5px; font-size: 11px;">
                        <option value="year-desc" selected>Year (desc)</option>
                        <option value="year-asc">Year (asc)</option>
                        <option value="artist">Artist Name</option>
                        <option value="song">Song Title</option>
                        <option value="jury">Jury Points</option>
                        <option value="televote">Televote Points</option>
                        <option value="total">Total Points</option>
                    </select>
                </div>
            </div>

            <div class="grid-container" id="video-container">Loading...</div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="videoModal" onclick="GDriveCloseModal(event)">
        <div class="modal-content">
            <span class="close-button" onclick="GDriveCloseModal(event)">×</span>
            <video autoplay controls controlslist="nodownload" id="modalVideo" style="display: none;" oncontextmenu="return false"></video>
            <iframe allow="autoplay; encrypted-media" frameborder="0" id="modalIframe" style="display: none;" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
    </div>

    <!-- FOOTER -->
    <div id="footer"></div>
    <script src="js/supabase_footer.js" type="text/javascript"></script>
    <script src="js/modal.js" type="text/javascript"></script>
    <script src="js/supabase_sorting.js" type="text/javascript"></script>
    <script src="js/icons.js" type="text/javascript"></script>

    <!-- SUPABASE WINNERS DATA LOADER -->
    <script>

        async function loadWinnersFromSupabase() {
            const { data, error } = await supabase
                .from('douzepoints')
                .select('*')
                .eq('Final_Rank', '1')
                .order('Year', { ascending: false });

            const container = document.getElementById('video-container');

            if (error || !data || data.length === 0) {
                container.innerHTML = `<p style='padding: 20px; color: #ccc;'>No winners found.</p>`;
                return;
            }

            container.innerHTML = '';
            data.forEach(row => {
                const countryCode = row.Country_Code?.toLowerCase();
                const div = document.createElement('div');
                div.className = 'video-item';
                div.setAttribute('data-year', row.Year);
                div.setAttribute('data-artist', row.Artist);
                div.setAttribute('data-song', row.Song);
                div.setAttribute('data-country', row.Country);
                div.setAttribute('data-jury', row.Final_JuryPoints || "0");
                div.setAttribute('data-televote', row.Final_TelevotePoints || "0");
                div.setAttribute('data-total', row.Final_TotalPoints || "0");

                div.innerHTML = `
                    <div class="preview-container">
                        <img src="images/${row.Year}-${countryCode?.toUpperCase()}.jpeg" alt="${row.Artist}"/>
                    </div>
                    <div class="video-title-with-icon" onclick="event.stopPropagation()">
                        <a href="country.html?country=${row.Country}">
                            <img class="flag-icon" src="/flags/${countryCode}.png" alt="Flag">
                        </a>
                        <div class="video-title-text">
                            <b>${row.Artist}</b><br>${row.Song}<br>${row.Year}
                        </div>
                    </div>
                `;
                div.onclick = () => GDriveOpenModalWithVideo(row.Video_URL);
                container.appendChild(div);
            });

            document.getElementById("sort-options").dispatchEvent(new Event("change"));
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadWinnersFromSupabase();
        });
    </script>
</body>
</html>
