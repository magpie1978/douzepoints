<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>DouzePoints | Edition</title>
    <link rel="stylesheet" type="text/css" href="style/supabase_combined.css">
    <link rel="stylesheet" type="text/css" href="style/supabase_sidebar.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body oncontextmenu="return false">
    <!-- HEADER -->
    <div id="header-container"></div>
    <script src="js/supabase_header.js"></script>

    <!-- MAIN CONTAINER -->
    <div class="container">
        <div id="sidebar-container" class="sidebar"></div>

        <div class="main-content">
            <div class="header-bar" style="display: flex; justify-content: flex-end; margin-bottom: 40px; margin-right: 20px;">
                <div style="flex: 1;"></div>
                <div class="sort-controls" style="display: flex; align-items: center; padding-right: 20px;">
                    <label for="sort-options">
                        <i data-lucide="list-filter" style="margin-right: 15px;"></i>
                    </label>
                    <select id="sort-options" style="width: 160px; padding: 5px; font-size: 11px;">
                        <option value="country" selected>Country (A–Z)</option>
                        <option value="country-desc">Country (Z–A)</option>
                        <option value="artist">Artist Name</option>
                        <option value="song">Song Title</option>
                        <option value="jury">Jury Points</option>
                        <option value="televote">Televote Points</option>
                        <option value="total">Total Points</option>
                    </select>
                </div>
            </div>
            <div class="grid-container" id="video-container">Loading videos...</div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="videoModal" onclick="GDriveCloseModal(event)">
        <div class="modal-content">
            <span class="close-button" onclick="GDriveCloseModal(event)">×</span>
            <video autoplay controls controlslist="nodownload" id="modalVideo" style="display: none;" oncontextmenu="return false"></video>
            <iframe allow="autoplay; encrypted-media" frameborder="0" id="modalIframe" style="display: none;" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
    </div>

    <!-- FOOTER -->
    <div id="footer"></div>
    <script src="js/supabase_footer.js" type="text/javascript"></script>
    <script src="js/supabase_modal_fixed_global.js"></script>
    <script src="js/supabase_sorting.js" type="text/javascript"></script>
    <script src="js/supabase_icons.js" type="text/javascript"></script>

    <!-- SUPABASE DATA FETCH USING MODULE -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://eukgodthgusongsbhdwg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1a2dvZHRoZ3Vzb25nc2JoZHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1NjI1NjAsImV4cCI6MjA2NzEzODU2MH0.e8Gm9utDCQWDjSOJgh-VBioCQFX_aAWXz8rzigFgh4s';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadVideosFromSupabase() {
            const edition = new URLSearchParams(window.location.search).get("edition");
            const container = document.getElementById('video-container');

            if (!edition) {
                container.innerHTML = `<p style='padding: 20px;'>No edition specified.</p>`;
                return;
            }

            const { data, error } = await supabase
                .from('douzepoints')
                .select('*')
                .eq('Year', edition)
                .order('Country', { ascending: true });

            if (error) {
                container.innerHTML = `<p style='padding: 20px;'>Error loading videos: ${error.message}</p>`;
                return;
            }

            if (!data || !data.length) {
                container.innerHTML = `<p style='padding: 20px;'>No entries found for edition: ${edition}</p>`;
                return;
            }

            container.innerHTML = '';

            data.forEach(entry => {
                const videoDiv = document.createElement('div');
                videoDiv.className = 'video-item';
                videoDiv.setAttribute('data-country', entry.Country);
                videoDiv.setAttribute('data-artist', entry.Artist);
                videoDiv.setAttribute('data-song', entry.Song);
                videoDiv.setAttribute('data-year', entry.Year);

                const videoUrl = entry.Video_URL;
                const imageUrl = entry.Image || `images/${entry.Year}-${entry.Country_Code}.jpeg`;

                videoDiv.setAttribute('onclick', `GDriveOpenModalWithVideo('${videoUrl}')`);

                videoDiv.innerHTML = `
                    <div class="preview-container">
                        <img alt="${entry.Country} ${entry.Year}" src="${imageUrl}" />
                    </div>
                    <div class="video-title-with-icon">
                        <span class="video-title-text">
                            <strong>${entry.Country}</strong><br/>
                            ${entry.Artist}<br/>
                            <i>${entry.Song}</i>
                        </span>
                    </div>
                `;

                container.appendChild(videoDiv);
            });

            document.getElementById("sort-options").dispatchEvent(new Event("change"));
        }

        loadVideosFromSupabase();
    </script>

    <!-- LOAD SIDEBAR MODULE LAST -->
    <script src="js/supabase_modal_fixed_global.js"></script>
</body>
</html>
