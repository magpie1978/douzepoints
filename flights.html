<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Journey Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Mapbox CSS -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
    rel="stylesheet"
  />

  <!-- Your main CSS -->
  <link rel="stylesheet" href="flight_maps.css" />

  <style>
    /* ---------------------------------
       BASIC LAYOUT
    --------------------------------- */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #page {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ---------------------------------
       TOP FILTER BAR
    --------------------------------- */
    #top-bar {
      height: 56px;
      background: #ffffff;
      color: #000;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      border-bottom: 1px solid #ddd;
      z-index: 10;
    }

    #top-bar label {
      font-size: 13px;
      font-weight: 500;
    }

    #top-bar select,
    #top-bar button {
      padding: 6px 8px;
      font-size: 13px;
    }

    /* ---------------------------------
       MAIN LAYOUT
    --------------------------------- */
    #main-layout {
      display: flex;
      flex: 1;
      min-height: 0; /* critical for flex children */
    }

    /* ---------------------------------
       SIDEBAR
    --------------------------------- */
    #sidebar {
      width: 320px;
      background: #0b0b0b;
      border-right: 1px solid #1a1a1a;
      overflow-y: auto;
      transition: width 0.25s ease;
    }

    #sidebar.collapsed {
      width: 44px;
    }

    #sidebar-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid #1a1a1a;
      background: #0f0f0f;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    #sidebarToggle {
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    #sidebar.collapsed #flightList {
      display: none;
    }

    #flightList {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #flightList li {
      padding: 10px 14px;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
    }

    #flightList li:hover {
      background: #1a1a1a;
    }

    #flightList li.active {
      background: #262626;
    }

    /* ---------------------------------
       MAP WRAPPER
    --------------------------------- */
    #map-wrapper {
      position: relative; /* 🔑 anchor for glass box */
      flex: 1;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* ---------------------------------
       GLASS JOURNEY COUNTER
    --------------------------------- */
    .glass-box {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 5;

      padding: 12px 16px;
      min-width: 110px;

      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);

      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);

      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);

      color: #fff;
      pointer-events: none;
    }

    .glass-number {
      font-size: 26px;
      font-weight: 600;
      line-height: 1;
    }

    .glass-label {
      font-size: 11px;
      opacity: 0.75;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <div id="page">

    <!-- =============================
         TOP FILTER BAR
    ============================== -->
  <div id="top-bar">

    <!-- Year -->
    <div id="filter-year" class="filter">
      <button class="filter-toggle">Year ▾</button>
      <div class="filter-menu">
        <div class="filter-actions">
          <button class="select-all">Select all</button>
          <button class="clear">Clear</button>
        </div>
        <div class="filter-options"></div>
      </div>
    </div>

    <!-- Airline -->
    <div id="filter-airline" class="filter">
      <button class="filter-toggle">Airline ▾</button>
      <div class="filter-menu">
        <div class="filter-actions">
          <button class="select-all">Select all</button>
          <button class="clear">Clear</button>
        </div>
        <div class="filter-options"></div>
      </div>
    </div>

    <!-- Type -->
    <div id="filter-type" class="filter">
      <button class="filter-toggle">Type ▾</button>
      <div class="filter-menu">
        <div class="filter-actions">
          <button class="select-all">Select all</button>
          <button class="clear">Clear</button>
        </div>
        <div class="filter-options"></div>
      </div>
    </div>

    <button id="reloadBtn">Reload</button>
  </div>

    <!-- =============================
         MAIN CONTENT
    ============================== -->
    <div id="main-layout">

      <!-- SIDEBAR -->
      <div id="sidebar">
        <div id="sidebar-header">
          <button id="sidebarToggle">☰</button>
          <span>Journeys</span>
        </div>
        <ul id="flightList"></ul>
      </div>

      <!-- MAP AREA -->
      <div id="map-wrapper">

        <!-- GLASS BOX -->
        <div id="journeyCounter" class="glass-box">
          <div class="glass-number">0</div>
          <div class="glass-label">Journeys</div>
        </div>

        <!-- MAP -->
        <div id="map"></div>

      </div>
    </div>
  </div>

  <!-- Mapbox JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your Map Logic -->
  <script src="flight_maps.js"></script>
</body>
</html>
