<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Journey Statistics</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Shared styles -->
  <link rel="stylesheet" href="flights.css" />

  <style>
    body {
      background: #0f0f0f;
      margin: 0;
    }

    /* ==============================
       STICKY HEADER
    ============================== */
    #statsHeader {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(
        to bottom,
        rgba(15, 15, 15, 0.95),
        rgba(15, 15, 15, 0.85)
      );
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #222;
    }

    .back-link {
      color: #ccc;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      color: #fff;
    }

    .stats-header-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #aaa;
    }

    /* ==============================
       GRID LAYOUT
    ============================== */
    #statsPage {
      max-width: 1800px;
      margin: 0 auto;
      padding: 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 24px;
      height: calc(100vh - 120px); /* adjust if needed */
    }


    .stats-panel {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
    }

    .stats-panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .stats-panel canvas {
      flex: 1;
    }

    /* Placeholder panels */
    .stats-placeholder {
      color: #777;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed #333;
      border-radius: 12px;
      height: 100%;
    }

    .stats-select {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
    }

    .chart-scroll {
      height: 360px;
      overflow-y: auto;
    }

    .airline-chart-scroll {
      height: 360px;              /* controls visible area */
      overflow-y: auto;           /* enables scrollbar */
      padding-right: 8px;         /* room for scrollbar */
    }


  </style>
</head>

<body>

  <!-- ==============================
       HEADER
  ============================== -->
  <header id="statsHeader">
    <a href="flights.html" class="back-link">← Back to map</a>
    <div class="stats-header-title">Journey Statistics</div>
  </header>

  <!-- ==============================
       MAIN GRID
  ============================== -->
  <main id="statsPage">

    <div class="stats-grid">

      <!-- TOP LEFT: Flights per year -->
      <section class="stats-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2 id="chartTitle">Flights by Year</h2>
      
          <select id="metricSelector">
            <option value="flights">Flights</option>
            <option value="miles">Miles</option>
            <option value="airlines">Airlines</option>
            <option value="countries">Countries</option>
          </select>
        </div>
      
        <canvas id="flightsByYearChart"></canvas>
      </section>

      <!-- TOP RIGHT -->
      <section class="stats-panel">
        <div class="stats-card">
          <h3>Flights per Airline by Year</h3>
          <div class="airline-chart-scroll">
            <canvas id="airlineYearChart"></canvas>
          </div>
        </div>
      </section>

      <!-- BOTTOM LEFT -->
      <section class="stats-panel">
        <div class="stats-placeholder">
          (Reserved for next chart)
        </div>
      </section>

      <!-- BOTTOM RIGHT -->
      <section class="stats-panel">
        <div class="stats-placeholder">
          (Reserved for next chart)
        </div>
      </section>

    </div>

  </main>

  <!-- ==============================
       LOGIC
  ============================== -->
  <script src="flights/config.js"></script>
  <script src="flights/charts.js"></script>

</body>
</html>
