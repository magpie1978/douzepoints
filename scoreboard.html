<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <title>DouzePoints | Edition</title>

  <!-- Styles -->
  <link rel="stylesheet" href="style/combined.css" />
  <link rel="stylesheet" href="style/sidebar.css" />
  <link rel="stylesheet" href="style/scoreboard.css" />

  <!-- Icons + Supabase -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- HEADER -->
  <div id="header-container"></div>
  <script type="module" src="js/header.js"></script>

  <div class="main-content">

    <div class="table-aligned-container">
      <h1 id="tableHeader">Eurovision Grand Final - 2025</h1>

      <!-- Controls -->
      <div class="table-controls">
        <label for="yearSelect">Year:</label>
        <select id="yearSelect"></select>

        <label for="stageSelect">Stage:</label>
        <select id="stageSelect">
          <option>Final</option>
          <option>Semi Final 1</option>
          <option>Semi Final 2</option>
        </select>
      </div>

      <!-- Table -->
      <div class="table-wrapper">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="eurovision-table-body"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- MODAL -->
  <div id="video-modal" class="video-modal" style="display:none;">
    <video id="modal-video" width="640" height="360" controls autoplay></video>
  </div>

  <!-- FOOTER -->
  <div id="footer"></div>
  <script src="js/footer.js"></script>
  <script src="js/modal.js"></script>

  <div id="modal-container"></div>


  <!-- Scoreboard JS -->
  <script type="module" src="js/scoreboard.js"></script>

  <!-- Modal Logic -->
  <script>
    document.addEventListener('click', function (e) {
      const modal = document.getElementById('video-modal');
      const video = document.getElementById('modal-video');

      if (e.target.classList.contains('video-trigger')) {
        video.src = e.target.getAttribute('data-url');
        modal.style.display = 'block';
      } 
      else if (!e.target.closest('#video-modal')) {
        video.pause();
        modal.style.display = 'none';
      }
    });
  </script>

</body>
</html>
