<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Eurovision Results</title>
<link href="https://fonts.googleapis.com/css?family=Raleway:400,600&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="style/scoreboard.css" rel="stylesheet" type="text/css"/>
<link href="style/footer.css" rel="stylesheet" type="text/css"/>
<link href="style/modal.css" rel="stylesheet" type="text/css"/>
</head>
<body>
<div id="header-container"></div>
<script src="js/header.js"></script>
<br/><br/>
<div class="table-wrapper">
<div class="table-header-row"><div class="table-header" id="tableHeader"></div><div class="table-controls">
<label for="yearSelect">Year:</label>
<select id="yearSelect"></select>
<label for="stageSelect">Stage:</label>
<select id="stageSelect">
<option selected="" value="Final">Final</option>
<option value="Semi Final 1">Semi Final 1</option>
<option value="Semi Final 2">Semi Final 2</option>
</select>
</div></div>
<table>
<thead id="tableHead"></thead>
<tbody id="eurovision-table-body"></tbody>
</table>
</div>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<div id="footer"></div>
<script src="js/scoreboard.js" type="text/javascript"></script>
<script src="js/footer.js" type="text/javascript"></script>
<!-- MODAL -->
<div class="modal" id="videoModal" onclick="GDriveCloseModal(event)">
<div class="modal-content">
<span class="close-button" onclick="GDriveCloseModal(event)">×</span>
<video autoplay="" controls="" controlslist="nodownload" id="modalVideo" oncontextmenu="return false" style="display: none;"></video>
<iframe allow="autoplay; encrypted-media" frameborder="0" id="modalIframe" sandbox="allow-scripts allow-same-origin" style="display: none;"></iframe>
</div>
</div>
<script src="js/modal.js" type="text/javascript"></script>
</body>
</html>
