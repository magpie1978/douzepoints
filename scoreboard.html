<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eurovision Scoreboard</title>
  
    <!-- favicons  -->
    <link rel="icon" type="image/png" sizes="16x16" href="banners/favicon-circle-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="banners/favicon-circle-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="banners/favicon-circle-180.png">
    <link rel="icon" type="image/x-icon" href="banners/favicon-circle.ico">
  
    <!-- Styles -->
    <link rel="stylesheet" href="style/header.css" />
    <link rel="stylesheet" href="style/combined.css" />
    <link rel="stylesheet" href="style/scoreboard.css" />
    <link rel="stylesheet" href="style/footer.css" />
  
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  </head>
  
  <body>
  
    <!-- HEADER -->
    <div id="header-container"></div>
    <script type="module" src="js/header.js"></script>
  
    <!-- MAIN CONTENT -->
    <div class="main-content">
  
      <div class="table-aligned-container">
        <h1 id="tableHeader">Eurovision Grand Final - 2025</h1>
  
        <!-- FILTER CONTROLS -->
        <div class="table-controls">
          <label for="yearSelect">Year:</label>
          <select id="yearSelect"></select>
  
          <label for="stageSelect">Stage:</label>
          <select id="stageSelect">
            <option>Final</option>
            <option>Semi Final 1</option>
            <option>Semi Final 2</option>
          </select>
        </div>
  
        <!-- TABLE -->
        <div class="table-wrapper">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="eurovision-table-body"></tbody>
          </table>
        </div>
      </div>
  
    </div>
  
    <!-- MODAL  -->
    <script src="js/modal.js"></script>
    <div id="modal-container"></div>
  
    <!-- SCOREBOARD LOGIC -->
    <script type="module" src="js/scoreboard.js"></script>
  
    <!-- FOOTER -->
    <div id="footer"></div>
    <script src="js/footer.js"></script>
  
  </body>
</html>
