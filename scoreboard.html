<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eurovision Scoreboard</title>

  <!-- Shared Header styling -->
  <link rel="stylesheet" href="style/header.css">

  <!-- Page-specific styles -->
  <link rel="stylesheet" href="style/scoreboard.css">
  <link rel="stylesheet" href="style/combined.css">
  <link rel="stylesheet" href="style/footer.css">

  <!-- Header -->
  <script type="module" src="js/header.js"></script>

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <!-- Header container -->
  <div id="header-container"></div>

  <div class="main-content">
    <h1 id="tableHeader">Eurovision Grand Final - 2025</h1>

    <div class="table-controls">
      <label for="yearSelect">Year:</label>
      <select id="yearSelect"></select>

      <label for="stageSelect">Stage:</label>
      <select id="stageSelect">
        <option>Final</option>
        <option>Semi Final 1</option>
        <option>Semi Final 2</option>
      </select>
    </div>

    <div class="table-wrapper">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="eurovision-table-body"></tbody>
      </table>
    </div>
  </div>

  <!-- GLOBAL MODAL (same as all pages) -->
  <script src="js/modal.js"></script>
  <div id="modal-container"></div>

  <!-- Shared video logic -->
  <script type="module" src="js/video.js"></script>

  <!-- Scoreboard logic -->
  <script type="module" src="js/scoreboard.js"></script>

  <!-- Footer -->
  <div id="footer"></div>
  <script src="js/footer.js"></script>

  
</body>
</html>
