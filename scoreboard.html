<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eurovision Results</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:400,600&display=swap"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" type="text/css" href="style/combined.css">
  <style>
    body {
      font-family: 'Raleway', sans-serif;
      background: #0f111a;
      color: #ccc;
      margin: 0;
      padding: 20px;
    }

    .container {
      display: flex;
    }


/* HEADER BANNER */
.banner-divider {
  width: 100%;
  height: 1px;
  background-color: #e50914;
  }


.banner-static {
  width: 100%;
  height: 400px;
  overflow: hidden;
 
}

.banner-static img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}      

.header-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 20px;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: center;
} 

.home-link {
  color: #fff;
  font-size: 1rem;
  font-weight: bold;
  text-decoration: none;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 20px;
}

.header-links {
  display: flex;
  gap: 20px;
}

.header-links a {
  color: #fff;
  font-size: 1rem;
  font-weight: bold;
  text-decoration: none;
}

.header-links a:hover {
  color: #e50914;
}

.banner-text {
  position: absolute;
  bottom: 30px;
  left: 30px;
  text-align: left;
  color: black;
  z-index: 3;
  padding: 1rem;
  background: rgba(255, 255, 255, 0.7);
  border-radius: 8px;
}

.main-content {
  flex-grow: 1;
  padding: 20px;
}

    .table-wrapper {
      max-width: 1280px;
      margin: auto;
      background: #181a24;
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .table-controls {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      padding: 10px 20px;
    }

    .table-header {
      padding: 20px;
      font-size: 16px;
      font-weight: 600;
      border-bottom: 1px solid #2a2d3a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 16px;
      font-size: 13px;
      border-bottom: 1px solid #2a2d3a;
      text-align: left;
    }

    thead {
      background: #1f212d;
      cursor: pointer;
    }

    th {
      color: #aaa;
      font-weight: 500;
      user-select: none;
    }

    th.sort-asc::after,
    th.sort-desc::after {
      display: inline-block;
      margin-left: 6px;
      font-size: 12px;
      vertical-align: middle;
    }

    th.sort-asc::after { content: "▲"; }
    th.sort-desc::after { content: "▼"; }

    th[data-key="Televote Rank"],
    th[data-key="Televote Pts"],
    th[data-key="Jury Rank"],
    th[data-key="Jury Pts"],
    th[data-key="Total Points"],
    td.televote-rank,
    td.televote-pts,
    td.jury-rank,
    td.jury-pts,
    td.total-pts {
      text-align: center;
    }

    .flag {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 12px;
      vertical-align: middle;
    }

    .country-name {
      vertical-align: middle;
    }

    .badge {
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 6px;
      display: inline-block;
      white-space: nowrap;
    }

    .winner  { background: #28a74530; color: #28a745; }
    .qualified { background: #007bff30; color: #339af0; }
    .dnq { background: #dc354530; color: #dc3545; }

    select {
      background: #1f212d;
      color: #ccc;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 14px;
    }

    th.divider-right,
    td.divider-right {
      border-right: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .play-icon {
      text-align: center;
    }

    .play-icon i {
      font-size: 16px;
      color: #e50914;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .play-icon i:hover {
      transform: scale(1.2);
    }
  </style>
</head>

  <body>

  <!-- HEADER -->
        <div id="header-container"></div>
        <script src="js/header.js"></script>


  
<div class="table-wrapper">
  <div class="table-controls">
    <label for="yearSelect" style="color: #aaa;">Year:</label>
    <select id="yearSelect"></select>

    <label for="stageSelect" style="color: #aaa;">Stage:</label>
    <select id="stageSelect">
      <option value="Final" selected>Final</option>
      <option value="Semi Final 1">Semi Final 1</option>
      <option value="Semi Final 2">Semi Final 2</option>
    </select>
  </div>

  <div id="tableHeader" class="table-header">Eurovision Grand Final Entries (2025)</div>
  <table>
    <thead id="tableHead"></thead>
    <tbody id="eurovision-table-body"></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>


  <div id="footer"></div>
  <script src="js/scoreboard.js" type="text/javascript"></script>
  <script src="js/footer.js" type="text/javascript"></script>

<!-- MODAL -->
<div class="modal" id="videoModal" onclick="GDriveCloseModal(event)">
  <div class="modal-content">
    <span class="close-button" onclick="GDriveCloseModal(event)">×</span>
    <video autoplay controls controlslist="nodownload" id="modalVideo" style="display: none;" oncontextmenu="return false"></video>
    <iframe allow="autoplay; encrypted-media" frameborder="0" id="modalIframe" style="display: none;" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>
</div>

<script src="js/modal.js" type="text/javascript"></script>
</body>
</html>
