<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eurovision Scoreboard</title>

  <!-- Styles -->
  <link rel="stylesheet" href="style/combined.css" />
  <link rel="stylesheet" href="style/scoreboard.css" />
  <link rel="stylesheet" href="style/footer.css" />
  <script src="/js/favicons.js"></script>

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  
  <!-- GOOGLE ADSENSE SCRIPT -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1056703456722687" crossorigin="anonymous"></script>
  

</head>


    <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9BDCDNFMGG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  
    gtag('config', 'G-9BDCDNFMGG');
  </script>

  <body>
  
    <!-- HEADER -->
    <div id="header-container"></div>
    <script type="module" src="js/header_new.js"></script>
  
    <!-- MAIN CONTENT -->
    <div class="main-content">
  
      <div class="table-aligned-container">
  
        <!-- HEADER TEXT + DROPDOWNS ROW -->
        <div class="table-header-row">
          <h1 id="tableHeader"></h1>
  
          <!-- FILTER CONTROLS -->
          <div class="table-controls">
  
            <div class="control-block">
              <center><label for="yearSelect">Year</label></center>
              <select id="yearSelect"></select>
            </div>
  
            <div class="control-block">
              <center><label for="stageSelect">Stage</label></center>
              <select id="stageSelect">
                <option>Final</option>
                <option>Semi Final 1</option>
                <option>Semi Final 2</option>
              </select>
            </div>
          </div>
        </div>
  
        <!-- TABLE -->
        <div class="table-wrapper">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="eurovision-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  
    <!-- UNIVERSAL MODAL SYSTEM -->
    <script src="js/modal.js"></script>
    <div id="modal-container"></div>
  
    <!-- SCOREBOARD LOGIC -->
    <script type="module" src="js/scoreboard.js"></script>
  
    <!-- FOOTER -->
    <div id="footer"></div>
    <script src="js/footer.js"></script>
  
  </body>
</html>
