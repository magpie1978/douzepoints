<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DouzePoints Table</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    form {
      margin-bottom: 20px;
      padding: 10px;
      background: #f8f8f8;
      border: 1px solid #ccc;
    }
    form input {
      margin-right: 10px;
      padding: 5px;
    }
    form button {
      padding: 5px 10px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f5f5f5;
    }
    #filter-container {
      margin-bottom: 15px;
    }
    button {
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <h1>DouzePoints Table</h1>

  <form id="add-form">
    <label><strong>Add New Row:</strong></label><br/>
    Year: <input type="number" id="newYear" required />
    Country: <input type="text" id="newCountry" required />
    Artist: <input type="text" id="newArtist" required />
    Song: <input type="text" id="newSong" required />
    <button type="submit">Add Row</button>
  </form>

  <div id="filter-container">
    <label for="yearFilter">Filter by Year:</label>
    <select id="yearFilter">
      <option value="All">All</option>
    </select>
  </div>

  <div id="table-container">Loading...</div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const SUPABASE_URL = 'https://eukgodthgusongsbhdwg.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1a2dvZHRoZ3Vzb25nc2JoZHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1NjI1NjAsImV4cCI6MjA2NzEzODU2MH0.e8Gm9utDCQWDjSOJgh-VBioCQFX_aAWXz8rzigFgh4s';

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const tableContainer = document.getElementById('table-container');
      const yearFilter = document.getElementById('yearFilter');

      async function loadYears() {
        const { data, error } = await supabase.from('douzepoints').select('Year');
        if (error) {
          tableContainer.innerHTML = `<p>Error loading years: ${error.message}</p>`;
          return;
        }
        const years = [...new Set(data.map(row => row.Year).filter(y => y != null))].sort((a, b) => b - a);
        yearFilter.innerHTML = '<option value="All">All</option>';
        years.forEach(year => {
          const option = document.createElement('option');
          option.value = year;
          option.textContent = year;
          yearFilter.appendChild(option);
        });
      }

      async function loadTable(year = 'All') {
        let query = supabase.from('douzepoints').select('*');
        if (year !== 'All') query = query.eq('Year', year);

        const { data, error } = await query;
        if (error) {
          tableContainer.innerHTML = `<p>Error loading table: ${error.message}</p>`;
          return;
        }

        if (!data.length) {
          tableContainer.innerHTML = `<p>No rows found for year ${year}.</p>`;
          return;
        }

        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const tbody = document.createElement('tbody');

        const keys = Object.keys(data[0]);
        const headerRow = document.createElement('tr');
        keys.forEach(key => {
          const th = document.createElement('th');
          th.textContent = key;
          headerRow.appendChild(th);
        });
        const actionTh = document.createElement('th');
        actionTh.textContent = 'Actions';
        headerRow.appendChild(actionTh);
        thead.appendChild(headerRow);

        data.forEach(row => {
          const tr = document.createElement('tr');

          keys.forEach(key => {
            const td = document.createElement('td');
            td.textContent = row[key];
            td.contentEditable = false;
            td.dataset.key = key;
            tr.appendChild(td);
          });

          const actionTd = document.createElement('td');

          const deleteBtn = document.createElement('button');
          deleteBtn.textContent = 'Delete';
          deleteBtn.onclick = async () => {
            await supabase.from('douzepoints').delete().eq('id', row.id);
            tr.remove();
          };

          const amendBtn = document.createElement('button');
          amendBtn.textContent = 'Amend';
          let editing = false;

          amendBtn.onclick = async () => {
            const cells = tr.querySelectorAll('td[data-key]');
            if (!editing) {
              cells.forEach(td => td.contentEditable = true);
              amendBtn.textContent = 'Save';
              editing = true;
            } else {
              const updates = {};
              cells.forEach(td => {
                updates[td.dataset.key] = td.textContent;
              });

              await supabase.from('douzepoints').update(updates).eq('id', row.id);
              cells.forEach(td => td.contentEditable = false);
              amendBtn.textContent = 'Amend';
              editing = false;
            }
          };

          actionTd.appendChild(deleteBtn);
          actionTd.appendChild(amendBtn);
          tr.appendChild(actionTd);
          tbody.appendChild(tr);
        });

        table.appendChild(thead);
        table.appendChild(tbody);
        tableContainer.innerHTML = '';
        tableContainer.appendChild(table);
      }

      // Filter listener
      yearFilter.addEventListener('change', () => {
        loadTable(yearFilter.value);
      });

      // Form submission listener
      const addForm = document.getElementById('add-form');
      addForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const newYear = document.getElementById('newYear').value;
        const newCountry = document.getElementById('newCountry').value;
        const newArtist = document.getElementById('newArtist').value;
        const newSong = document.getElementById('newSong').value;

        const { error } = await supabase.from('douzepoints').insert([
          {
            Year: parseInt(newYear),
            Country: newCountry,
            Artist: newArtist,
            Song: newSong
          }
        ]);

        if (error) {
          alert('Error adding row: ' + error.message);
        } else {
          addForm.reset();
          await loadYears(); // update dropdown
          await loadTable(yearFilter.value); // reload filtered view
        }
      });

      // Initial load
      await loadYears();
      await loadTable();
    });
  </script>
</body>
</html>
