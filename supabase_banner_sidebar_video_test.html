
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Test | Supabase Header + Sidebar + Video</title>
  <link rel="stylesheet" href="style/combined.css">
  <link rel="stylesheet" href="style/sidebar.css">

  <!-- Supabase Setup -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://eukgodthgusongsbhdwg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1a2dvZHRoZ3Vzb25nc2JoZHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1NjI1NjAsImV4cCI6MjA2NzEzODU2MH0.e8Gm9utDCQWDjSOJgh-VBioCQFX_aAWXz8rzigFgh4s';
    window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body oncontextmenu="return false">

  <!-- HEADER -->
  <header class="main-header">
    <div class="banner-static">
      <img alt="Banner" id="country-banner" src="" />
    </div>
  </header>

  <script>
    // Load banner for "Austria"
    document.addEventListener("DOMContentLoaded", async () => {
      const country = "Austria";
      const banner = document.getElementById("country-banner");

      const { data, error } = await supabase
        .from("douzepoints")
        .select("Country_Code")
        .ilike("Country", country)
        .limit(1);

      if (data?.length) {
        const code = data[0].Country_Code.toLowerCase();
        banner.src = `/banners/${code}.png`;
        banner.alt = country;
        console.log("✅ Banner set to", banner.src);
      }
    });
  </script>

  <!-- MAIN CONTAINER -->
  <div class="container">
    <!-- SIDEBAR -->
    <div id="sidebar-container" class="sidebar"></div>
    <script src="js/sidebar_supabase_fetch_all.js"></script>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      <div style="padding: 20px;">
        <h3>Video Preview</h3>
        <div class="grid-container" id="video-container">Loading video...</div>
      </div>
    </div>
  </div>

  <!-- VIDEO LOADER -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const country = "Austria";
      const { data, error } = await supabase
        .from('douzepoints')
        .select('*')
        .eq('Country', country)
        .order('Year', { ascending: false });

      const container = document.getElementById("video-container");
      if (error || !data?.length) {
        container.innerHTML = "<p style='color: red;'>No videos found.</p>";
        return;
      }

      const row = data[0];
      const countryCode = row.Country_Code?.toLowerCase();

      const div = document.createElement("div");
      div.className = "video-item";
      div.innerHTML = `
        <div class="preview-container">
          <img src="images/${row.Year}-${countryCode?.toUpperCase()}.jpeg" alt="${row.Artist}" />
        </div>
        <div class="video-title-with-icon">
          <img class="flag-icon" src="/flags/${countryCode}.png" alt="Flag" />
          <div class="video-title-text">
            <b>${row.Artist}</b><br>${row.Song}<br>${row.Year}
          </div>
        </div>
      `;
      container.innerHTML = "";
      container.appendChild(div);
    });
  </script>

</body>
</html>
