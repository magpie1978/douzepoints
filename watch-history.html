<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watch History</title>
<link rel="stylesheet" href="style/combined.css">
<script src="js/supabaseClient.js"></script>
<script src="js/header.js" defer></script>
<script src="js/footer.js" defer></script>
</head>
<body>
<div id="header-container"></div>
<main class="main-content">

  <h2 class="page-title">My Watch History</h2>

  <!-- SUMMARY PANEL (STATS FROM VIEW) -->
  <div id="wh-summary" class="wh-summary-panel">
    <div class="stat-box">
      <div class="stat-value" id="total-videos-watched">0</div>
      <div class="stat-label">Videos Watched</div>
    </div>

    <div class="stat-box">
      <div class="stat-value" id="total-views">0</div>
      <div class="stat-label">Total Views</div>
    </div>

    <div class="stat-box">
      <div class="stat-value" id="total-watch-time">0m</div>
      <div class="stat-label">Total Watch Time</div>
    </div>
  </div>

  <!-- SCOREBOARD STYLE TABLE -->
  <table id="watch-table" class="scoreboard-table wh-table">
    <thead>
      <tr>
        <th>Video</th>
        <th>Artist</th>
        <th>Song</th>
        <th>Country</th>
        <th>Views</th>
        <th>Watch Time</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<script type="module" src="js/watch-history.js"></script>
<div id="footer"></div>
</body>
</html>
