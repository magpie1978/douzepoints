name: Generate Country SEO Preview

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Sweden test page
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python generate_country_seo.py
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: country-seo-preview
          path: seo-preview/
