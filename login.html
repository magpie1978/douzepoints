<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | DouzePoints</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style/combined.css" />

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Raleway', sans-serif;
      color: #fff;

      /* NEW: Full-page background image */
      background: url("banners/login.png") no-repeat center center fixed;
      background-size: cover;

      /* Dark overlay for readability */
      position: relative;
    }

    /* Dark overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      pointer-events: none;
      z-index: 0;
    }

    /* Remove old header image area */
    .header-image {
      display: none;
    }

    /* LOGIN BOX */
    .login-container {
      position: relative;
      z-index: 2;

      max-width: 420px;
      margin: 120px auto 30px auto;

      background: rgba(0,0,0,0.55);
      padding: 40px 35px;
      border-radius: 12px;

      backdrop-filter: blur(6px);
      box-shadow: 0 0 26px rgba(0,0,0,0.4);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      background: #1f212d;
      color: white;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #e50914;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #f6121d;
    }

    .toggle-link {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      cursor: pointer;
      color: #e50914;
    }
  </style>
</head>

<body>

  <div class="login-container">
    
    <!-- LOGIN -->
    <div id="loginBox">
      <h2>Sign in to DouzePoints</h2>

      <input type="email" id="loginEmail" placeholder="Email address">
      <input type="password" id="loginPassword" placeholder="Password">

      <button id="loginBtn">Sign In</button>

      <div class="toggle-link" onclick="showSignUp()">New user? Create an account</div>
    </div>

    <!-- SIGN-UP -->
    <div id="signupBox" style="display:none;">
      <h2>Create Account</h2>

      <input type="email" id="signupEmail" placeholder="Email address">
      <input type="password" id="signupPassword" placeholder="Password">
      <input type="text" id="signupName" placeholder="Display name (optional)">

      <button id="signupBtn">Sign Up</button>

      <div class="toggle-link" onclick="showLogin()">Already have an account? Sign in</div>
    </div>

  </div>


  <script type="module">
    import { supabase } from './js/supabaseClient.js';

    // SHOW SIGN-UP / LOGIN
    window.showSignUp = () => {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("signupBox").style.display = "block";
    };

    window.showLogin = () => {
      document.getElementById("signupBox").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
    };

    /* ----------------------------------------
       LOGIN LOGIC
    ----------------------------------------- */
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        alert("Login failed: " + error.message);
        return;
      }

      window.location.href = "index.html";
    });

    /* ----------------------------------------
       SIGN-UP LOGIC
    ----------------------------------------- */
    document.getElementById("signupBtn").addEventListener("click", async () => {
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value.trim();
      const displayName = document.getElementById("signupName").value.trim();

      const { data, error } = await supabase.auth.signUp({ email, password });

      if (error) {
        alert("Sign-up failed: " + error.message);
        return;
      }

      const user = data.user;

      const { error: insertError } = await supabase
        .from("users")
        .insert({
          id: user.id,
          email: user.email,
          display_name: displayName || null,
          subscription_level: "basic"
        });

      if (insertError) {
        alert("Account created but failed to save profile.");
      }

      alert("Account created! Please verify your email.");
      showLogin();
    });

  </script>

</body>
</html>
