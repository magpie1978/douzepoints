<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DouzePoints Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0f111a;
      color: #ccc;
      font-family: 'Raleway', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: #1c1f2a;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.4);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #fff;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 6px;
      background: #2a2d3d;
      color: #eee;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #e50914;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #b00610;
    }

    #auth-status {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #90ee90;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login or Sign Up</h2>
    <form id="auth-form">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Continue</button>
    </form>
    <p id="auth-status"></p>
  </div>

  <script>
    const SUPABASE_URL = 'https://eukgodthgusongsbhdwg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1a2dvZHRoZ3Vzb25nc2JoZHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1NjI1NjAsImV4cCI6MjA2NzEzODU2MH0.e8Gm9utDCQWDjSOJgh-VBioCQFX_aAWXz8rzigFgh4s';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ✅ Redirect if already logged in
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        window.location.href = 'supabase.html';
      }
    });

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const status = document.getElementById('auth-status');

      // Try logging in
      let { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error && error.message === 'Invalid login credentials') {
        // If user doesn't exist, try signing up
        ({ error } = await supabase.auth.signUp({ email, password }));
        if (error) {
          status.textContent = 'Signup failed: ' + error.message;
          status.style.color = 'red';
          return;
        }
        status.textContent = 'Signup successful! Check your email.';
        status.style.color = 'lightgreen';
      } else if (error) {
        status.textContent = 'Login error: ' + error.message;
        status.style.color = 'red';
        return;
      } else {
        status.textContent = 'Login successful! Redirecting...';
        status.style.color = 'lightgreen';

        // Ensure session is available before redirect
        const { data: sessionData } = await supabase.auth.getSession();
        if (sessionData.session) {
          window.location.href = 'supabase.html';
        } else {
          status.textContent = 'Could not verify session.';
          status.style.color = 'orange';
        }
      }
    });
  </script>
</body>
</html>
