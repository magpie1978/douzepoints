<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DouzePoints Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0f111a;
      color: #ccc;
      font-family: 'Raleway', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: #1c1f2a;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.4);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #fff;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 6px;
      background: #2a2d3d;
      color: #eee;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #e50914;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #b00610;
    }

    #auth-status {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #90ee90;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login or Sign Up</h2>
    <form id="auth-form">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Continue</button>
    </form>
    <p id="auth-status"></p>
  </div>

</body>
</html>
