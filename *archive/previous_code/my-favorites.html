<!DOCTYPE html>
<html lang="en">
<head>

  <!-- favicons  -->
    <link rel="icon" type="image/png" sizes="16x16" href="banners/favicon-circle-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="banners/favicon-circle-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="banners/favicon-circle-180.png">
    <link rel="icon" type="image/x-icon" href="banners/favicon-circle.ico">

  
  <meta charset="utf-8" />
  <title>My Favorites</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Core styles -->
  <link rel="stylesheet" href="style/combined_old.css">
  <link rel="stylesheet" type="text/css" href="style/video-cards.css">
  <link rel="stylesheet" type="text/css" href="style/favorites.css">
  <link rel="stylesheet" href="style/sidebar.css">
  <link rel="stylesheet" href="style/playlist.css">

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="favorites-page" oncontextmenu="return false">

  <!-- HEADER -->
  <div id="header-container"></div>

  <div class="container">

    <!-- PLAYLIST SIDEBAR -->
    <aside id="playlist-sidebar">
      <h3>My Playlists</h3>
      <ul class="playlist-list" id="playlist-list">
        <!-- Populated by my-favorites.js -->
      </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <!-- This title changes based on selected playlist -->
        <h2 id="playlist-title">All My Favorites</h2>
      </div>

      <div id="video-container" class="grid-container"></div>
    </main>
  </div>

  <!-- VIDEO MODAL CONTAINER (used by modal.js / video.js) -->
  <div id="modal-container"></div>

  <!-- FOOTER -->
  <div id="footer"></div>

  
  <!-- CREATE / ADD-TO PLAYLIST MODAL (glass) -->
  <div id="playlist-create-overlay" class="glass-overlay">
    <div class="glass-modal">
      <h4>Create or Add to Playlist</h4>

      <!-- Dropdown of existing playlists -->
      <label for="playlist-select" style="color:white; font-size:14px; display:block; margin-bottom:6px;">
      Select playlist:
      </label>
      <select id="playlist-select" class="playlist-select">
        <!-- Populated dynamically by my-favorites.js -->
        <option value="new">➕ Create new playlist…</option>
      </select>

      <!-- Hidden textbox for "Create new playlist" -->
      <div id="new-playlist-wrapper" style="display:none; margin-top:14px;">
        <label for="new-playlist-name" style="color:white; font-size:14px; display:block; margin-bottom:6px;">
        New playlist name:
        </label>
        <input
          id="new-playlist-name"
          type="text"
          placeholder="Enter playlist name..."
        />
      </div>

      <div class="glass-modal-buttons" style="margin-top:20px;">
        <button class="glass-btn cancel" id="playlist-cancel-btn">Cancel</button>
        <button class="glass-btn" id="playlist-save-btn">Save</button>
      </div>
    </div>
  </div>


  <!-- RENAME PLAYLIST MODAL (glass) -->
  <div id="rename-modal-overlay" class="glass-overlay">
    <div class="glass-modal">
      <h4>Rename Playlist</h4>
      <input id="rename-input" type="text" placeholder="New playlist name..." />
      <div class="glass-modal-buttons">
        <button class="glass-btn cancel" id="rename-cancel-btn">Cancel</button>
        <button class="glass-btn" id="rename-save-btn">Save</button>
      </div>
    </div>
  </div>

  <!-- DELETE PLAYLIST MODAL (glass) -->
  <div id="delete-modal-overlay" class="glass-overlay">
    <div class="glass-modal">
      <h4>Delete Playlist?</h4>
      <p style="opacity:0.8; margin-bottom:18px;">
        This will remove the playlist, but videos will remain in your favourites.
      </p>
      <div class="glass-modal-buttons">
        <button class="glass-btn cancel" id="delete-cancel-btn">Cancel</button>
        <button class="glass-btn danger" id="delete-confirm-btn">Delete</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS (order matters) -->
  <script src="js/supabaseClient.js"></script>
  <script type="module" src="js/modal.js"></script>
  <link rel="stylesheet" type="text/css" href="style/footer.css">
  <script src="js/footer.js"></script>
  <script type="module" src="js/header.js"></script>
  <script type="module" src="js/video_test.js"></script>
  <script type="module" src="js/my-favorites.js"></script>
</body>
</html>
