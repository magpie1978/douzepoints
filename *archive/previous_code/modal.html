<div id="dpModalOverlay" class="dp-modal-overlay hidden">
    <div class="dp-modal">

        <!-- Close Button -->
        <button class="dp-close-btn" id="dpCloseBtn">×</button>

        <!-- Title -->
        <div class="dp-modal-title" id="dpModalTitle"></div>

        <!-- Video / Iframe wrapper -->
        <div class="dp-video-wrapper">
            <video id="dpVideo" class="dp-video" controls playsinline></video>
            <iframe id="dpIframe" class="dp-iframe" allow="autoplay"></iframe>
        </div>

    </div>
</div>
