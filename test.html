<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test Video Modal</title>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .video-item { cursor: pointer; background: #222; padding: 10px; border-radius: 8px; width: 300px; }
    .preview-container img { width: 100%; border-radius: 6px; }
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0; top: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      position: relative;
      max-width: 100%;
      max-height: 100%;
    }
    .modal-content video,
    .modal-content iframe {
      width: 81vw;
      height: 81vh;
    }
    .modal-title-bar {
      position: absolute;
      top: -50px;
      left: 0;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 6px;
    }
    .close-button {
      position: absolute;
      top: -40px;
      right: -40px;
      font-size: 36px;
      color: white;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border-radius: 50%;
      z-index: 10000;
    }
    .close-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="grid">

    <!-- Google Drive -->
    <div class="video-item" onclick="GDriveOpenModalWithVideo('https://drive.google.com/file/d/1o6AnTVJ5m6cglxTOS4o-U-LtFbg9Nflt/', 'Malmö 2024 Opening Ceremony')">
      <div class="preview-container">
        <img src="https://drive.google.com/thumbnail?id=1gL6Dw4mkcKztOf0FAJ69zm6KQQm5L11y" alt="Malmö 2024">
      </div>
    </div>
    
    <!-- 2024 -->
    <div class="video-item" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2024/videos/2024-AL.mp4')">
      <div class="preview-container" onmouseover="showPreview(this)" onmouseout="hidePreview(this)">
        <img src="https://euroflix.s3.eu-north-1.amazonaws.com/2024/thumbs/2024-AL.jpeg" alt="Albania 2024">
        <video src="https://euroflix.s3.eu-north-1.amazonaws.com/2024/videos/2024-AL.mp4" muted loop></video>
      </div>
      <div class="video-title-with-icon" onclick="event.stopPropagation()">
        <a href="albania.html">
          <img class="icon-placeholder" src="https://euroflix.s3.eu-north-1.amazonaws.com/flags/al.png" alt="Flag">
        </a>
        <div class="video-title-text"><b>Besa</b><br>Titan<br>2024</div>
      </div>
    </div>

  </div>

  <!-- Modal -->
  <div id="videoModal" class="modal" onclick="GDriveCloseModal(event)">
    <div class="modal-content">
      <div id="modalTitle" class="modal-title-bar"></div>
      <span class="close-button" onclick="GDriveCloseModal(event)">&times;</span>
      <video id="modalVideo" controls autoplay controlsList="nodownload" style="display: none;"></video>
      <iframe id="modalIframe" style="display: none;" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    function GDriveOpenModalWithVideo(videoUrl, titleText) {
      const modal = document.getElementById("videoModal");
      const video = document.getElementById("modalVideo");
      const iframe = document.getElementById("modalIframe");
      const titleBar = document.getElementById("modalTitle");

      modal.style.display = "flex";

      video.style.display = "none";
      iframe.style.display = "none";
      video.pause();
      iframe.src = "";
      titleBar.textContent = titleText || '';

      if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
        let videoId = '';
        try {
          if (videoUrl.includes('youtu.be')) {
            videoId = videoUrl.split('/').pop().split('?')[0];
          } else {
            const url = new URL(videoUrl);
            videoId = url.searchParams.get('v');
          }
        } catch (e) {
          console.error('Invalid YouTube URL:', videoUrl);
        }
        if (videoId) {
          iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
          iframe.style.display = "block";
        }
      } else if (videoUrl.includes('drive.google.com')) {
        let fileId = '';
        try {
          const url = new URL(videoUrl);
          const match = url.pathname.match(/\/d\/([^/]+)/);
          if (match && match[1]) {
            fileId = match[1];
          }
        } catch (e) {
          console.error('Invalid Google Drive URL:', videoUrl);
        }
        if (fileId) {
          iframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
          iframe.style.display = "block";
        }
      } else {
        video.src = videoUrl;
        video.style.display = "block";
        video.play();
      }
    }

    function GDriveCloseModal(event) {
      event.stopPropagation();
      const modal = document.getElementById("videoModal");
      const video = document.getElementById("modalVideo");
      const iframe = document.getElementById("modalIframe");

      video.pause();
      video.src = "";
      iframe.src = "";

      modal.style.display = "none";
    }
  </script>
</body>
</html>
