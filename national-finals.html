        -->

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const params = new URLSearchParams(window.location.search);
  const country = params.get("country");
  const edition = params.get("year");

  if (!country) return;

  let query = window.supabaseClient
  .from("douzepoints_finland")
  .select("Contest, Year")
  .eq("country", country);

  if (edition) {
    query = query.eq("Year", edition);
  } else {
    query = query.order("Year", { ascending: false }).limit(1);
  }

  const { data, error } = await query;

  if (error || !data || data.length === 0) return;

  const contestName = data[0].Contest;
  const year = data[0].Year;

  document.title = `${contestName} ${year} Results | DouzePoints`;
});
</script>
