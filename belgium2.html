<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Belgian Royal Family — Family Tree</title>
<style>
  :root {
    --bg: #0f111a;
    --card: #1a1d29;
    --text: #e6e6e6;
    --muted: #9aa0a6;
    --accent: #e50914;
    --line: #6b7280;
    --radius: 16px;
  }
  html, body {
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
  }
  .page {
    max-width: 1200px;
    margin: 24px auto;
    padding: 0 16px 64px;
    position: relative;
  }
  h1 {
    font-weight: 700;
    letter-spacing: 0.3px;
    margin: 0 0 8px;
  }
  .subtitle{
    color: var(--muted);
    margin-bottom: 24px;
  }

  /* Tree layout */
  .tree {
    position: relative;
  }
  .connections {
    position:absolute;
    inset:0;
    pointer-events: none;
    z-index: 0;
  }

  /* Each generation row */
  .generation-row {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    margin: 32px 0;
    z-index: 1;
  }

  /* Person card container */
  .person {
    display: flex;
    align-items: center;
    width: 260px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  .person:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.35);
  }

  /* Thumbnail photo on the left */
  .thumb {
    width: 80px;
    height: 100px;
    object-fit: cover;
    flex-shrink: 0;
    background: #22252f;
  }

  /* Text content on the right */
  .person-body {
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
  }

  .name {
    font-weight: 700;
    line-height: 1.2;
    margin: 0 0 4px;
    font-size: 15px;
  }
  .lifespan {
    color: var(--muted);
    font-size: 12px;
    margin: 0 0 6px;
  }
  .title {
    color: #c9d1d9;
    font-size: 12px;
    margin: 0;
  }

  .divider {
    height:1px;
    background: var(--accent);
    opacity: 0.6;
    margin: 12px 0 24px;
  }

  .note {
    color: var(--muted);
    font-size: 13px;
    margin-top: 8px;
  }

  @media (max-width: 540px) {
    .person { width: 90%; max-width: 350px; }
    .thumb { width: 70px; height: 90px; }
  }
</style>
</head>
<body>
  <div class="page">
    <h1>Belgian Royal Family — Family Tree</h1>
    <div class="subtitle">Each generation is shown on its own row. The small picture appears to the left within each card.</div>
    <div class="divider"></div>

    <div id="tree" class="tree">
      <svg id="connections" class="connections" preserveAspectRatio="none"></svg>
      <div id="rows"></div>
    </div>

    <p class="note">Tip: the small photo placeholder appears to the left of each person's details.</p>
  </div>

<script>
/**
 * Example data structure.
 */
const DEMO = [
  { id: "leopold_i", name: "Leopold I", title: "King of the Belgians", birth: "1790-12-16", death: "1865-12-10", photoUrl: "https://upload.wikimedia.org/wikipedia/commons/8/8f/Leopold_I_by_Franz_Winterhalter_%281849%29.jpg", generation: 0, parents: [] },
  { id: "leopold_ii", name: "Leopold II", title: "King of the Belgians", birth: "1835-04-09", death: "1909-12-17", photoUrl: "https://upload.wikimedia.org/wikipedia/commons/4/4a/Leopold_II_by_Franz_Winterhalter_%28cropped%29.jpg", generation: 1, parents: ["leopold_i"] },
  { id: "albert_i", name: "Albert I", title: "King of the Belgians", birth: "1875-04-08", death: "1934-02-17", photoUrl: "https://upload.wikimedia.org/wikipedia/commons/5/5a/Albert_I-KMSKA-1713-1.jpg", generation: 2, parents: ["leopold_ii"] },
  { id: "leopold_iii", name: "Leopold III", title: "King of the Belgians", birth: "1901-11-03", death: "1983-09-25", photoUrl: "https://upload.wikimedia.org/wikipedia/commons/b/ba/Leopold_III_of_Belgium.jpg", generation: 3, parents: ["albert_i"] },
  { id: "baudouin", name: "Baudouin", title: "King of the Belgians", birth: "1930-09-07", death: "1993-07-31", photoUrl: "https://upload.wikimedia.org/wikipedia/commons/5/5a/Boudewijn_der_Belgen.jpg", generation: 4, parents: ["leopold_iii"] },
  { id: "albert_ii", name: "Albert II", title: "King of the Belgians", birth: "1934-06-06", death: null, photoUrl: "https://upload.wikimedia.org/wikipedia/commons/6/6a/Albert_II_of_Belgium_cropped.jpg", generation: 4, parents: ["leopold_iii"] },
  { id: "philippe", name: "Philippe", title: "King of the Belgians", birth: "1960-04-15", death: null, photoUrl: "https://upload.wikimedia.org/wikipedia/commons/5/5c/King_Philippe_-_February_2017.jpg", generation: 5, parents: ["albert_ii"] },
  { id: "elisabeth", name: "Elisabeth", title: "Princess of Belgium, Duchess of Brabant", birth: "2001-10-25", death: null, photoUrl: "https://upload.wikimedia.org/wikipedia/commons/8/8a/Princess_Elisabeth_of_Belgium_2023_%28cropped%29.jpg", generation: 6, parents: ["philippe"] },
];

function formatLifespan(birth, death){
  const b = birth ? new Date(birth).getFullYear() : null;
  const d = death ? new Date(death).getFullYear() : null;
  if (b && d) return `${b}–${d}`;
  if (b && !d) return `b. ${b}`;
  return "";
}

function inferGenerations(people) {
  const gen = new Map();
  people.filter(p => (p.parents || []).length === 0)
        .forEach(p => gen.set(p.id, 0));
  let progressed = true;
  while (progressed) {
    progressed = false;
    people.forEach(child => {
      if (gen.has(child.id)) return;
      const ps = (child.parents || []).map(pid => gen.get(pid)).filter(Number.isInteger);
      if (ps.length > 0 && ps.length === (child.parents || []).length) {
        gen.set(child.id, Math.max(...ps) + 1);
        progressed = true;
      }
    });
  }
  people.forEach(p => p.generation = Number.isInteger(p.generation) ? p.generation : (gen.get(p.id) ?? 0));
  return people;
}

function renderTree(people) {
  const rowsEl = document.getElementById("rows");
  rowsEl.innerHTML = "";

  const groups = new Map();
  people.forEach(p => {
    const g = p.generation ?? 0;
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(p);
  });

  const orderedGens = [...groups.keys()].sort((a,b) => a-b);

  orderedGens.forEach(g => {
    const row = document.createElement("div");
    row.className = "generation-row";
    row.dataset.generation = g;

    const peeps = groups.get(g).slice().sort((a,b) => {
      const ay = a.birth ? +a.birth.slice(0,4) : 9999;
      const by = b.birth ? +b.birth.slice(0,4) : 9999;
      return ay - by || a.name.localeCompare(b.name);
    });

    peeps.forEach(p => {
      const card = document.createElement("article");
      card.className = "person";
      card.id = `person-${p.id}`;
      card.dataset.id = p.id;

      // Small photo placeholder
      const img = document.createElement("img");
      img.className = "thumb";
      img.alt = p.name;
      img.loading = "lazy";
      img.src = p.photoUrl || "";
      img.onerror = () => { img.style.visibility = "hidden"; img.style.height = "0px"; };

      // Text info
      const body = document.createElement("div");
      body.className = "person-body";

      const h = document.createElement("h3");
      h.className = "name";
      h.textContent = p.name;

      const life = document.createElement("div");
      life.className = "lifespan";
      life.textContent = formatLifespan(p.birth, p.death);

      const title = document.createElement("p");
      title.className = "title";
      title.textContent = p.title || "";

      body.appendChild(h);
      if (life.textContent) body.appendChild(life);
      if (title.textContent) body.appendChild(title);

      card.appendChild(img);
      card.appendChild(body);
      row.appendChild(card);
    });

    rowsEl.appendChild(row);
  });

  queueMicrotask(drawConnections);
  window.addEventListener("resize", () => drawConnections(), { passive:true });
}

function drawConnections() {
  const svg = document.getElementById("connections");
  const container = document.getElementById("tree");
  const rect = container.getBoundingClientRect();
  svg.setAttribute("width", rect.width);
  svg.setAttribute("height", rect.height);
  svg.setAttribute("viewBox", `0 0 ${rect.width} ${rect.height}`);
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const centers = new Map();
  document.querySelectorAll(".person").forEach(el => {
    const r = el.getBoundingClientRect();
    const cx = r.left - rect.left + r.width / 2;
    const top = r.top - rect.top;
    const bottom = top + r.height;
    centers.set(el.id.replace("person-",""), { cx, top, bottom });
  });

  function connect(parent, child) {
    const stroke = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const midY = (parent.bottom + child.top) / 2;
    const d = `M ${parent.cx} ${parent.bottom} C ${parent.cx} ${midY}, ${child.cx} ${midY}, ${child.cx} ${child.top}`;
    stroke.setAttribute("d", d);
    stroke.setAttribute("fill", "none");
    stroke.setAttribute("stroke", getComputedStyle(document.documentElement).getPropertyValue('--line') || '#6b7280');
    stroke.setAttribute("stroke-width", "2");
    stroke.setAttribute("opacity", "0.8");
    svg.appendChild(stroke);
  }

  const people = [...document.querySelectorAll(".person")].map(el => el.id.replace("person-",""));
  people.forEach(id => {
    const data = window.__PEOPLE_BY_ID?.get(id);
    if (!data || !data.parents || data.parents.length === 0) return;
    const childPos = centers.get(id);
    if (!childPos) return;
    data.parents.forEach(pid => {
      const parPos = centers.get(pid);
      if (parPos) connect(parPos, childPos);
    });
  });
}

(async function init(){
  let people;
  try {
    people = DEMO;
    const needsGen = people.some(p => p.generation == null);
    if (needsGen) inferGenerations(people);

    window.__PEOPLE_BY_ID = new Map(people.map(p => [p.id, p]));
    renderTree(people);
  } catch (e) {
    console.error("Failed to load people:", e);
    document.getElementById("rows").innerHTML =
      `<p style="color:#fca5a5">Could not load family data.</p>`;
  }
})();
</script>
</body>
</html>
