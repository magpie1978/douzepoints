<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Connected People</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #0f111a;
    color: #fff;
    font-family: 'Raleway', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  /* Full-screen SVG so the line never gets clipped */
  #connector {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none; /* let mouse events pass through */
  }

  .person {
    position: absolute;
    left: 0; top: 0;
    background: #1c1f2b;
    border: 2px solid #e50914;
    border-radius: 12px;
    padding: 16px 24px;
    cursor: grab;
    user-select: none;
    box-shadow: 0 0 12px rgba(229, 9, 20, 0.35);
    transform: translate(0,0);
  }
</style>
</head>
<body>
  <!-- The connector line lives here -->
  <svg id="connector" viewBox="0 0 100 100" preserveAspectRatio="none">
    <line id="link" x1="0" y1="0" x2="0" y2="0" stroke="#e50914" stroke-width="3" />
  </svg>

  <!-- People -->
  <div id="personA" class="person" style="transform: translate(200px, 200px);">Person A</div>
  <div id="personB" class="person" style="transform: translate(600px, 200px);">Person B</div>

<script>
  const svg = document.getElementById('connector');
  const link = document.getElementById('link');
  const personA = document.getElementById('personA');
  const personB = document.getElementById('personB');

  // Keep the SVG's coordinate space in CSS pixels (easy math)
  function sizeSVG() {
    svg.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
  }

  function centerOf(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function updateLine() {
    const a = centerOf(personA);
    const b = centerOf(personB);
    link.setAttribute('x1', a.x);
    link.setAttribute('y1', a.y);
    link.setAttribute('x2', b.x);
    link.setAttribute('y2', b.y);
  }

  sizeSVG();
  updateLine();

  // Dragging (uses transform: translate for smoother movement)
  let drag = null;
  let start = { x: 0, y: 0 };
  let origin = { x: 0, y: 0 };

  function getTranslate(el) {
    const m = getComputedStyle(el).transform;
    if (m === 'none') return { x: 0, y: 0 };
    const parts = m.match(/matrix\(([^)]+)\)/);
    if (!parts) return { x: 0, y: 0 };
    const nums = parts[1].split(',').map(Number);
    return { x: nums[4], y: nums[5] };
  }

  function onDown(e) {
    drag = e.currentTarget;
    drag.style.cursor = 'grabbing';
    const t = getTranslate(drag);
    origin = { x: t.x, y: t.y };
    start = { x: e.clientX, y: e.clientY };
    e.preventDefault();
  }

  function onMove(e) {
    if (!drag) return;
    const dx = e.clientX - start.x;
    const dy = e.clientY - start.y;
    drag.style.transform = `translate(${origin.x + dx}px, ${origin.y + dy}px)`;
    updateLine();
  }

  function onUp() {
    if (drag) drag.style.cursor = 'grab';
    drag = null;
  }

  [personA, personB].forEach(el => el.addEventListener('mousedown', onDown));
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  window.addEventListener('resize', () => { sizeSVG(); updateLine(); });

  // Initial paint after fonts/layout settle
  requestAnimationFrame(updateLine);
</script>
</body>
</html>
