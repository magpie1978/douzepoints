<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>DouzePoints | Country</title>
        <link rel="stylesheet" type="text/css" href="style/combined.css">
        <link rel="stylesheet" type="text/css" href="style/sidebar.css">
        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <!-- Code for connection to Supabase database -->
    </head>

    <body oncontextmenu="return false">  <!-- disables right-click context menu -->
        <!-- HEADER -->
        <div id="header-container"></div>  <!-- Placeholder div where header.js will inject the site header -->
        <script type="module" src="js/header.js"></script>  <!-- module that builds/loads the header into #header-container -->
    
    
        <!-- MAIN CONTAINER -->
        <div class="container">

            <!-- Placeholder for the left sidebar; filled by sidebar.js -->
            <div id="sidebar-container" class="sidebar"></div> 
    
            <div class="main-content">
                <div class="header-bar" style="display: flex; justify-content: flex-end; margin-bottom: 40px; margin-right: 20px;">
                    <div style="flex: 1;"></div>  <!-- Flexible spacer pushing controls to the right -->
                    <div class="sort-controls" style="display: flex; align-items: center; padding-right: 20px;">
                        <label for="sort-options">
                            <i data-lucide="list-filter" style="margin-right: 15px;"></i>
                        </label>

                         <!-- Sorting UI container (icon + select) -->
                        <select id="sort-options" style="width: 160px; padding: 5px; font-size: 11px;">
                            <option value="year-desc" selected>Year (desc)</option>
                            <option value="year-asc">Year (asc)</option>
                            <option value="artist">Artist Name</option>
                            <option value="song">Song Title</option>
                            <option value="jury">Jury Points</option>
                            <option value="televote">Televote Points</option>
                            <option value="total">Total Points</option>
                        </select>
                    </div>
                </div>

                <!-- Empty grid; video.js populates cards/items here -->
                <div class="grid-container" id="video-container"></div>
            </div>
        </div>
    
        
        <!-- MODAL -->
        <script src="js/modal.js"></script>

        <!-- Placeholder where modal.js will inject modal markup -->
        <div id="modal-container"></div>

        <!-- ES module that fetches/prepares video data and renders into #video-container -->
        <script type="module" src="js/video.js"></script>
    
    
        <!-- FOOTER -->

        <!-- Placeholder for site footer -->
        <div id="footer"></div>
        <script src="js/footer.js" type="text/javascript"></script>
    
        
        <!-- SCRIPTS -->
        <script src="js/sorting.js" type="text/javascript"></script>
        <script src="js/icons.js" type="text/javascript"></script>
        
    
        <!-- LOAD SIDEBAR LAST -->
        <script type="module" src="js/sidebar.js"></script>
    
    </body>
</html>
