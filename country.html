<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="utf-8"/>
        <title>{Country} Eurovision Results & History | DouzePoints</title>
        <link rel="stylesheet" type="text/css" href="style/combined.css">
        <link rel="stylesheet" type="text/css" href="style/video-cards.css">
        <link rel="stylesheet" type="text/css" href="style/favorites.css">
        <link rel="stylesheet" type="text/css" href="style/footer.css">
        <link rel="stylesheet" type="text/css" href="style/sidebar.css">
        <script src="/js/favicons.js"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


        <!-- GOOGLE ADSENSE SCRIPT -->
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1056703456722687" crossorigin="anonymous"></script>
        

    </head>

      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-9BDCDNFMGG"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
      
        gtag('config', 'G-9BDCDNFMGG');
      </script>


    <body oncontextmenu="return false">
        <!-- HEADER -->
        <div id="header-container"></div>
        <script type="module" src="js/header_new.js"></script>
    
        <!-- MAIN CONTAINER -->
        <div class="container">
            <div id="sidebar-container" class="sidebar"></div>
    
            <div class="main-content">
                <div class="header-bar" style="display: flex; justify-content: flex-end; margin-bottom: 40px; margin-right: 20px;">
                    <div style="flex: 1;"></div>
                    <div class="sort-controls" style="display: flex; align-items: center; padding-right: 20px;">
                        <label for="sort-options">
                            <i data-lucide="list-filter" style="margin-right: 15px;"></i>
                        </label>
                        <select id="sort-options" style="width: 160px; padding: 5px; font-size: 11px;">
                            <option value="year-desc" selected>Year (desc)</option>
                            <option value="year-asc">Year (asc)</option>
                            <option value="artist">Artist Name</option>
                            <option value="song">Song Title</option>
                            <option value="jury">Jury Points</option>
                            <option value="televote">Televote Points</option>
                            <option value="total">Total Points</option>
                        </select>
                    </div>
                </div>
                <div class="grid-container" id="video-container"></div>
            </div>
        </div>
    
        
        <!-- MODAL -->
        <script src="js/modal.js"></script>
        <div id="modal-container"></div>
    
        <script type="module" src="js/video.js"></script>
    
    
        <!-- FOOTER -->
        <div id="footer"></div>
        <script src="js/footer.js" type="text/javascript"></script>
    
        
        <!-- SCRIPTS -->
        <script src="js/sorting.js" type="text/javascript"></script>
        <script src="js/icons.js" type="text/javascript"></script>
        
    
        <!-- LOAD SIDEBAR LAST -->
        <script type="module" src="js/sidebar.js"></script>


        <!-- Dynamically change the title -->
        <script>
          document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const country = params.get("country");
        
            if (country) {
              // Clean formatting (handles URL encoding)
              const formattedCountry = decodeURIComponent(country);
        
              document.title = `${formattedCountry} Eurovision Results & History | DouzePoints`;
            }
          });
        </script>
    
    </body>
</html>
