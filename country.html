<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>ESCFlix - Country View</title>
    <link rel="stylesheet" type="text/css" href="countries2.css">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body oncontextmenu="return false">

    <!-- Dynamic banner -->
    <div id="banner" style="display: flex; align-items: center; justify-content: center; height: 300px; font-size: 3em;">
        Loading...
    </div>

    <div class="container">
        <div id="sidebar-container"></div>
        <script src="sidebar_countries.js"></script>

        <div class="main-content">
            <div class="header-bar" style="display: flex; justify-content: flex-end; margin-bottom: 40px;">
                <div style="flex: 1;"></div>
                <div class="sort-controls" style="display: flex; align-items: center; padding-right: 20px;">
                    <label for="sort-options">
                        <i style="margin-right: 15px;">Sort:</i>
                    </label>
                    <select id="sort-options">
                        <option value="year-desc" selected>Year (desc)</option>
                        <option value="year-asc">Year (asc)</option>
                        <option value="artist">Artist</option>
                        <option value="song">Song</option>
                    </select>
                </div>
            </div>

            <div class="grid-container" id="video-container"></div>
        </div>
    </div>

    <script>
    const countryParam = new URLSearchParams(window.location.search).get("country");

    async function loadCountryData() {
        const csvUrl = "./data/DouzePoints.csv";
        const response = await fetch(csvUrl);
        const csvText = await response.text();

        Papa.parse(csvText, {
            header: true,
            skipEmptyLines: true,
            transformHeader: h => h.trim(),
            transform: v => v.trim(),
            complete: function(results) {
                const data = results.data.filter(row => row.Country === countryParam);
                const countryCode = data[0]?.Country_Code?.toLowerCase();

                document.getElementById("banner").innerHTML = `
                    <img src="flags/${countryCode}.png" style="width:100px; height:100px; margin-right:20px;">
                    ${countryParam}
                `;

                // Sort by default year desc
                data.sort((a, b) => parseInt(b.Year) - parseInt(a.Year));

                const container = document.getElementById("video-container");
                container.innerHTML = '';

                data.forEach(row => {
                    const div = document.createElement("div");
                    div.className = "video-item";
                    div.setAttribute("data-year", row.Year);
                    div.setAttribute("data-artist", row.Artist);
                    div.setAttribute("data-song", row.Song);

                    div.innerHTML = `
                        <div class="preview-container">
                            <img src="images/${row.Year}-${countryCode.toUpperCase()}.jpeg" alt="${row.Artist}"/>
                        </div>
                        <div class="video-title-with-icon" onclick="event.stopPropagation()">
                            <a href="country.html?country=${countryParam}">
                                <img class="icon-placeholder" src="flags/${countryCode}.png" alt="Flag">
                            </a>
                            <div class="video-title-text">
                                <b>${row.Artist}</b><br>${row.Song}<br>${row.Year}
                            </div>
                        </div>
                    `;
                    div.onclick = () => GDriveOpenModalWithVideo(row.Video_URL);
                    container.appendChild(div);
                });

                attachSorting();
            }
        });
    }

    function attachSorting() {
        const select = document.getElementById("sort-options");
        select.addEventListener("change", function() {
            const sortType = select.value;
            const container = document.getElementById("video-container");
            const items = Array.from(container.children);

            if (sortType === "year-desc") {
                items.sort((a,b) => parseInt(b.dataset.year) - parseInt(a.dataset.year));
            } else if (sortType === "year-asc") {
                items.sort((a,b) => parseInt(a.dataset.year) - parseInt(b.dataset.year));
            } else if (sortType === "artist") {
                items.sort((a,b) => a.dataset.artist.localeCompare(b.dataset.artist));
            } else if (sortType === "song") {
                items.sort((a,b) => a.dataset.song.localeCompare(b.dataset.song));
            }

            container.innerHTML = '';
            items.forEach(item => container.appendChild(item));
        });
    }

    loadCountryData();
    </script>

    <div class="modal" id="videoModal" onclick="GDriveCloseModal(event)">
      <div class="modal-content">
        <span class="close-button" onclick="GDriveCloseModal(event)">×</span>
        <video autoplay controls controlslist="nodownload" id="modalVideo" style="display: none;" oncontextmenu="return false"></video>
        <iframe allow="autoplay; encrypted-media" frameborder="0" id="modalIframe" style="display: none;" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>

    <script src="modal.js"></script>
    <script src="header.js"></script>
</body>
</html>
