<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Douze Points | Albania</title>
    <link rel="stylesheet" type="text/css" href="countries2.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body oncontextmenu="return false" data-country="al">

    <div id="header-container"></div>

    <div class="container">
        <div id="sidebar-container"></div>
        <script src="sidebar_countries.js" type="text/javascript"></script>

        <div class="main-content">
            <div class="header-bar" style="display: flex; justify-content: flex-end; margin-bottom: 40px; margin-right: 20px;">
                <div style="flex: 1;"></div>
            </div>

            <div class="grid-container" id="video-container">
                <!-- dynamically populated content -->
            </div>
        </div>
    </div>

    <div id="footer"></div>
    <script src="footer.js" type="text/javascript"></script>

    <script>
        async function loadAlbaniaData() {
            const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT3NsJbFLtYWZSBn0WnfBYfO9CBqZfnMW4KIF9oT8DTzmvGX5SyQ03aaBeAMb0L_A0Cqdw81k679x5X/pub?output=csv";
            const response = await fetch(csvUrl);
            const csvText = await response.text();

            const rows = csvText.split('\n').map(row => row.split(',').map(cell => cell.trim()));

            const headers = rows[0];
            const countryIndex = headers.indexOf('Country');
            const yearIndex = headers.indexOf('Year');
            const artistIndex = headers.indexOf('Artist');
            const songIndex = headers.indexOf('Song');
            const videoUrlIndex = headers.indexOf('Video_URL');

            const container = document.getElementById("video-container");

            rows.slice(1).forEach(cols => {
                if (cols[countryIndex] === 'Albania') {
                    const year = cols[yearIndex];
                    const artist = cols[artistIndex];
                    const song = cols[songIndex];
                    const videoUrl = cols[videoUrlIndex];

                    const div = document.createElement("div");
                    div.className = "video-item";
                    div.setAttribute("data-artist", artist);
                    div.setAttribute("data-country", "Albania");
                    div.setAttribute("data-song", song);
                    div.setAttribute("data-year", year);
                    div.setAttribute("onclick", `GDriveOpenModalWithVideo('${videoUrl}')`);

                    div.innerHTML = `
                        <div class="preview-container">
                            <img alt="Albania ${year}" src="images/${year}-AL.jpeg"/>
                        </div>
                        <div class="video-title-with-icon" onclick="event.stopPropagation()">
                            <a href="albania.html">
                                <img alt="Flag" class="icon-placeholder" src="flags/al.png"/>
                            </a>
                            <div class="video-title-text"><b>${artist}</b><br>${song}<br>${year}</div>
                        </div>
                    `;
                    container.appendChild(div);
                }
            });
        }

        loadAlbaniaData();
    </script>

    <!-- Modal and other scripts -->
    <div class="modal" id="videoModal" onclick="GDriveCloseModal(event)">
        <div class="modal-content">
            <span class="close-button" onclick="GDriveCloseModal(event)">×</span>
            <video autoplay="" controls="" controlslist="nodownload" id="modalVideo" style="display: none;" oncontextmenu="return false"></video>
            <iframe allow="autoplay; encrypted-media" frameborder="0" id="modalIframe" style="display: none;" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
    </div>

    <script src="modal.js" type="text/javascript"></script>
    <script src="sorting.js" type="text/javascript"></script>
    <script src="header.js" type="text/javascript"></script>

</body>
</html>
