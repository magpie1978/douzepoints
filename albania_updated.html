<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Douze Points | Albania</title>
    <link rel="stylesheet" type="text/css" href="countries2.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body oncontextmenu="return false" data-country="al">

    <!-- HEADER -->
    <div id="header-container"></div>

    <div class="container">
        <div id="sidebar-container"></div>
        <script src="sidebar_countries.js" type="text/javascript"></script>

        <div class="main-content">
            <div class="header-bar" style="display: flex; justify-content: flex-end; margin-bottom: 40px; margin-right: 20px;">
                <div style="flex: 1;"></div>
                <div class="sort-controls" style="display: flex; align-items: center; padding-right: 20px;">
                    <label for="sort-options">
                        <i data-lucide="list-filter" style="margin-right: 15px;"></i>
                    </label>
                    <select id="sort-options" style="width: 160px; padding: 5px; font-size: 11px;">
                        <option value="year-asc">Year (asc)</option>
                        <option value="year-desc">Year (desc)</option>
                        <option value="artist">Artist Name</option>
                        <option value="song">Song Title</option>
                    </select>
                </div>
            </div>

            <div class="grid-container" id="video-container">
                <!-- Content will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div id="footer"></div>
    <script src="footer.js" type="text/javascript"></script>

    <!-- DATA LOADER -->
    <script>
    async function loadAlbaniaData() {
        const csvUrl = "./data/DouzePoints.csv";  // Relative path — safe on GitHub Pages + custom domain

        const response = await fetch(csvUrl);
        const csvText = await response.text();

        Papa.parse(csvText, {
            header: true,
            skipEmptyLines: true,
            transformHeader: header => header.replace(/^\uFEFF/, '').trim(),
            transform: value => value.trim(),
            complete: function(results) {
                const data = results.data;
                const container = document.getElementById("video-container");

                data.forEach(row => {
                    if (row.Country !== "Albania") return;

                    const year = row.Year;
                    const artist = row.Artist;
                    const song = row.Song;
                    const videoUrl = row.Video_URL;

                    const videoItem = document.createElement("div");
                    videoItem.className = "video-item";
                    videoItem.setAttribute("data-artist", artist);
                    videoItem.setAttribute("data-country", "Albania");
                    videoItem.setAttribute("data-song", song);
                    videoItem.setAttribute("data-year", year);
                    videoItem.setAttribute("onclick", `GDriveOpenModalWithVideo('${videoUrl}')`);

                    const previewContainer = document.createElement("div");
                    previewContainer.className = "preview-container";
                    const img = document.createElement("img");
                    img.src = `images/${year}-AL.jpeg`;
                    img.alt = `Albania ${year}`;
                    previewContainer.appendChild(img);

                    const titleWithIcon = document.createElement("div");
                    titleWithIcon.className = "video-title-with-icon";
                    titleWithIcon.setAttribute("onclick", "event.stopPropagation()");

                    const a = document.createElement("a");
                    a.href = "albania.html";
                    const flagImg = document.createElement("img");
                    flagImg.src = "flags/al.png";
                    flagImg.className = "icon-placeholder";
                    flagImg.alt = "Flag";
                    a.appendChild(flagImg);
                    titleWithIcon.appendChild(a);

                    const titleText = document.createElement("div");
                    titleText.className = "video-title-text";
                    titleText.innerHTML = `<b>${artist}</b><br>${song}<br>${year}`;
                    titleWithIcon.appendChild(titleText);

                    videoItem.appendChild(previewContainer);
                    videoItem.appendChild(titleWithIcon);
                    container.appendChild(videoItem);
                });

                // ✅ Fire custom event once DOM fully loaded
                document.dispatchEvent(new Event("videosLoaded"));
            }
        });
    }

    loadAlbaniaData();
    </script>

    <!-- MODAL -->
    <div class="modal" id="videoModal" onclick="GDriveCloseModal(event)">
        <div class="modal-content">
            <span class="close-button" onclick="GDriveCloseModal(event)">×</span>
            <video autoplay="" controls="" controlslist="nodownload" id="modalVideo" style="display: none;" oncontextmenu="return false"></video>
            <iframe allow="autoplay; encrypted-media" frameborder="0" id="modalIframe" style="display: none;" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
    </div>

    <!-- Core Logic -->
    <script src="modal.js" type="text/javascript"></script>
    <script src="sorting.js" type="text/javascript"></script>
    <script src="header.js" type="text/javascript"></script>

    <!-- Default Sort Trigger -->
    <script>
    document.addEventListener("videosLoaded", function() {
        if (typeof sortVideos === "function") {
            sortVideos("year-desc");
        }
    });
    </script>

</body>
</html>
