<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eurovision 1956 Data</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 20px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      background: #fff;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
    }
    th {
      background-color: #eee;
    }
  </style>
</head>
<body>
  <h2>Eurovision Entries: 1956</h2>
  <table id="sheet-table"></table>

  <script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/1NuTqO7-M6QFiWWdz0Nh_R1MOMIJDrdtEPB8J8ZSc6Hw/edit?usp=sharing'; // Replace with your actual published CSV link

    fetch(sheetUrl)
      .then(response => response.text())
      .then(csvText => {
        const rows = csvText.trim().split('\n').map(row => row.split(','));
        const header = rows[0];
        const yearIndex = header.indexOf('Year');

        const filteredRows = rows.filter((row, i) => {
          if (i === 0) return true; // Keep header
          return row[yearIndex] === '1956';
        });

        const table = document.getElementById('sheet-table');
        filteredRows.forEach((row, rowIndex) => {
          const tr = document.createElement('tr');
          row.forEach(cell => {
            const td = document.createElement(rowIndex === 0 ? 'th' : 'td');
            td.textContent = cell;
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });
      })
      .catch(error => {
        console.error('Error loading sheet:', error);
      });
  </script>
</body>
</html>
