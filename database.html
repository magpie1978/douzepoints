<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eurovision 1956 – Year, Country, Artist</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 20px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      background: #fff;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
    }
    th {
      background-color: #eee;
    }
  </style>
</head>
<body>
  <h2>Eurovision 1956 – Year, Country, Artist</h2>
  <table id="sheet-table">
    <thead>
      <tr>
        <th>Year</th>
        <th>Country</th>
        <th>Artist</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT3NsJbFLtYWZSBn0WnfBYfO9CBqZfnMW4KIF9oT8DTzmvGX5SyQ03aaBeAMb0L_A0Cqdw81k679x5X/pub?output=csv';

    fetch(sheetUrl)
      .then(response => response.text())
      .then(csvText => {
        const rows = csvText.trim().split('\n').map(row => row.split(','));
        const headers = rows[0];

        const yearIdx = headers.indexOf('Year');
        const countryIdx = headers.indexOf('Country');
        const artistIdx = headers.indexOf('Artist');

        const tbody = document.querySelector('#sheet-table tbody');

        rows.slice(1).forEach(row => {
          if (row[yearIdx] === '1956') {
            const tr = document.createElement('tr');

            const yearCell = document.createElement('td');
            yearCell.textContent = row[yearIdx];
            tr.appendChild(yearCell);

            const countryCell = document.createElement('td');
            countryCell.textContent = row[countryIdx];
            tr.appendChild(countryCell);

            const artistCell = document.createElement('td');
            artistCell.textContent = row[artistIdx];
            tr.appendChild(artistCell);

            tbody.appendChild(tr);
          }
        });
      })
      .catch(error => {
        console.error('Error loading or processing CSV:', error);
      });
  </script>
</body>
</html>
