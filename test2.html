<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test Video Modal</title>
  <script src="countries.js" type="text/javascript"></script>
  <style>
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      margin: 0;
      background: #141414;
      color: #fff;
    }

    .home-link {
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      }

    .container {
      display: flex;
    }

    .sidebar {
      width: 220px;
      padding: 10px;
      background-color: #111;
      color: white;
      font-size: 14px;
      height: auto;
      overflow: visible;
    }

    .sidebar a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      transition: background-color 0.3s;
    }

    .sidebar-row a {
      text-decoration: none;
      color: white;
      display: flex;
      align-items: center;
    }

    .sidebar-row {
      margin: 5px 0;
    }

    .sidebar a:hover {
      background-color: #e50914;
      border-radius: 8px;
    }

    .sidebar img {
      width: 22px;
      height: 22px;
      object-fit: cover;
      border-radius: 50%;
    }

    .main-content {
      flex-grow: 1;
      padding: 20px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .video-item {
      cursor: pointer;
      background-color: #1a1a1a;
      padding: 10px;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .video-item:hover {
      transform: scale(1.05);
    }

    .preview-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      border-radius: 6px;
    }

    .preview-container img,
    .preview-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-container video {
      display: none;
    }

    .preview-container:hover video {
      display: block;
    }

    .preview-container:hover img {
      display: none;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      max-width: 100%;
      max-height: 100%;
    }

    .modal-content video,
    .modal-content iframe {
      width: 81vw;
      height: 81vh;
    }

    .close-button {
      position: absolute;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 40px;
      top: 10px;
      right: 20px;
      z-index: 9999;
      border-radius: 50%;
    }

    .site-footer {
      margin-top: 3rem;
      padding: 2rem 1rem;
      text-align: center;
      color: #ccc;
      font-size: 0.85rem;
      background-color: #141414;
    }

    .footer-line {
      width: 90%;
      height: 1px;
      background-color: #e50914;
      margin: 0 auto 1rem auto;
    }

    .footer-branding {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      gap: 10px;
    }

    .footer-flag {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      overflow: hidden;
    }

    .footer-flag img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .footer-title {
      font-size: 1rem;
      color: #fff;
      font-weight: bold;
    }

    .footer-links a {
      color: #ccc;
      margin: 0 10px;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .footer-links a:hover {
      color: #e50914;
      text-decoration: underline;
    }
  </style>
</head>

<body oncontextmenu="return false">
  <!-- HEADER -->
  <header class="main-header">
    <div class="header-overlay">
      <div class="header-links">
        <a class="home-link" href="index.html">Home</a>
        <a class="home-link" href="countries.html">Countries</a>
        <a class="home-link" href="edition-2024.html">Editions</a>
      </div>
    </div>
    <div class="banner-static">
      <img src="https://euroflix.s3.eu-north-1.amazonaws.com/banners/al.png" alt="Banner">
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="container">
    <div class="sidebar" id="sidebar-container">
      <!-- Sidebar will be populated by JS -->
    </div>
    <div class="main-content">
      <div class="grid-container">
        <!-- Example video items -->
        <div class="video-item" onclick="GDriveOpenModalWithVideo('https://drive.google.com/file/d/1o6AnTVJ5m6cglxTOS4o-U-LtFbg9Nflt/', 'Malmö 2024 Opening Ceremony')">
          <div class="preview-container">
            <img src="https://drive.google.com/thumbnail?id=1gL6Dw4mkcKztOf0FAJ69zm6KQQm5L11y" alt="Malmö 2024" />
          </div>
        </div>
        <!-- Duplicate as needed -->
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div id="videoModal" class="modal" onclick="GDriveCloseModal(event)">
    <div class="modal-content">
      <span class="close-button" onclick="GDriveCloseModal(event)">&times;</span>
      <video id="modalVideo" controls autoplay controlsList="nodownload" style="display: none;"></video>
      <iframe id="modalIframe" style="display: none;" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-line"></div>
    <div class="footer-branding">
      <div class="footer-flag">
        <img src="https://euroflix.s3.eu-north-1.amazonaws.com/flags/gb.png" alt="United Kingdom" />
      </div>
      <span class="footer-title">Douze Points</span>
    </div>
    <div class="footer-links">
      <a href="about.html">About</a>
      <a href="contact.html">Contact Us</a>
      <a href="faq.html">FAQ</a>
      <a href="privacy.html">Privacy Policy</a>
    </div>
  </footer>

  <script>
    function GDriveOpenModalWithVideo(videoUrl, titleText) {
      const modal = document.getElementById("videoModal");
      const video = document.getElementById("modalVideo");
      const iframe = document.getElementById("modalIframe");
      modal.style.display = "flex";
      video.style.display = "none";
      iframe.style.display = "none";
      video.pause();
      iframe.src = "";
      if (videoUrl.includes('drive.google.com')) {
        const match = videoUrl.match(/\/d\/(.*?)\//);
        if (match && match[1]) {
          iframe.src = `https://drive.google.com/file/d/${match[1]}/preview`;
          iframe.style.display = "block";
        }
      } else {
        video.src = videoUrl;
        video.style.display = "block";
        video.play();
      }
    }

    function GDriveCloseModal(event) {
      event.stopPropagation();
      const modal = document.getElementById("videoModal");
      const video = document.getElementById("modalVideo");
      const iframe = document.getElementById("modalIframe");
      video.pause();
      video.src = "";
      iframe.src = "";
      modal.style.display = "none";
    }
  </script>
</body>
</html>
