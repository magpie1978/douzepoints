<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test Video Modal</title>
  <link rel="stylesheet" type="text/css" href="countries.css">
  <script src="countries.js" type="text/javascript"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-between;
    }

    .video-item {
      width: 25%;
      box-sizing: border-box;
      padding: 10px;
      background: #222;
      border-radius: 8px;
      cursor: pointer;
    }

    .preview-container img {
      width: 100%;
      border-radius: 6px;
      display: block;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      max-width: 100%;
      max-height: 100%;
    }

    .modal-content video,
    .modal-content iframe {
      width: 81vw;
      height: 81vh;
    }

    .modal-title-bar {
      position: absolute;
      top: -50px;
      left: 0;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 6px;
    }

    .close-button {
      position: absolute;
      top: -40px;
      right: -40px;
      font-size: 36px;
      color: white;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border-radius: 50%;
      z-index: 10000;
    }

    .close-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .site-footer {
      background: #000;
      padding: 20px;
      text-align: center;
    }

    .footer-line {
      height: 1px;
      background: #444;
      margin-bottom: 15px;
    }

    .footer-branding {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .footer-flag img {
      height: 24px;
    }

    .footer-title {
      font-weight: bold;
    }

    .footer-links a {
      margin: 0 10px;
      color: #aaa;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body oncontextmenu="return false">
  <!-- HEADER -->
  <header class="main-header">
    <div class="header-overlay">
      <div class="header-links">
        <a class="home-link" href="index.html">Home</a>
        <a class="countries-link" href="countries.html">Countries</a>
        <a class="home-link" href="edition-2024.html">Editions</a>
      </div>
    </div>
    <div class="banner-static">
      <img src="https://euroflix.s3.eu-north-1.amazonaws.com/banners/al.png" alt="Banner">
    </div>
  </header>

  <!-- Red dividing line -->
  <div class="banner-divider"></div>

  <!-- MAIN CONTENT -->
  <div class="container">
    <div id="sidebar-container"></div>

    <div class="grid">
      <!-- Repeatable video items -->
      <div class="video-item" onclick="GDriveOpenModalWithVideo('https://drive.google.com/file/d/1o6AnTVJ5m6cglxTOS4o-U-LtFbg9Nflt/', 'Malmö 2024 Opening Ceremony')">
        <div class="preview-container">
          <img src="https://drive.google.com/thumbnail?id=1gL6Dw4mkcKztOf0FAJ69zm6KQQm5L11y" alt="Malmö 2024">
        </div>
      </div>
      <div class="video-item" onclick="GDriveOpenModalWithVideo('...')">
        <div class="preview-container">
          <img src="https://drive.google.com/thumbnail?id=1gL6Dw4mkcKztOf0FAJ69zm6KQQm5L11y" alt="Malmö 2024">
        </div>
      </div>
      <div class="video-item" onclick="GDriveOpenModalWithVideo('...')">
        <div class="preview-container">
          <img src="https://drive.google.com/thumbnail?id=1gL6Dw4mkcKztOf0FAJ69zm6KQQm5L11y" alt="Malmö 2024">
        </div>
      </div>
      <div class="video-item" onclick="GDriveOpenModalWithVideo('...')">
        <div class="preview-container">
          <img src="https://drive.google.com/thumbnail?id=1gL6Dw4mkcKztOf0FAJ69zm6KQQm5L11y" alt="Malmö 2024">
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div id="videoModal" class="modal" onclick="GDriveCloseModal(event)">
    <div class="modal-content">
      <div id="modalTitle" class="modal-title-bar"></div>
      <span class="close-button" onclick="GDriveCloseModal(event)">&times;</span>
      <video id="modalVideo" controls autoplay controlsList="nodownload" style="display: none;"></video>
      <iframe id="modalIframe" style="display: none;" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-line"></div>
    <div class="footer-branding">
      <div class="footer-flag">
        <img src="https://euroflix.s3.eu-north-1.amazonaws.com/flags/gb.png" alt="United Kingdom" />
      </div>
      <span class="footer-title">Douze Points</span>
    </div>
    <div class="footer-links">
      <a href="about.html">About</a>
      <a href="contact.html">Contact Us</a>
      <a href="faq.html">FAQ</a>
      <a href="privacy.html">Privacy Policy</a>
    </div>
  </footer>

  <script>
    function GDriveOpenModalWithVideo(videoUrl, titleText) {
      const modal = document.getElementById("videoModal");
      const video = document.getElementById("modalVideo");
      const iframe = document.getElementById("modalIframe");
      const titleBar = document.getElementById("modalTitle");

      modal.style.display = "flex";
      video.style.display = "none";
      iframe.style.display = "none";
      video.pause();
      iframe.src = "";
      titleBar.textContent = titleText || '';

      if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
        let videoId = '';
        try {
          if (videoUrl.includes('youtu.be')) {
            videoId = videoUrl.split('/').pop().split('?')[0];
          } else {
            const url = new URL(videoUrl);
            videoId = url.searchParams.get('v');
          }
        } catch (e) {
          console.error('Invalid YouTube URL:', videoUrl);
        }
        if (videoId) {
          iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
          iframe.style.display = "block";
        }
      } else if (videoUrl.includes('drive.google.com')) {
        let fileId = '';
        try {
          const url = new URL(videoUrl);
          const match = url.pathname.match(/\/d\/([^/]+)/);
          if (match && match[1]) {
            fileId = match[1];
          }
        } catch (e) {
          console.error('Invalid Google Drive URL:', videoUrl);
        }
        if (fileId) {
          iframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
          iframe.style.display = "block";
        }
      } else {
        video.src = videoUrl;
        video.style.display = "block";
        video.play();
      }
    }

    function GDriveCloseModal(event) {
      event.stopPropagation();
      const modal = document.getElementById("videoModal");
      const video = document.getElementById("modalVideo");
      const iframe = document.getElementById("modalIframe");
      video.pause();
      video.src = "";
      iframe.src = "";
      modal.style.display = "none";
    }
  </script>
</body>
</html>
