<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test Video Modal</title>
  <script src="countries.js" type="text/javascript"></script>
  <style>
    /* EMBEDDED CSS PROVIDED BY USER */
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      margin: 0;
      background: #141414;
      color: #fff;
    }

    .container {
      display: flex;
    }

    .main-content {
      flex-grow: 1;
      padding: 20px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .video-item {
      cursor: pointer;
      background-color: #1a1a1a;
      padding: 10px;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .video-item:hover {
      transform: scale(1.05);
    }

    .preview-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      border-radius: 6px;
    }

    .preview-container img,
    .preview-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-container video {
      display: none;
    }

    .preview-container:hover video {
      display: block;
    }

    .preview-container:hover img {
      display: none;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      background-color: #000;
      padding: 20px;
      max-width: 90%;
      max-height: 90%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content video {
      max-width: 100%;
      max-height: 80vh;
    }

    .close-button {
      position: absolute;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 40px;
      top: 10px;
      right: 20px;
      z-index: 9999;
      border-radius: 50%;
    }
  </style>
</head>

<body oncontextmenu="return false">
  <div class="container">
    <div class="main-content">
      <div class="grid-container">
        <!-- Example video items -->
        <div class="video-item" onclick="GDriveOpenModalWithVideo('https://drive.google.com/file/d/1o6AnTVJ5m6cglxTOS4o-U-LtFbg9Nflt/', 'Malmö 2024 Opening Ceremony')">
          <div class="preview-container">
            <img src="https://drive.google.com/thumbnail?id=1gL6Dw4mkcKztOf0FAJ69zm6KQQm5L11y" alt="Malmö 2024" />
          </div>
        </div>
        <!-- Duplicate as needed -->
        <div class="video-item" onclick="GDriveOpenModalWithVideo('https://drive.google.com/file/d/1o6AnTVJ5m6cglxTOS4o-U-LtFbg9Nflt/', 'Malmö 2024 Opening Ceremony')">
          <div class="preview-container">
            <img src="https://drive.google.com/thumbnail?id=1gL6Dw4mkcKztOf0FAJ69zm6KQQm5L11y" alt="Malmö 2024" />
          </div>
        </div>
        <div class="video-item" onclick="GDriveOpenModalWithVideo('https://drive.google.com/file/d/1o6AnTVJ5m6cglxTOS4o-U-LtFbg9Nflt/', 'Malmö 2024 Opening Ceremony')">
          <div class="preview-container">
            <img src="https://drive.google.com/thumbnail?id=1gL6Dw4mkcKztOf0FAJ69zm6KQQm5L11y" alt="Malmö 2024" />
          </div>
        </div>
        <div class="video-item" onclick="GDriveOpenModalWithVideo('https://drive.google.com/file/d/1o6AnTVJ5m6cglxTOS4o-U-LtFbg9Nflt/', 'Malmö 2024 Opening Ceremony')">
          <div class="preview-container">
            <img src="https://drive.google.com/thumbnail?id=1gL6Dw4mkcKztOf0FAJ69zm6KQQm5L11y" alt="Malmö 2024" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div id="videoModal" class="modal" onclick="GDriveCloseModal(event)">
    <div class="modal-content">
      <span class="close-button" onclick="GDriveCloseModal(event)">&times;</span>
      <video id="modalVideo" controls autoplay controlsList="nodownload" style="display: none;"></video>
      <iframe id="modalIframe" style="display: none;" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    function GDriveOpenModalWithVideo(videoUrl, titleText) {
      const modal = document.getElementById("videoModal");
      const video = document.getElementById("modalVideo");
      const iframe = document.getElementById("modalIframe");
      modal.style.display = "flex";
      video.style.display = "none";
      iframe.style.display = "none";
      video.pause();
      iframe.src = "";
      if (videoUrl.includes('drive.google.com')) {
        const match = videoUrl.match(/\/d\/(.*?)\//);
        if (match && match[1]) {
          iframe.src = `https://drive.google.com/file/d/${match[1]}/preview`;
          iframe.style.display = "block";
        }
      } else {
        video.src = videoUrl;
        video.style.display = "block";
        video.play();
      }
    }

    function GDriveCloseModal(event) {
      event.stopPropagation();
      const modal = document.getElementById("videoModal");
      const video = document.getElementById("modalVideo");
      const iframe = document.getElementById("modalIframe");
      video.pause();
      video.src = "";
      iframe.src = "";
      modal.style.display = "none";
    }
  </script>
</body>
</html>
