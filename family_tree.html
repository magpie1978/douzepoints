<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Editable Connected People (Persistent)</title>
<style>
  :root {
    --bg: #0f111a;
    --panel: #1c1f2b;
    --accent: #e50914;
    --text: #e8e8e8;
    --muted: #bdbdbd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Raleway', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  /* Full-viewport SVG so the connector line never clips */
  #connector {
    position: absolute; inset: 0; width: 100vw; height: 100vh;
    pointer-events: none;
  }

  /* People (draggable cards) */
  .person {
    position: absolute; left: 0; top: 0;
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 12px 14px;
    user-select: none;
    cursor: grab;
    box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 0 1px rgba(229,9,20,.25) inset;
    display: flex; align-items: center; gap: 12px;
    min-width: 280px;
  }
  .person .avatar {
    flex: 0 0 auto; width: 72px; height: 72px; border-radius: 50%;
    overflow: hidden; background: #222;
    border: 1px solid rgba(255,255,255,.12);
  }
  .person .avatar img {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }
  .person .details { display: grid; gap: 4px; }
  .person .name { font-weight: 700; letter-spacing: .2px; }
  .person .title { font-size: .9rem; color: var(--muted); }
  .person .actions { margin-left: auto; display: flex; gap: 8px; }
  .btn {
    background: transparent; border: 1px solid var(--accent); color: var(--text);
    padding: 6px 10px; border-radius: 10px; cursor: pointer;
  }
  .btn:hover { background: rgba(229,9,20,.12); }

  /* Editor panel (modal) */
  .modal {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(0,0,0,.55);
  }
  .modal[open] { display: grid; }
  .dialog {
    width: min(560px, 92vw);
    background: #141826; border: 1px solid rgba(255,255,255,.1); border-radius: 16px;
    box-shadow: 0 30px 70px rgba(0,0,0,.5);
    padding: 18px;
  }
  .dialog h2 { margin: 4px 0 14px; font-size: 1.2rem; }
  .grid { display: grid; gap: 12px; }
  .row { display: grid; gap: 8px; }
  label { font-size: .9rem; color: var(--muted); }
  input[type="text"], input[type="url"] {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15);
    background: #0f1320; color: var(--text);
  }
  input[type="file"] { color: var(--muted); }
  .dialog .buttons {
    display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .btn.ghost { border-color: rgba(255,255,255,.2); }

  .banner-divider { position: fixed; top: 0; left: 0; right: 0; height: 1px; background: var(--accent); opacity: .6; }
</style>
</head>
<body>
  <div class="banner-divider"></div>

  <!-- Connector -->
  <svg id="connector" viewBox="0 0 100 100" preserveAspectRatio="none">
    <line id="link" x1="0" y1="0" x2="0" y2="0" stroke="#e50914" stroke-width="3" />
  </svg>

  <!-- Person A -->
  <div id="personA" class="person" style="transform: translate(180px, 220px);">
    <div class="avatar"><img id="imgA" alt="Person A photo" src="" /></div>
    <div class="details">
      <div class="name" id="nameA">Person A</div>
      <div class="title" id="titleA">Title goes here</div>
    </div>
    <div class="actions">
      <button class="btn" data-edit="A" aria-label="Edit Person A">Edit</button>
    </div>
  </div>

  <!-- Person B -->
  <div id="personB" class="person" style="transform: translate(620px, 220px);">
    <div class="avatar"><img id="imgB" alt="Person B photo" src="" /></div>
    <div class="details">
      <div class="name" id="nameB">Person B</div>
      <div class="title" id="titleB">Title goes here</div>
    </div>
    <div class="actions">
      <button class="btn" data-edit="B" aria-label="Edit Person B">Edit</button>
    </div>
  </div>

  <!-- Editor Modal -->
  <div class="modal" id="editor" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dialog">
      <h2 id="dlgTitle">Edit Person</h2>
      <div class="grid">
        <div class="row">
          <label for="target">Editing</label>
          <select id="target" class="btn ghost" style="width:max-content">
            <option value="A">Person A</option>
            <option value="B">Person B</option>
          </select>
        </div>
        <div class="row">
          <label for="name">Person Name</label>
          <input id="name" type="text" placeholder="e.g., Jane Doe" />
        </div>
        <div class="row">
          <label for="title">Person Title</label>
          <input id="title" type="text" placeholder="e.g., Head of Design" />
        </div>
        <div class="row">
          <label for="imgUrl">Image URL (optional)</label>
          <input id="imgUrl" type="url" placeholder="https://example.com/photo.jpg" />
          <small style="color:var(--muted)">If both file and URL are provided, the uploaded file takes priority.</small>
        </div>
        <div class="row">
          <label for="imgFile">Upload Image (optional)</label>
          <input id="imgFile" type="file" accept="image/*" />
        </div>
        <div class="buttons">
          <button class="btn ghost" id="clearImg" type="button">Clear Photo</button>
          <button class="btn" id="cancel" type="button">Cancel</button>
          <button class="btn primary" id="apply" type="button">Apply</button>
        </div>
      </div>
    </div>
  </div>

<script>
  // ========== Persistence (localStorage) ==========
  const STORE_KEY = 'connected-people:v1';

  // Read persisted state or return defaults
  function loadState() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return defaultState();
      const state = JSON.parse(raw);
      // Backfill any missing defaults for forward-compat
      return { A: { ...defaultState().A, ...state.A }, B: { ...defaultState().B, ...state.B } };
    } catch {
      return defaultState();
    }
  }

  function saveState(state) {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }

  function defaultState() {
    return {
      A: { name: 'Person A', title: 'Title goes here', imgSrc: '', imgUrl: '', x: 180, y: 220 },
      B: { name: 'Person B', title: 'Title goes here', imgSrc: '', imgUrl: '', x: 620, y: 220 }
    };
  }

  // ========== Elements / Connector ==========
  const svg  = document.getElementById('connector');
  const link = document.getElementById('link');
  const cardA = document.getElementById('personA');
  const cardB = document.getElementById('personB');

  const nameA = document.getElementById('nameA');
  const titleA = document.getElementById('titleA');
  const imgA = document.getElementById('imgA');

  const nameB = document.getElementById('nameB');
  const titleB = document.getElementById('titleB');
  const imgB = document.getElementById('imgB');

  let state = loadState();

  // Apply state to DOM
  function syncDOM() {
    // Names / titles / images
    nameA.textContent = state.A.name;
    titleA.textContent = state.A.title;
    if (state.A.imgSrc) imgA.src = state.A.imgSrc; else imgA.removeAttribute('src');

    nameB.textContent = state.B.name;
    titleB.textContent = state.B.title;
    if (state.B.imgSrc) imgB.src = state.B.imgSrc; else imgB.removeAttribute('src');

    // Positions
    cardA.style.transform = `translate(${state.A.x}px, ${state.A.y}px)`;
    cardB.style.transform = `translate(${state.B.x}px, ${state.B.y}px)`;

    sizeSVG();
    updateLine();
  }

  // Keep the SVG coordinate space in CSS pixels
  function sizeSVG() {
    svg.setAttribute('viewBox', `0 0 ${innerWidth} ${innerHeight}`);
  }
  function centerOf(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width/2, y: r.top + r.height/2 };
  }
  function updateLine() {
    const a = centerOf(cardA);
    const b = centerOf(cardB);
    link.setAttribute('x1', a.x);
    link.setAttribute('y1', a.y);
    link.setAttribute('x2', b.x);
    link.setAttribute('y2', b.y);
  }

  // Initial paint
  syncDOM();
  addEventListener('resize', () => { sizeSVG(); updateLine(); });

  // ========== Dragging (persists on mouseup) ==========
  let dragging = null, start = {x:0,y:0}, origin = {x:0,y:0};
  function getTranslate(el){
    const m = getComputedStyle(el).transform;
    if (m === 'none') return {x:0,y:0};
    const nums = m.match(/matrix\(([^)]+)\)/);
    if (!nums) return {x:0,y:0};
    const parts = nums[1].split(',').map(Number);
    return {x: parts[4], y: parts[5]};
  }
  function onDown(e){
    const el = e.currentTarget;
    if (e.target.closest('.actions')) return; // allow clicking buttons without dragging
    dragging = el; el.style.cursor = 'grabbing';
    origin = getTranslate(el);
    start = {x: e.clientX, y: e.clientY};
    e.preventDefault();
  }
  function onMove(e){
    if (!dragging) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    dragging.style.transform = `translate(${origin.x + dx}px, ${origin.y + dy}px)`;
    updateLine();
  }
  function onUp(){
    if (!dragging) return;
    dragging.style.cursor = 'grab';
    // Persist final position
    const t = getTranslate(dragging);
    if (dragging.id === 'personA') { state.A.x = t.x; state.A.y = t.y; }
    else                           { state.B.x = t.x; state.B.y = t.y; }
    saveState(state);
    dragging = null;
  }
  [cardA, cardB].forEach(el => {
    el.addEventListener('mousedown', onDown);
    el.addEventListener('dblclick', () => openEditor(el.id.endsWith('A') ? 'A' : 'B')); // quick edit
  });
  addEventListener('mousemove', onMove);
  addEventListener('mouseup', onUp);

  // ========== Editor Modal (persists on Apply) ==========
  const modal   = document.getElementById('editor');
  const sel     = document.getElementById('target');
  const nameIn  = document.getElementById('name');
  const titleIn = document.getElementById('title');
  const urlIn   = document.getElementById('imgUrl');
  const fileIn  = document.getElementById('imgFile');
  const applyBt = document.getElementById('apply');
  const cancelBt= document.getElementById('cancel');
  const clearBt = document.getElementById('clearImg');

  document.querySelectorAll('[data-edit]').forEach(b=>{
    b.addEventListener('click', ()=> openEditor(b.dataset.edit));
  });

  function openEditor(target){
    sel.value = target;
    const s = state[target];
    nameIn.value  = s.name || '';
    titleIn.value = s.title || '';
    urlIn.value   = s.imgUrl || '';
    fileIn.value  = '';
    modal.setAttribute('open','');
    setTimeout(()=> nameIn.focus(), 0);
  }
  function closeEditor(){
    modal.removeAttribute('open');
  }
  cancelBt.addEventListener('click', closeEditor);

  function targetParts(tag){
    return tag === 'A'
      ? { nameEl: nameA, titleEl: titleA, imgEl: imgA }
      : { nameEl: nameB, titleEl: titleB, imgEl: imgB };
  }

  // Apply changes (file has priority over URL) + persist
  applyBt.addEventListener('click', ()=>{
    const target = sel.value;
    const { nameEl, titleEl, imgEl } = targetParts(target);
    const s = state[target];

    s.name  = nameIn.value || (target === 'A' ? 'Person A' : 'Person B');
    s.title = titleIn.value || 'Title goes here';
    nameEl.textContent = s.name;
    titleEl.textContent = s.title;

    const url = urlIn.value.trim();
    if (fileIn.files && fileIn.files[0]) {
      const file = fileIn.files[0];
      const reader = new FileReader();
      reader.onload = () => {
        s.imgSrc = reader.result;  // data URL (persists as text)
        s.imgUrl = '';             // clear stored URL since file took priority
        imgEl.src = s.imgSrc;
        saveState(state);
        updateLine();
      };
      reader.readAsDataURL(file);
      closeEditor();
    } else if (url) {
      const testImg = new Image();
      testImg.onload = () => {
        s.imgSrc = url;  // store the URL directly
        s.imgUrl = url;
        imgEl.src = s.imgSrc;
        saveState(state);
        updateLine();
        closeEditor();
      };
      testImg.onerror = () => alert('Could not load image from URL. Please check the link.');
      testImg.src = url;
    } else {
      // Clear if neither provided
      s.imgSrc = '';
      s.imgUrl = '';
      imgEl.removeAttribute('src');
      saveState(state);
      closeEditor();
    }
  });

  // Clear photo quickly (and persist)
  clearBt.addEventListener('click', ()=>{
    const tgt = sel.value;
    const { imgEl } = targetParts(tgt);
    state[tgt].imgSrc = '';
    state[tgt].imgUrl = '';
    imgEl.removeAttribute('src');
    saveState(state);
  });

  // Close modal on backdrop click or Escape
  modal.addEventListener('click', (e)=> { if (e.target === modal) closeEditor(); });
  addEventListener('keydown', (e)=> { if (e.key === 'Escape' && modal.hasAttribute('open')) closeEditor(); });

  // One more update after fonts/layout settle
  requestAnimationFrame(updateLine);
</script>
</body>
</html>
