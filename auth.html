<form id="auth-form">
  <input type="email" id="email" placeholder="Email" required />
  <input type="password" id="password" placeholder="Password" required />
  <button type="submit">Sign In / Register</button>
</form>

<p id="auth-status"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabase = window.supabase.createClient(
    'https://eukgodthgusongsbhdwg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1a2dvZHRoZ3Vzb25nc2JoZHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1NjI1NjAsImV4cCI6MjA2NzEzODU2MH0.e8Gm9utDCQWDjSOJgh-VBioCQFX_aAWXz8rzigFgh4s'
  );

  const authForm = document.getElementById('auth-form');
  const status = document.getElementById('auth-status');

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    // First try to sign in
    let { error, data } = await supabase.auth.signInWithPassword({ email, password });

    if (error && error.message === 'Invalid login credentials') {
      // If no user, try to sign up
      ({ error } = await supabase.auth.signUp({ email, password }));
      if (error) {
        status.textContent = `Error signing up: ${error.message}`;
        return;
      }
      status.textContent = 'Signup successful! Check your email to confirm.';
    } else if (error) {
      status.textContent = `Sign-in error: ${error.message}`;
    } else {
      status.textContent = 'Login successful!';
    }
  });
</script>
