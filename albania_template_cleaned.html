<!DOCTYPE html>

<html lang="en">
    <head>
      <meta charset="utf-8"/>
      <title>Douze Points | Albania</title>

      <link href="countries2.css" rel="stylesheet" type="text/css"/>

      <script src="albania_dynamic_video_column.js"></script>
      <script src="https://unpkg.com/lucide@latest"></script>

    </head>

    <body data-country="al" oncontextmenu="return false">

    <!-- HEADER FROM JS -->

      <div id="header-container"></div>

      <!-- Main Content Layout -->

      <div class="container">

      <!-- Display Sidebar from .js file -->

        <div id="sidebar-container"></div>

          <script src="sidebar_countries.js" type="text/javascript"></script>

          <div class="main-content">

            <div class="header-bar" style="display: flex; justify-content: flex-end; margin-bottom: 40px; margin-right: 20px;">

              <div style="flex: 1;"></div> <!-- Push the sort-controls to the right -->

              <div class="sort-controls" style="display: flex; align-items: center; padding-right: 20px;">

                <label for="sort-options">
                  <i data-lucide="list-filter" style="margin-right: 15px;"></i>
                </label>

                <select id="sort-options" style="width: 160px; padding: 5px; font-size: 11px;">

                  <option value="year-asc">Year (asc)</option>
                  <option value="year-desc">Year (desc)</option>
                  <option value="artist">Artist Name</option>
                  <option value="song">Song Title</option>

                </select>

              </div>

            </div>

            <div class="grid-container">

              <!-- New Albania entries will be dynamically inserted here -->
            
            </div>

          </div>

      </div>

      <!-- MODAL -->

      <div class="modal" id="videoModal" onclick="GDriveCloseModal(event)">

        <div class="modal-content">

          <span class="close-button" onclick="GDriveCloseModal(event)">×</span>

          <video autoplay="" controls="" controlslist="nodownload" id="modalVideo" oncontextmenu="return false" style="display: none;"></video>

          <iframe allow="autoplay; encrypted-media" frameborder="0" id="modalIframe" sandbox="allow-scripts allow-same-origin" style="display: none;"></iframe>

        </div>

      </div>

      <!-- Display footer from .js file -->

      <div id="footer"></div>

      <script src="footer.js" type="text/javascript"></script>

      <script src="modal2.js" type="text/javascript"></script>

      <script src="sorting.js" type="text/javascript"></script>

      <script src="header.js" type="text/javascript"></script>

    </body>

</html>
