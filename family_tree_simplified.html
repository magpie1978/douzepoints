<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Family Tree — View‑only</title>
<style>
  :root { --bg:#0f111a; --panel:#1c1f2b; --accent:#e50914; --text:#e8e8e8; --muted:#bdbdbd; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--text);
         font-family:'Raleway',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }

  #scroll { position:absolute; inset:0; overflow:auto; }
  #world  { position:relative; width:2400px; height:1600px; --gs:40px; }
  #world.grid {
    background-image:
      linear-gradient(to right, rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: var(--gs) var(--gs);
    background-position: 0 0;
  }

  #connector { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .edge,.bus,.stem,.drop,.spouse { stroke:var(--accent); stroke-width:3; fill:none; vector-effect:non-scaling-stroke; }
  .spouse { stroke-width:2; opacity:.9; }
  .dotted { stroke-dasharray: 6 6; }

  .person { position:absolute; z-index:1; display:grid; grid-template-columns:1fr 2fr; width:360px; height:120px;
            background:var(--panel); border:2px solid var(--accent); border-radius:14px; overflow:hidden;
            user-select:none; box-shadow:0 6px 18px rgba(0,0,0,.35), 0 0 0 1px rgba(229,9,20,.25) inset; }
  .avatar { width:100%; height:100%; background:#222; border-radius:0 !important; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .details { display:flex; flex-direction:column; justify-content:center; padding:12px 16px; }
  .name { font-weight:700; font-size:1.1rem; }
  .title { font-size:.9rem; color:var(--muted); margin-top:4px; }
</style>
</head>
<body>
<div id="scroll">
  <div id="world" class="grid">
    <svg id="connector" viewBox="0 0 2400 1600" preserveAspectRatio="none"></svg>
    <div id="cards-root"></div>
  </div>
</div>
<script>
// --- View-only Family Tree (robust load + connectors) ---
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTyAtltPPDRBFKDKCDr8VA-Ii_vh-5MgoqspQfxlfhtPerjaW95IZeJAnfMvnavMD4sWwwSbt9AQtwo/pub?gid=0&single=true&output=csv";
const CARD_W=360, CARD_H=120, SNAP_GRID=40, PADDING=200;
const world=document.getElementById('world'), svg=document.getElementById('connector'), cards=document.getElementById('cards-root');

// ---------- Helpers
const snap=v=>Math.round(v/SNAP_GRID)*SNAP_GRID; const clamp0=v=>Math.max(0,v);
const ensureLine=(id,cls)=>{let l=document.getElementById(id);if(!l){l=document.createElementNS('http://www.w3.org/2000/svg','line');l.id=id;l.classList.add(cls);svg.appendChild(l);}return l;};
const removeByPrefix=(p)=>svg.querySelectorAll(`[id^="${p}"]`).forEach(e=>e.remove());

function updateWorldSize(nodes){
  let maxX=1200,maxY=800;Object.values(nodes).forEach(n=>{maxX=Math.max(maxX,n.x+CARD_W);maxY=Math.max(maxY,n.y+CARD_H);});
  world.style.width=(maxX+PADDING)+"px"; world.style.height=(maxY+PADDING)+"px";
  // Keep SVG user space in sync with pixel space so lines line up with cards
  const w = world.scrollWidth || world.clientWidth; const h = world.scrollHeight || world.clientHeight;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
}

// ---------- CSV
function fetchCsv(url){return fetch(url,{mode:'cors'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();});}
function parseCsv(t){const out=[];let i=0,f='',row=[],q=false;while(i<t.length){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='
'||c==='
'){if(f.length||row.length){row.push(f);out.push(row);row=[];f='';}if(c==='
'&&t[i+1]==='
')i++;}else f+=c;i++;}if(f.length||row.length){row.push(f);out.push(row);}return out;}
function rowsFromCsvTable(rows){if(!rows.length)return[];const H=rows[0].map(h=>String(h||'').trim().toLowerCase());return rows.slice(1).map(r=>{const o={};H.forEach((h,i)=>o[h]=((r[i]??'')+'' ).trim());return o;}).filter(o=>o.id||o.code||o.slug);}

// ---------- Build graph state (resilient header mapping)
function pick(o, keys){for(const k of keys){if(o[k]) return o[k];}return ''}
function toBool(v){const s=String(v||'').toLowerCase();return s==='true'||s==='1'||s==='yes'||s==='y';}
function toNum(v){const n=Number(v);return Number.isFinite(n)?n:null;}

function buildState(rows){
  const nodes={};
  rows.forEach(r=>{
    const id = pick(r,['id','code','slug']); if(!id) return;
    const name = pick(r,['name','full_name','label']) || id;
    const title = pick(r,['title','role','subtitle']);
    const img = pick(r,['img','image','image_url','photo','picture']);
    const x = clamp0(snap(toNum(pick(r,['x','posx','left'])) ?? 400));
    const y = clamp0(snap(toNum(pick(r,['y','posy','top'])) ?? 400));
    const mother = pick(r,['mother_id','mother','mom','mum']);
    const father = pick(r,['father_id','father','dad']);
    const partners = pick(r,['partners','spouses','spouse_ids']);
    nodes[id]={ id, name, title, img, x, y, mother, father, illegit: toBool(pick(r,['illegitimate','illegit','illeg'])) , partners: partners? partners.split(';').map(s=>s.trim()).filter(Boolean):[] };
  });
  // Symmetric partners (if present)
  Object.values(nodes).forEach(n=>{n.partners=n.partners.filter(pid=>nodes[pid]);});
  Object.values(nodes).forEach(n=>{n.partners.forEach(pid=>{const p=nodes[pid];if(p && !p.partners.includes(n.id)) p.partners.push(n.id);});});

  // Edges: single parent -> child (dotted if illegitimate), Tri-groups for two parents
  const singleEdges=[]; const triMap=new Map();
  Object.values(nodes).forEach(c=>{
    const m = nodes[c.mother]||null; const f = nodes[c.father]||null;
    if(m && f && m.id!==f.id){
      const [a,b] = [m.id,f.id].sort(); const k=a+'|'+b;
      if(!triMap.has(k)) triMap.set(k,{p1:a,p2:b,children:[]});
      triMap.get(k).children.push(c.id);
    } else if(m || f){
      const p=(m||f).id; singleEdges.push({p, c:c.id, dotted:c.illegit});
    }
  });
  return {nodes, singleEdges, triGroups:[...triMap.values()]};
}

// ---------- Rendering
function renderNodes(state){
  cards.innerHTML='';
  for(const n of Object.values(state.nodes)){
    const el=document.createElement('div'); el.id=n.id; el.className='person';
    el.style.transform=`translate(${n.x}px,${n.y}px)`;
    const safeImg = n.img || '';
    el.innerHTML=`<div class='avatar'>${safeImg?`<img src='${safeImg}' alt='${n.name}'>`:''}</div><div class='details'><div class='name'>${n.name}</div><div class='title'>${n.title||''}</div></div>`;
    cards.appendChild(el);
  }
}

const centerX = n => n.x + CARD_W/2; const centerY = n => n.y + CARD_H/2; const topY = n => n.y; const botY = n => n.y + CARD_H;
function drawSingleEdges(state){
  removeByPrefix('edge-');
  state.singleEdges.forEach(e=>{
    const p=state.nodes[e.p], c=state.nodes[e.c]; if(!p||!c) return;
    const id=`edge-${e.p}-${e.c}`; const l=ensureLine(id,'edge');
    if(e.dotted) l.classList.add('dotted'); else l.classList.remove('dotted');
    l.setAttribute('x1', centerX(p)); l.setAttribute('y1', centerY(p));
    l.setAttribute('x2', centerX(c)); l.setAttribute('y2', centerY(c));
  });
}
function drawTriGroups(state){
  removeByPrefix('stem-'); removeByPrefix('bus-'); removeByPrefix('drop-');
  state.triGroups.forEach(g=>{
    const p1=state.nodes[g.p1], p2=state.nodes[g.p2]; if(!p1||!p2||!g.children.length) return;
    const midX=(centerX(p1)+centerX(p2))/2, midY=(centerY(p1)+centerY(p2))/2;
    const kids=g.children.map(id=>state.nodes[id]).filter(Boolean); if(!kids.length) return;
    const xs=kids.map(k=>centerX(k)), tops=kids.map(k=>topY(k)), bots=kids.map(k=>botY(k));
    const minTop=Math.min.apply(null,tops), maxBot=Math.max.apply(null,bots);
    const GAP=24, MIN_STEM=24; let busY;
    if(minTop>midY){ busY=Math.max(midY+MIN_STEM, minTop-GAP); }
    else if(maxBot<midY){ busY=Math.min(midY-MIN_STEM, maxBot+GAP); }
    else{ busY=midY+MIN_STEM; }
    const minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
    const stem=ensureLine(`stem-${g.p1}|${g.p2}`,'stem'); stem.setAttribute('x1',midX); stem.setAttribute('y1',midY); stem.setAttribute('x2',midX); stem.setAttribute('y2',busY);
    const bus=ensureLine(`bus-${g.p1}|${g.p2}`,'bus'); bus.setAttribute('x1',minX); bus.setAttribute('y1',busY); bus.setAttribute('x2',maxX); bus.setAttribute('y2',busY);
    kids.forEach(k=>{
      const drop=ensureLine(`drop-${g.p1}|${g.p2}-${k.id}`,'drop');
      const anchorY = Math.abs(busY - topY(k)) <= Math.abs(busY - botY(k)) ? topY(k) : botY(k);
      drop.setAttribute('x1', centerX(k)); drop.setAttribute('y1', busY);
      drop.setAttribute('x2', centerX(k)); drop.setAttribute('y2', anchorY);
    });
  });
}

function render(state){
  renderNodes(state);
  updateWorldSize(state.nodes);
  drawSingleEdges(state);
  drawTriGroups(state);
}

function init(){
  fetchCsv(CSV_URL)
    .then(parseCsv)
    .then(rowsFromCsvTable)
    .then(rows=>{ if(!rows.length) throw new Error('CSV had no rows'); return rows; })
    .then(buildState)
    .then(s=>{ console.log('Loaded nodes:', Object.keys(s.nodes).length); render(s); })
    .catch(e=>{ console.error(e); const msg=document.createElement('div'); msg.style.padding='16px'; msg.textContent='Failed to load family tree: '+e.message; document.body.appendChild(msg); });
}
init();
</script>
</body>
</html>
