<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Douze Points</title>
  <link rel="stylesheet" type="text/css" href="style/supabase_combined.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/supabase_footer.js"></script>
  <script src="js/supabase_modal_fixed_global.js"></script>
</head>

<body oncontextmenu="return false">
  <!-- HEADER -->
  <div id="header-container"></div>
  <script type="module" src="js/supabase_header_module.js"></script>

  <br><br>

  <!-- CAROUSEL 1: Winners -->
  <div class="carousel-section">
    <div class="section-header">
      <h4>Eurovision Winners</h4>
      <a class="view-more" href="supabase_winners.html">VIEW MORE</a>
    </div>
    <div class="carousel-wrapper">
      <button class="carousel-button" onclick="scrollCarousel(-1,'carouselTrack1')">&#10094;</button>
      <div class="carousel-container"><div class="carousel-track" id="carouselTrack1"></div></div>
      <button class="carousel-button" onclick="scrollCarousel(1,'carouselTrack1')">&#10095;</button>
    </div>
  </div>

  <br>

  <!-- CAROUSEL 2: Malmö 2024 -->
  <div class="carousel-section">
    <div class="section-header">
      <h4>Malmö 2024</h4>
      <a class="view-more" href="supabase_edition.html?edition=2024">VIEW ALL</a>
    </div>
    <div class="carousel-wrapper">
      <button class="carousel-button" onclick="scrollCarousel(-1, 'carouselTrack2')">&#10094;</button>
      <div class="carousel-container"><div class="carousel-track" id="carouselTrack2"></div></div>
      <button class="carousel-button" onclick="scrollCarousel(1, 'carouselTrack2')">&#10095;</button>
    </div>
  </div>

  <br>

  <!-- CAROUSEL 3: Fan Favorites -->
  <div class="carousel-section">
    <div class="section-header">
      <h4>Fan Favorites</h4>
      <a class="view-more" href="supabase_fan-favorites.html">VIEW MORE</a>
    </div>
    <div class="carousel-wrapper">
      <button class="carousel-button" onclick="scrollCarousel(-1,'carouselTrack3')">&#10094;</button>
      <div class="carousel-container"><div class="carousel-track" id="carouselTrack3"></div></div>
      <button class="carousel-button" onclick="scrollCarousel(1,'carouselTrack3')">&#10095;</button>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="videoModal" onclick="GDriveCloseModal(event)">
    <div class="modal-content">
      <span class="close-button" onclick="GDriveCloseModal(event)">×</span>
      <video autoplay controls controlslist="nodownload" id="modalVideo" style="display: none;" oncontextmenu="return false"></video>
      <iframe allow="autoplay; encrypted-media" allowfullscreen frameborder="0" id="modalIframe" style="display: none;"></iframe>
    </div>
  </div>

  <!-- CAROUSEL SCRIPTS -->
  <script src="js/icons.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://eukgodthgusongsbhdwg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1a2dvZHRoZ3Vzb25nc2JoZHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1NjI1NjAsImV4cCI6MjA2NzEzODU2MH0.e8Gm9utDCQWDjSOJgh-VBioCQFX_aAWXz8rzigFgh4s';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function scrollCarousel(direction, trackId) {
      const track = document.getElementById(trackId);
      const container = track.closest('.carousel-container');
      const itemWidth = track.querySelector('.carousel-video-item')?.offsetWidth + 20;
      const scrollAmount = itemWidth * 5;
      if (track && container) {
        container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
      }
    }

    function createVideoItem(entry) {
      const countryCode = entry.Country_Code?.toLowerCase();
      const div = document.createElement('div');
      div.className = "carousel-video-item";
      div.onclick = () => GDriveOpenModalWithVideo(entry.Video_URL);

      div.innerHTML = `
        <div class="preview-container">
          <img src="images/${entry.Year}-${countryCode?.toUpperCase()}.jpeg" alt="${entry.Artist}" />
        </div>
        <div class="video-title-with-icon" onclick="event.stopPropagation()">
          <a href="country.html?country=${entry.Country}">
            <img class="flag-icon" src="flags/${countryCode}.png" alt="Flag">
          </a>
          <div class="video-title-text">
            <b>${entry.Artist}</b><br>${entry.Song}<br>${entry.Year}
          </div>
        </div>`;
      return div;
    }

    async function loadCarouselData(trackId, filterFn, sortFn, limit) {
      const { data, error } = await supabase.from("douzepoints").select("*");
      if (error || !data) return;
      const entries = data.filter(filterFn).sort(sortFn).slice(0, limit);
      const track = document.getElementById(trackId);
      if (track) {
        track.innerHTML = "";
        entries.forEach(row => track.appendChild(createVideoItem(row)));
      }
    }

    // Load all 3 carousels
    loadCarouselData("carouselTrack1", row => row.Final_Rank === 1, (a, b) => b.Year - a.Year, 10);
    loadCarouselData("carouselTrack2", row => row.Year === 2024, () => 0, 20);
    loadCarouselData("carouselTrack3", row => (row.FanFave || '').trim().toUpperCase() === 'Y', (a, b) => b.Year - a.Year, 10);
  </script>
</body>
</html>
