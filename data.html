<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eurovision Grand Final (2024)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:400,600&display=swap"/>
  <style>
    body {
      font-family: 'Raleway', sans-serif;
      background: #0f111a;
      color: #ccc;
      margin: 0;
      padding: 20px;
    }

    .table-wrapper {
      max-width: 1100px;
      margin: auto;
      background: #181a24;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .table-header {
      padding: 20px;
      font-size: 18px;
      font-weight: 600;
      border-bottom: 1px solid #2a2d3a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #1f212d;
      cursor: pointer;
    }

    th, td {
      padding: 14px 20px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid #2a2d3a;
    }

    th {
      color: #aaa;
      font-weight: 500;
      user-select: none;
    }

    td img.flag {
      width: 20px;
      margin-right: 10px;
      vertical-align: middle;
    }

    td .status {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: inline-block;
    }

    .winner {
      background-color: #28a74530;
      color: #28a745;
    }

    .non-winner {
      background-color: #6c757d30;
      color: #adb5bd;
    }

    th.sort-asc::after,
    th.sort-desc::after {
      display: inline-block;
      margin-left: 6px;
      font-size: 12px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<div class="table-wrapper">
  <div class="table-header">Eurovision Grand Final Entries (2024)</div>
  <table>
    <thead>
      <tr>
        <th data-key="FinalRunningOrder">Running Order</th>
        <th data-key="Country">Country</th>
        <th data-key="Artist">Artist</th>
        <th data-key="Song">Song</th>
        <th data-key="Final_TelevotePoints">Televote</th>
        <th data-key="Final_JuryPoints">Jury</th>
        <th data-key="Final_TotalPoints">Total Points</th>
        <th data-key="FinalRank">Result</th>
      </tr>
    </thead>
    <tbody id="eurovision-table-body"></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
  let eurovisionData = [];
  let currentSortKey = null;
  let currentSortDir = 'desc';

  async function loadTableData() {
    const response = await fetch('./data/DouzePoints.csv');
    const csvText = await response.text();

    return new Promise(resolve => {
      Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
        complete: results => {
          eurovisionData = results.data
            .filter(row =>
              row.Year === '2024' &&
              row.FinalRunningOrder && row.FinalRunningOrder.trim() !== ''
            )
            .map(row => ({ ...row }));
          resolve();
        }
      });
    });
  }

  function renderTable() {
    const tbody = document.getElementById('eurovision-table-body');
    tbody.innerHTML = '';

    eurovisionData.forEach(row => {
      const countryCode = (row.Country_Code || '').toLowerCase();
      const flag = `<img class="flag" src="flags/${countryCode}.png" alt="${row.Country} flag"/>`;
      const status = row.FinalRank === "1"
        ? '<span class="status winner">Winner</span>'
        : '<span class="status non-winner">Qualified</span>';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.FinalRunningOrder}</td>
        <td>${flag}${row.Country}</td>
        <td>${row.Artist}</td>
        <td>${row.Song}</td>
        <td>${row.Final_TelevotePoints || 0}</td>
        <td>${row.Final_JuryPoints || 0}</td>
        <td>${row.Final_TotalPoints || 0}</td>
        <td>${status}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function sortBy(key) {
    if (currentSortKey === key) {
      currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
    } else {
      currentSortKey = key;
      currentSortDir = ['Final_TotalPoints', 'Final_JuryPoints', 'Final_TelevotePoints'].includes(key)
        ? 'desc' : 'asc';
    }

    const isNumeric = !isNaN(parseFloat(eurovisionData[0][key]));

    eurovisionData.sort((a, b) => {
      const aVal = isNumeric ? parseFloat(a[key] || 0) : (a[key] || '').toLowerCase();
      const bVal = isNumeric ? parseFloat(b[key] || 0) : (b[key] || '').toLowerCase();
      if (aVal < bVal) return currentSortDir === 'asc' ? -1 : 1;
      if (aVal > bVal) return currentSortDir === 'asc' ? 1 : -1;
      return 0;
    });

    document.querySelectorAll("th").forEach(th => {
      th.classList.remove("sort-asc", "sort-desc");
      if (th.dataset.key === key) {
        th.classList.add(currentSortDir === 'asc' ? 'sort-asc' : 'sort-desc');
      }
    });

    renderTable();
  }

  document.addEventListener("DOMContentLoaded", () => {
    loadTableData().then(() => {
      sortBy("Final_TotalPoints"); // Default: Total Points, descending
    });

    document.querySelectorAll("th[data-key]").forEach(th => {
      th.addEventListener("click", () => sortBy(th.dataset.key));
    });
  });
</script>

</body>
</html>
