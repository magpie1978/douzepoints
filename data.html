<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eurovision Grand Final (2024)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:400,600&display=swap"/>
  <style>
    body {
      font-family: 'Raleway', sans-serif;
      background: #0f111a;
      color: #ccc;
      margin: 0;
      padding: 20px;
    }

    .table-wrapper {
      max-width: 1280px;
      margin: auto;
      background: #181a24;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .table-header {
      padding: 20px;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid #2a2d3a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #1f212d;
      cursor: pointer;
    }

    th, td {
      padding: 14px 20px;
      text-align: left;
      font-size: 12px;
      border-bottom: 1px solid #2a2d3a;
    }

    th {
      color: #aaa;
      font-weight: 500;
      user-select: none;
    }

     .flag {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
      vertical-align: middle;
      margin-right: 20px; /* This creates the gap */
    }
    
    .country-name {
      vertical-align: middle;
    }


    /* Limit width of Result column */
    th:nth-child(1), td:nth-child(1) {
      width: 50px;
      max-width: 50px;
      text-align: center;
    }
    
    /* prevent line wrapping in column 2 - flag and country name */
    td:nth-child(2), th:nth-child(2) {
      white-space: nowrap;
      min-width: 160px;
    }

    
    td .status {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: inline-block;
    }

    .winner {
      background-color: #28a74530;
      color: #28a745;
    }

    .non-winner {
      background-color: #6c757d30;
      color: #adb5bd;
    }

    th.sort-asc::after,
    th.sort-desc::after {
      display: inline-block;
      margin-left: 6px;
      font-size: 12px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<div class="table-wrapper">

  <!--  adds year drop-down -->
  <div class="table-controls" style="text-align: right; padding: 10px 20px;">
    <label for="yearSelect" style="margin-right: 10px; color: #aaa;">Select Year:</label>
    <select id="yearSelect" style="padding: 5px 10px; font-size: 14px; background: #1f212d; color: #ccc; border: none; border-radius: 6px;">
      <!-- Options will be populated dynamically -->
    </select>
  </div>

  
  <div class="table-header">Eurovision Grand Final Entries (2024)</div>
  <table>
    <thead>
      <tr>
        <th data-key="Final_Rank">Result</th>
        <th data-key="Country">Country</th>
        <th data-key="Artist">Artist</th>
        <th data-key="Song">Song</th>
        <th data-key="FinalRunningOrder">R/O</th>
        <th data-key="Final_TelevotePoints">Televote Pts</th>
        <th data-key="Final_TelevoteRank">Televote Rank</th>
        <th data-key="Final_JuryPoints">Jury Pts</th>
        <th data-key="Final_JuryRank">Jury Rank</th>
        <th data-key="Final_TotalPoints">Total Points</th>
      </tr>
    </thead>
    <tbody id="eurovision-table-body"></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
let eurovisionData = [];
let currentYear = '2025';
let currentSortKey = null;
let currentSortDir = 'desc';
let allRawData = [];

  
function formatOrdinal(n) {
  n = parseInt(n);
  if (isNaN(n)) return '-';
  const s = ["th", "st", "nd", "rd"];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

  
async function loadCSVData() {
  const response = await fetch('./data/DouzePoints.csv');
  const csvText = await response.text();

  return new Promise(resolve => {
    Papa.parse(csvText, {
      header: true,
      skipEmptyLines: true,
      complete: results => {
        allRawData = results.data;
        populateYearDropdown();
        loadTableData(currentYear);
        resolve();
      }
    });
  });
}

function populateYearDropdown() {
  const years = [...new Set(allRawData.map(row => row.Year).filter(Boolean))].sort((a, b) => b - a);
  const select = document.getElementById('yearSelect');
  select.innerHTML = '';
  years.forEach(year => {
    const option = document.createElement('option');
    option.value = year;
    option.textContent = year;
    if (year === currentYear) option.selected = true;
    select.appendChild(option);
  });
}

function loadTableData(year) {
  currentYear = year;

  eurovisionData = allRawData
    .filter(row =>
      row.Year === year &&
      row.FinalRunningOrder && row.FinalRunningOrder.trim() !== ''
    );

  // ✅ Reset default sort every time year changes
  currentSortKey = "Final_TotalPoints";
  currentSortDir = "desc";
  sortBy(currentSortKey);
}

function renderTable() {
  const tbody = document.getElementById('eurovision-table-body');
  tbody.innerHTML = '';

  eurovisionData.forEach(row => {
    const countryCode = (row.Country_Code || '').toLowerCase();
    const flag = `<img class="flag" src="flags/${countryCode}.png" alt="${row.Country} flag"/>`;
    const status = row.FinalRank === "1"
      ? '<span class="status winner">Winner</span>'
      : '<span class="status non-winner">Qualified</span>';

    const tr = document.createElement('tr');


tr.innerHTML = `
  <td>${formatOrdinal(row.Final_Rank)}</td>
  <td>${flag}<span class="country-name">${row.Country}</span></td>
  <td>${row.Artist}</td>
  <td>${row.Song}</td>
  <td>${row.FinalRunningOrder}</td>
  <td>${row.Final_TelevotePoints || 0}</td>
  <td>${formatOrdinal(row.Final_TelevoteRank)}</td>
  <td>${row.Final_JuryPoints || 0}</td>
  <td>${formatOrdinal(row.Final_JuryRank)}</td>
  <td>${row.Final_TotalPoints || 0}</td>
`;




    
    tr.innerHTML = `
      <td>${formatOrdinal(row.Final_Rank)}</td>
      <td>${flag}<span class="country-name">${row.Country}</span></td>
      <td>${row.Artist}</td>
      <td>${row.Song}</td>
      <td>${row.FinalRunningOrder}</td>
      <td>${row.Final_TelevotePoints || 0}</td>
      <td>${formatOrdinal(row.Final_TelevoteRank)}</td>
      <td>${row.Final_JuryPoints || 0}</td>
      <td>${formatOrdinal(row.Final_JuryRank)}</td>
      <td>${row.Final_TotalPoints || 0}</td>
    `;
      
    tbody.appendChild(tr);
  });
}

function sortBy(key) {
  const isNumeric = !isNaN(parseFloat(eurovisionData[0][key]));

  if (currentSortKey === key) {
    // Toggle direction if same key
    currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
  } else {
    currentSortKey = key;
    currentSortDir = isNumeric ? 'desc' : 'asc'; // ✅ Numeric columns default to descending
  }

  eurovisionData.sort((a, b) => {
    const aVal = isNumeric ? parseFloat(a[key] || 0) : (a[key] || '').toLowerCase();
    const bVal = isNumeric ? parseFloat(b[key] || 0) : (b[key] || '').toLowerCase();

    if (aVal < bVal) return currentSortDir === 'asc' ? -1 : 1;
    if (aVal > bVal) return currentSortDir === 'asc' ? 1 : -1;
    return 0;
  });

  document.querySelectorAll("th").forEach(th => {
    th.classList.remove("sort-asc", "sort-desc");
    if (th.dataset.key === key) {
      th.classList.add(currentSortDir === 'asc' ? 'sort-asc' : 'sort-desc');
    }
  });

  renderTable();
}


  document.querySelectorAll("th").forEach(th => {
    th.classList.remove("sort-asc", "sort-desc");
    if (th.dataset.key === key) {
      th.classList.add(currentSortDir === 'asc' ? 'sort-asc' : 'sort-desc');
    }
  });

  renderTable();
}

document.addEventListener("DOMContentLoaded", () => {
  loadCSVData();

  document.getElementById("yearSelect").addEventListener("change", (e) => {
    loadTableData(e.target.value);
  });

  document.querySelectorAll("th[data-key]").forEach(th => {
    th.addEventListener("click", () => sortBy(th.dataset.key));
  });
});
</script>

</body>
</html>
