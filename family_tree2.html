<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dynamic People Graph (Persistent)</title>
<style>
  :root {
    --bg: #0f111a;
    --panel: #1c1f2b;
    --accent: #e50914;
    --text: #e8e8e8;
    --muted: #bdbdbd;
    --highlight: #3a4057;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Raleway', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  /* Toolbar */
  .toolbar {
    position: fixed; top: 10px; left: 12px; z-index: 10;
    display: flex; gap: 8px; align-items: center;
    background: rgba(20, 24, 38, .85);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px; padding: 8px;
    backdrop-filter: blur(6px);
  }
  .btn {
    background: transparent; border: 1px solid var(--accent); color: var(--text);
    padding: 6px 10px; border-radius: 10px; cursor: pointer;
  }
  .btn:hover { background: rgba(229,9,20,.12); }
  .btn.toggled { background: rgba(229,9,20,.2); }

  /* Banner divider for style */
  .banner-divider { position: fixed; top: 0; left: 0; right: 0; height: 1px; background: var(--accent); opacity: .6; z-index: 9; }

  /* Full-viewport SVG under the cards */
  #connector {
    position: absolute; inset: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 0;
  }
  /* Each connector line */
  .edge { stroke: var(--accent); stroke-width: 3; }

  /* Card (person) — grid with 1:2 columns so image fills left third */
  .person {
    position: absolute; z-index: 1;  /* above lines */
    display: grid; grid-template-columns: 1fr 2fr;
    width: 360px; height: 120px;
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 14px; overflow: hidden;
    cursor: grab; user-select: none;
    box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 0 1px rgba(229,9,20,.25) inset;
    transition: box-shadow .12s ease;
  }
  .person.connect-pending { outline: 2px dashed var(--accent); outline-offset: -6px; }
  .person:hover { box-shadow: 0 10px 24px rgba(0,0,0,.45), 0 0 0 1px rgba(229,9,20,.35) inset; }

  /* Rectangular photo covering left third */
  .avatar { width:100%; height:100%; background:#222; border-radius:0 !important; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; border-radius:0 !important; }
  /* Kill any lingering circular styles */
  .avatar, .avatar * { border-radius: 0 !important; }

  /* Details */
  .details { display:flex; flex-direction:column; justify-content:center; padding: 12px 16px; }
  .name { font-weight: 700; font-size: 1.1rem; }
  .title { font-size: .9rem; color: var(--muted); margin-top: 4px; }
  .actions { margin-top: 10px; }
  .actions .btn { padding: 4px 8px; }

  /* Modal editor */
  .modal {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(0,0,0,.55); z-index: 20;
  }
  .modal[open] { display: grid; }
  .dialog {
    width: min(560px, 92vw);
    background: #141826; border: 1px solid rgba(255,255,255,.1); border-radius: 16px;
    box-shadow: 0 30px 70px rgba(0,0,0,.5);
    padding: 18px;
  }
  .grid { display: grid; gap: 12px; }
  .row { display: grid; gap: 8px; }
  label { font-size: .9rem; color: var(--muted); }
  input[type="text"], input[type="url"] {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15);
    background: #0f1320; color: var(--text);
  }
  input[type="file"] { color: var(--muted); }
  .dialog .buttons { display:flex; gap:10px; justify-content:flex-end; margin-top:8px; }
  .btn.ghost { border-color: rgba(255,255,255,.2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
  <div class="banner-divider"></div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="btn" id="addPerson">Add Person</button>
    <button class="btn" id="connectToggle" title="Click to select two people to connect">Connect</button>
    <button class="btn ghost" id="resetAll" title="Clear everything">Reset</button>
  </div>

  <!-- SVG connectors -->
  <svg id="connector" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>

  <!-- Cards will be injected here -->
  <div id="cards-root"></div>

  <!-- Editor Modal -->
  <div class="modal" id="editor" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dialog">
      <h2 id="dlgTitle">Edit Person</h2>
      <div class="grid">
        <div class="row">
          <label for="name">Person Name</label>
          <input id="name" type="text" placeholder="e.g., Jane Doe" />
        </div>
        <div class="row">
          <label for="title">Person Title</label>
          <input id="title" type="text" placeholder="e.g., Head of Design" />
        </div>
        <div class="row">
          <label for="imgUrl">Image URL (optional)</label>
          <input id="imgUrl" type="url" placeholder="https://example.com/photo.jpg" />
          <small style="color:var(--muted)">If both file and URL are provided, the uploaded file takes priority.</small>
        </div>
        <div class="row">
          <label for="imgFile">Upload Image (optional)</label>
          <input id="imgFile" type="file" accept="image/*" />
        </div>
        <div class="buttons">
          <button class="btn ghost" id="clearImg" type="button">Clear Photo</button>
          <button class="btn" id="cancel" type="button">Cancel</button>
          <button class="btn primary" id="apply" type="button">Apply</button>
        </div>
      </div>
    </div>
  </div>

<script>
/* ========= PERSISTENCE ========= */
const STORE_KEY = 'people-graph:v1';
function defaultState() {
  return {
    nodes: {
      A1: { id:'A1', name:'Person A', title:'Title goes here', imgSrc:'', x:180, y:220 },
      B2: { id:'B2', name:'Person B', title:'Title goes here', imgSrc:'', x:620, y:220 }
    },
    edges: [{ from:'A1', to:'B2' }],
    nextId: 3
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : defaultState();
  } catch { return defaultState(); }
}
function saveState() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

/* ========= ELEMENTS ========= */
const svg = document.getElementById('connector');
const cardsRoot = document.getElementById('cards-root');
const addBtn = document.getElementById('addPerson');
const connectBtn = document.getElementById('connectToggle');
const resetBtn = document.getElementById('resetAll');

const editor = document.getElementById('editor');
const nameIn = document.getElementById('name');
const titleIn = document.getElementById('title');
const urlIn = document.getElementById('imgUrl');
const fileIn = document.getElementById('imgFile');
const applyBt = document.getElementById('apply');
const cancelBt = document.getElementById('cancel');
const clearBt = document.getElementById('clearImg');

/* ========= STATE ========= */
let state = loadState();
let connectMode = false;
let pendingConnectId = null;
let editingId = null;

/* ========= GEOMETRY / LINES ========= */
function sizeSVG() {
  svg.setAttribute('viewBox', `0 0 ${innerWidth} ${innerHeight}`);
}
function cardCenter(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}
function ensureEdgeElement(edge) {
  const id = `edge-${edge.from}-${edge.to}`;
  let line = document.getElementById(id);
  if (!line) {
    line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.classList.add('edge');
    line.id = id;
    line.dataset.from = edge.from;
    line.dataset.to = edge.to;
    svg.appendChild(line);
  }
  return line;
}
function updateEdgePosition(edge) {
  const fromEl = document.getElementById(edge.from);
  const toEl   = document.getElementById(edge.to);
  if (!fromEl || !toEl) return;
  const a = cardCenter(fromEl);
  const b = cardCenter(toEl);
  const line = ensureEdgeElement(edge);
  line.setAttribute('x1', a.x);
  line.setAttribute('y1', a.y);
  line.setAttribute('x2', b.x);
  line.setAttribute('y2', b.y);
}
function updateAllEdges() {
  state.edges.forEach(updateEdgePosition);
}
function updateEdgesForNode(nodeId) {
  state.edges.forEach(e => {
    if (e.from === nodeId || e.to === nodeId) updateEdgePosition(e);
  });
}

/* ========= RENDERING ========= */
function renderNode(node) {
  let el = document.getElementById(node.id);
  if (!el) {
    el = document.createElement('div');
    el.id = node.id;
    el.className = 'person';
    el.innerHTML = `
      <div class="avatar"><img alt="${node.name} photo"></div>
      <div class="details">
        <div class="name"></div>
        <div class="title"></div>
        <div class="actions"><button class="btn" data-edit>Edit</button></div>
      </div>
    `;
    cardsRoot.appendChild(el);
    attachCardEvents(el);
  }
  // content
  el.querySelector('.name').textContent = node.name || '';
  el.querySelector('.title').textContent = node.title || '';
  const img = el.querySelector('img');
  if (node.imgSrc) img.src = node.imgSrc; else img.removeAttribute('src');

  // position
  el.style.transform = `translate(${node.x}px, ${node.y}px)`;
}
function renderAll() {
  // remove cards that no longer exist
  [...cardsRoot.children].forEach(ch => {
    if (!state.nodes[ch.id]) ch.remove();
  });
  // add/update cards
  Object.values(state.nodes).forEach(renderNode);

  sizeSVG();
  // remove lines that no longer exist
  [...svg.querySelectorAll('.edge')].forEach(line => {
    const exists = state.edges.some(e => line.dataset.from === e.from && line.dataset.to === e.to);
    if (!exists) line.remove();
  });
  // add/update lines
  state.edges.forEach(updateEdgePosition);
}

/* ========= DEDUP HELPERS ========= */
function edgeKey(a,b) {
  // undirected; keep (min,max)
  return a < b ? `${a}|${b}` : `${b}|${a}`;
}
function hasEdge(a,b) {
  const k = edgeKey(a,b);
  return state.edges.some(e => edgeKey(e.from,e.to) === k);
}

/* ========= DRAGGING ========= */
let dragging = null, start = {x:0,y:0}, origin = {x:0,y:0};
function getTranslate(el){
  const m = getComputedStyle(el).transform;
  if (m === 'none') return {x:0,y:0};
  const parts = m.match(/matrix\\(([^)]+)\\)/);
  if (!parts) return {x:0,y:0};
  const nums = parts[1].split(',').map(Number);
  return {x: nums[4], y: nums[5]};
}
function onDown(e){
  const el = e.currentTarget;
  // In connect mode, clicks go to selection logic (no drag)
  if (connectMode) { handleConnectClick(el.id); return; }
  if (e.target.closest('.actions')) return; // allow clicking Edit button
  dragging = el; el.style.cursor = 'grabbing';
  origin = getTranslate(el);
  start = {x: e.clientX, y: e.clientY};
  e.preventDefault();
}
function onMove(e){
  if (!dragging) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  dragging.style.transform = `translate(${origin.x + dx}px, ${origin.y + dy}px)`;
  updateEdgesForNode(dragging.id);
}
function onUp(){
  if (!dragging) return;
  dragging.style.cursor = 'grab';
  const pos = getTranslate(dragging);
  const n = state.nodes[dragging.id];
  n.x = pos.x; n.y = pos.y;
  saveState();
  dragging = null;
}
function attachCardEvents(el){
  el.addEventListener('mousedown', onDown);
  addEventListener('mousemove', onMove);
  addEventListener('mouseup', onUp);
  el.addEventListener('dblclick', () => openEditor(el.id));

  // Edit button
  el.querySelector('[data-edit]').addEventListener('click', (ev) => {
    ev.stopPropagation();
    openEditor(el.id);
  });
}

/* ========= CONNECT MODE ========= */
function handleConnectClick(id) {
  const el = document.getElementById(id);
  if (!pendingConnectId) {
    pendingConnectId = id;
    el.classList.add('connect-pending');
    return;
  }
  if (pendingConnectId === id) {
    // clicked same card; cancel
    el.classList.remove('connect-pending');
    pendingConnectId = null;
    return;
  }
  // Make edge if it doesn't exist
  const a = pendingConnectId, b = id;
  document.getElementById(a)?.classList.remove('connect-pending');
  pendingConnectId = null;

  if (hasEdge(a,b)) return;
  state.edges.push({ from: a < b ? a : b, to: a < b ? b : a }); // store normalized
  saveState();
  updateEdgePosition({ from: a < b ? a : b, to: a < b ? b : a });
}

/* ========= EDITOR ========= */
function openEditor(id) {
  editingId = id;
  const n = state.nodes[id];
  nameIn.value = n.name || '';
  titleIn.value = n.title || '';
  urlIn.value = '';
  fileIn.value = '';
  editor.setAttribute('open','');
  setTimeout(()=> nameIn.focus(), 0);
}
function closeEditor() {
  editor.removeAttribute('open');
  editingId = null;
}
cancelBt.addEventListener('click', closeEditor);
editor.addEventListener('click', (e)=> { if (e.target === editor) closeEditor(); });
addEventListener('keydown', (e)=> { if (e.key === 'Escape' && editor.hasAttribute('open')) closeEditor(); });

applyBt.addEventListener('click', () => {
  if (!editingId) return;
  const n = state.nodes[editingId];

  n.name = nameIn.value || n.name || 'Person';
  n.title = titleIn.value || '';
  const imgEl = document.querySelector(`#${CSS.escape(editingId)} img`);

  const done = () => { saveState(); renderNode(n); updateEdgesForNode(editingId); closeEditor(); };

  if (fileIn.files && fileIn.files[0]) {
    const reader = new FileReader();
    reader.onload = () => { n.imgSrc = reader.result; imgEl.src = n.imgSrc; done(); };
    reader.readAsDataURL(fileIn.files[0]);
  } else if (urlIn.value.trim()) {
    const u = urlIn.value.trim();
    const test = new Image();
    test.onload = () => { n.imgSrc = u; imgEl.src = u; done(); };
    test.onerror = () => alert('Could not load image from URL. Please check the link.');
    test.src = u;
  } else {
    // No image change
    done();
  }
});
clearBt.addEventListener('click', () => {
  if (!editingId) return;
  const n = state.nodes[editingId];
  n.imgSrc = '';
  const imgEl = document.querySelector(`#${CSS.escape(editingId)} img`);
  imgEl.removeAttribute('src');
  saveState();
});

/* ========= ACTIONS ========= */
addBtn.addEventListener('click', () => {
  // Create a new node near screen center with a slight offset
  const id = `N${state.nextId++}`;
  const baseX = innerWidth/2 - 180;  // card is 360 wide
  const baseY = innerHeight/2 - 60;  // card is 120 high
  const jitter = (n)=> Math.round(n + (Math.random()*120 - 60));
  state.nodes[id] = {
    id, name: `Person ${id}`, title: 'Title goes here', imgSrc: '',
    x: jitter(baseX), y: jitter(baseY)
  };
  saveState();
  renderNode(state.nodes[id]);
  updateAllEdges();
  openEditor(id);
});

connectBtn.addEventListener('click', () => {
  connectMode = !connectMode;
  connectBtn.classList.toggle('toggled', connectMode);
  // Clear pending selection if turning off
  if (!connectMode && pendingConnectId) {
    document.getElementById(pendingConnectId)?.classList.remove('connect-pending');
    pendingConnectId = null;
  }
});

resetBtn.addEventListener('click', () => {
  if (!confirm('Clear all people and connections?')) return;
  state = defaultState();
  saveState();
  // Wipe DOM
  cardsRoot.innerHTML = '';
  svg.innerHTML = '';
  renderAll();
});

/* ========= INIT ========= */
function init() {
  sizeSVG();
  renderAll();
}
addEventListener('resize', () => { sizeSVG(); updateAllEdges(); });
init();
</script>
</body>
</html>
