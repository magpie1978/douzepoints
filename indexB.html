</head>
<body>

    <button class="carousel-button" onclick="scrollCarousel(-1, 'carouselTrack1')">&#10094;</button>
    <div class="carousel-container">
      <div class="carousel-track" id="carouselTrack1">
        <div class="video-item"><div class="preview-container"><img src="#" alt="1"></div></div>

        <div class="video-item"><div class="preview-container"><img src="#" alt="3"></div></div>
        <div class="video-item"><div class="preview-container"><img src="#" alt="4"></div></div>
        <div class="video-item"><div class="preview-container"><img src="#" alt="5"></div></div>
        <div class="video-item"><div class="preview-container"><img src="#" alt="6"></div></div>
        <div class="video-item"><div class="preview-container"><img src="#" alt="7"></div></div>
      </div>
    </div>
    <button class="carousel-button" onclick="scrollCarousel(1, 'carouselTrack1')">&#10095;</button>
  </div>
</body>
</html>
