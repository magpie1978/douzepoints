<!-- modal.html -->
<div id="videoModal" class="modal">

  <div class="modal-content">

    <!-- Close button now anchored to video frame -->
    <button class="close-button" aria-label="Close video" onclick="GDriveCloseModal(event)">×</button>

    <!-- MP4 -->
    <video id="modalVideo" controls playsinline></video>

    <!-- Google Drive -->
    <iframe id="modalIframe" allowfullscreen></iframe>

  </div>
</div>
