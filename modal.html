<div id="videoModal" class="dp-modal">
    <div class="dp-modal-content" onclick="event.stopPropagation()">

        <!-- Close Button -->
        <button class="dp-close-btn" id="dpModalCloseBtn">×</button>

        <!-- Title -->
        <div class="dp-modal-title" id="dpModalTitle"></div>

        <!-- Video Container -->
        <div class="dp-video-wrapper">
            <video id="modalVideo" class="dp-video" controls playsinline></video>
            <iframe id="modalIframe" class="dp-iframe" allowfullscreen></iframe>
        </div>

    </div>
</div>
