<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>About</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    
        <!-- STYLES -->
        <link rel="stylesheet" href="style/login.css">
        <link rel="stylesheet" href="style/footer.css">
        <link rel="stylesheet" href="style/combined.css">        
        <script src="/js/favicons.js"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
    </head>

    <style>
        /* Make page full height */
        html, body {
            height: 100%;
            margin: 0;
        }
        
        /* Use flexbox layout */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Push footer to bottom */
        #footer {
            margin-top: auto;
        }
    </style>
    
    <body>
     
        <!-- HEADER -->
        <div id="header-container"></div>
        <script type="module" src="js/header-no-banner.js"></script>

        
        <!-- Top area just used to position the login pill -->
        <div class="banner">
            <!-- Floating LOGIN BOX -->
            <div class="login-box">
                <div class="login-strip">
                    <input type="email" id="login-email" placeholder="Email">
                    <input type="password" id="login-password" placeholder="Password">
                    <button id="login-btn" class="login-btn">Log In</button>
                </div>
    
                <p id="login-error" style="
                    color:#e50914;
                    font-size:13px;
                    margin:6px 0 0 2px;
                    display:none;                /* hidden by default */
                    text-shadow:0 2px 6px rgba(0,0,0,0.4);
                    "></p>
            </div>
        </div>
        <div class="big-title">About Douze Points</div>
        <br>
        <div class="big-subtitle">Your hub for Eurovision performances</div>
        
        <!--<div class="plans-title">Choose Your Plan</div>-->

    
        <!-- SIGN-UP MODAL -->
        <div id="signup-modal-overlay">
            <div id="signup-modal">
                <h3>Create Account</h3>
                    <p id="signup-error" style="
                    color:#e50914;
                    font-size:14px;
                    margin-top:0;
                    margin-bottom:10px;
                    min-height:18px;
                    text-align:center;
                "></p>
    
                <input id="signup-email" type="email" placeholder="Email">
                <input id="signup-password" type="password" placeholder="Password">
                <input id="signup-promo" type="text" placeholder="Promo Code (optional)">
    
                <button id="signup-submit" class="modal-btn primary">Create Account</button>
                <button id="signup-close" class="modal-btn secondary">Close</button>
            </div>
        </div>
    
        <script type="module" src="js/login.js"></script>
        <script src="js/footer.js" defer></script>
        
        <div id="footer"></div>
    </body>
</html>
