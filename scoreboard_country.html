<!DOCTYPE html>
<html lang="en">
  <head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eurovision Country Results</title>
  
  <link rel="stylesheet" href="style/combined.css" />
  <link rel="stylesheet" href="style/scoreboard.css" />
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  </head>
  
  <body>
  
  <div id="header-container"></div>
    <script type="module" src="js/header.js"></script>
    <div class="main-content">
      <div class="table-aligned-container">
        <h1>Country Eurovision Results</h1>
        <div class="table-controls">
          <div class="control-block">
            <label>Country</label>
            <select id="countrySelect"></select>
          </div>
        </div>
  
        <h2>Semi-Final Appearances</h2>

        <div class="table-wrapper">
          <div class="table-scroll">
            <table>
              <thead id="semiHead">
              
                <!-- 🔹 GROUP HEADER ROW -->
                <tr>
                  <th rowspan="2">Year</th>
                  <th rowspan="2">Artist</th>
                  <th rowspan="2">Play</th>
                  <th rowspan="2">Song</th>
                  <th rowspan="2">Total Points</th>
                  <th rowspan="2">Rank</th>
                  <th colspan="3">Jury</th>
                  <th colspan="3">Televote</th>
                  <th rowspan="2">Semi Size</th>
                </tr>
              
                <!-- 🔹 SUB HEADER ROW -->
                <tr>
                  <th>Points</th>
                  <th>Rank</th>
                  <th>Qual</th>
              
                  <th>Points</th>
                  <th>Rank</th>
                  <th>Qual</th>
                </tr>
              </thead>            
              <tbody id="semiBody"></tbody>
            </table>
          </div>
        </div>

        <h2>Final Appearances</h2>
        
        <div class="table-wrapper">
          <div class="table-scroll">
            <table>
              <thead id="finalHead">
                <tr>
                  <th>Status</th>
                  <th>Year</th>
                  <th>Play</th>
                  <th>Artist</th>
                  <th>Song</th>
                  <th>Rank</th>
                  <th>Total Points</th>
                </tr>
              </thead>
              <tbody id="finalBody"></tbody>
            </table>
          </div>
        </div>
  
    <script type="module" src="js/scoreboard_country3.js"></script>
  
  </body>
</html>
